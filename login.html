<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM LOGIC ─ ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --white:#fff; --soft:#ebedf0; --border:#e6e8ec;
  --border-strong:#d6d9df; --text:#1d1e22; --text2:#6c6e75; --dim:#a7a9b0;
  --accent:#16a34a; --btn:#1f2024; --red:#dc2626;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.box{ width:100%; max-width:380px; }
.brand{ text-align:center; margin-bottom:26px; }
.logo{ display:inline-flex; align-items:center; gap:9px; }
.prism-icon{ width:34px; height:34px; }
.logo-text{
  font-size:21px; font-weight:700; letter-spacing:1px;
  background:linear-gradient(135deg,#3b82f6,#22c55e,#ef4444);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.brand-sub{ font-size:11px; color:var(--text2); letter-spacing:2px; margin-top:6px; }
.card{
  background:var(--white); border:1px solid var(--border);
  border-radius:14px; padding:30px 26px;
}
.card h1{ font-size:16px; font-weight:700; margin-bottom:4px; }
.card .lead{ font-size:12.5px; color:var(--text2); margin-bottom:22px; }
.field{ margin-bottom:15px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; }
.field input{
  width:100%; padding:11px 13px; font-size:14px; font-family:inherit;
  border:1px solid var(--border-strong); border-radius:9px;
  background:var(--white); color:var(--text);
}
.field input:focus{ outline:none; border-color:var(--accent); }
.btn{
  width:100%; padding:12px; font-size:14px; font-weight:700; font-family:inherit;
  color:#fff; background:var(--btn); border:0; border-radius:9px; cursor:pointer; margin-top:6px;
}
.btn:disabled{ opacity:.55; cursor:default; }
.msg{ font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; display:none; }
.msg.err{ display:block; background:rgba(220,38,38,.09); color:var(--red); }
.foot{ font-size:11px; color:var(--dim); text-align:center; margin-top:18px; line-height:1.7; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="logo">
      <svg class="prism-icon" viewBox="0 0 36 36" aria-hidden="true">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#22c55e"/>
          <stop offset="100%" stop-color="#ef4444"/></linearGradient></defs>
        <polygon points="18,3 33,31 3,31" fill="none" stroke="url(#g)" stroke-width="2.4"/>
      </svg>
      <span class="logo-text">PRISM LOGIC</span>
    </div>
    <div class="brand-sub">PERSONA DESIGN DIAGNOSTICS</div>
  </div>
  <div class="card">
    <h1>ログイン</h1>
    <div class="lead">受検依頼の発行・管理にはログインが必要です。</div>
    <div class="msg" id="msg"></div>
    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="pw">パスワード</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
    </div>
    <button class="btn" id="loginBtn">ログイン</button>
  </div>
  <div class="foot">アカウントは管理者が発行します。<br>ログインできない場合は担当者へご連絡ください。</div>
</div>
<script>
const SUPABASE_URL = 'https://ntsqmhcyvopnsxdhtwzj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e6kLk_fC9OIiaMhiiqKjXA_pFE1KKc1';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const msg = document.getElementById('msg');
const btn = document.getElementById('loginBtn');
const emailEl = document.getElementById('email');
const pwEl = document.getElementById('pw');

function showErr(t){ msg.textContent = t; msg.className = 'msg err'; }

async function checkSession(){
  if (!sb){ showErr('接続に失敗しました。ページを再読み込みしてください。'); return; }
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (session) location.replace('requests.html');
  } catch (e) {}
}

async function login(){
  if (!sb){ showErr('接続に失敗しました。ページを再読み込みしてください。'); return; }
  const email = emailEl.value.trim();
  const password = pwEl.value;
  if (!email || !password){ showErr('メールアドレスとパスワードを入力してください。'); return; }
  btn.disabled = true; btn.textContent = 'ログイン中…'; msg.className = 'msg';
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error){
      const m = error.message || '';
      if (/Invalid login credentials/i.test(m)) showErr('メールアドレスまたはパスワードが違います。');
      else if (/Email not confirmed/i.test(m)) showErr('メールアドレスが未確認です。管理者に確認を依頼してください。');
      else showErr('ログインに失敗しました：' + m);
      btn.disabled = false; btn.textContent = 'ログイン';
      return;
    }
    location.replace('requests.html');
  } catch (e) {
    showErr('接続に失敗しました。通信環境をご確認ください。');
    btn.disabled = false; btn.textContent = 'ログイン';
  }
}

btn.onclick = login;
pwEl.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') pwEl.focus(); });
checkSession();
</script>
</body>
</html>
