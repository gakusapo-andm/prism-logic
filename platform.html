  /* ── デモ回答データ生成 ───────────────────────────────── */
  function seedDemo() {
    const nEl = document.getElementById('demo-n');
    let per = nEl ? parseInt(nEl.value, 10) : 12;
    if (!Number.isFinite(per) || per < 1) per = 12;
    if (per > 40) per = 40;

    if (S.cfg.jobTypes.length === 0 || S.cfg.ranks.length === 0) {
      S.respStatus = { type: 'err', msg: '⚠ 先に「初期設定」で職種・役職を定義してください。' };
      renderResponses();
      return;
    }

    const SURNAMES = ['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤',
      '吉田','山田','佐々木','山口','松本','井上','木村','林','清水','斎藤'];
    const HYGIENE = ['H2', 'C3', 'C4'];   // 全職種で高め
    const FIT     = ['H1', 'H4'];         // 注目職種だけ高い
    const SOFT    = ['H3', 'C7'];         // 注目職種がやや高い
    const focusJob = S.cfg.jobTypes.includes('営業') ? '営業' : S.cfg.jobTypes[0];

    const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
    const wHigh = () => Math.random() < 0.85 ? rnd(6, 7) : rnd(4, 5);
    const wLow  = () => Math.random() < 0.70 ? rnd(1, 3) : rnd(4, 5);
    const wMidH = () => Math.random() < 0.65 ? rnd(6, 7) : rnd(4, 5);
    const wMid  = () => rnd(3, 7);
    const pickDir = (biasA) => {
      const r = Math.random();
      if (biasA) return r < 0.78 ? 'A' : (r < 0.90 ? 'neutral' : 'B');
      return r < 0.40 ? 'A' : (r < 0.65 ? 'B' : 'neutral');
    };
    const shuffleLight = arr => {
      const a = arr.slice();
      if (Math.random() < 0.6) {
        const i = rnd(0, a.length - 2);
        [a[i], a[i + 1]] = [a[i + 1], a[i]];
      }
      return a;
    };
    const G3_FOCUS  = ['seika', 'hyoka', 'sairyo', 'nakama', 'anshin'];
    const G3_OTHERS = ['nakama', 'seika', 'anshin', 'sairyo', 'hyoka'];

    const fresh = [];
    let counter = 0;
    S.cfg.jobTypes.forEach(job => {
      const isFocus = job === focusJob;
      for (let k = 0; k < per; k++) {
        counter++;
        const rank = S.cfg.ranks[k % S.cfg.ranks.length];
        const answers = {};
        // [D-5] Tier 1 必須 ＋ 人事が選択した Tier 2/3 項目のみ回答を生成
        const demoEnabled = S.cfg.enabledItems || [];
        TIER1_ITEMS.filter(it =>
          (it.tier || 1) === 1 || demoEnabled.indexOf(it.id) !== -1
        ).forEach(item => {
          let s;
          if (HYGIENE.includes(item.id)) s = wHigh();
          else if (FIT.includes(item.id)) s = isFocus ? wHigh() : wLow();
          else if (SOFT.includes(item.id)) s = isFocus ? wMidH() : wMid();
          else s = wMid();

          if (item.ranking) {
            // G3: 動機の重要度(strength) + 5ドライバーの順位。注目職種は動機を強く重視。
            const gStr = isFocus ? wHigh() : wMid();
            answers[item.id] = { strength: gStr, ranking: shuffleLight(isFocus ? G3_FOCUS : G3_OTHERS) };
          } else if (item.intensityOnly) {
            answers[item.id] = { strength: s, direction: 'neutral' };
          } else {
            const biasA = isFocus && item.id === 'H4';
            answers[item.id] = { strength: s, direction: pickDir(biasA) };
          }
        });
        const ageMin = rnd(0, 60 * 24 * 9);   // 直近9日内
        fresh.push({
          respondentId: 'emp_demo_' + Date.now().toString(36) + '_' + counter,
          name: SURNAMES[(counter - 1) % SURNAMES.length] + '（デモ' + counter + '）',
          jobType: job,
          rank: rank,
          answeredAt: new Date(Date.now() - ageMin * 60000).toISOString(),
          tier: ((S.cfg.enabledItems || []).some(id => {
            const it = TIER1_ITEMS.find(x => x.id === id);
            return it && (it.tier || 1) === 3;
          }) ? 3 : ((S.cfg.enabledItems || []).length ? 2 : 1)),
          answers,
        });
      }
    });

    try {
      // 既存のデモ回答のみ除去し、実回答は残す
      const kept = S.responses.filter(r => !String(r.respondentId).startsWith('emp_demo_'));
      const merged = kept.concat(fresh);
      localStorage.setItem('prism_raw_responses', JSON.stringify(merged));
      S.responses = merged;
      S.respStatus = { type: 'ok',
        msg: `✓ デモ回答 ${fresh.length} 件を生成しました（実回答 ${kept.length} 件は保持）。`
           + `「集計実行」タブに進めます。` };
    } catch (e) {
      S.respStatus = { type: 'err', msg: '⚠ 保存に失敗しました：' + esc(e.message) };
    }
    renderTabs();
    renderResponses();
  }

  /* ============================================================
     ③ 集計実行
     ============================================================ */
  function valueOptionsFor(type, selected) {
    let opts = [];
    if (type === 'jobType') opts = S.cfg.jobTypes;
    else if (type === 'rank') opts = S.cfg.ranks;
    else if (type === 'custom') opts = S.cfg.customGroups.map(g => ({ v: g.groupId, l: g.name }));
    if (type === 'all' || type === 'others') return '';
    if (opts.length === 0) {
      return `<option value="">（未定義）</option>`;
    }
    return opts.map(o => {
      const v = typeof o === 'object' ? o.v : o;
      const l = typeof o === 'object' ? o.l : o;
      return `<option value="${esc(v)}" ${v === selected ? 'selected' : ''}>${esc(l)}</option>`;
    }).join('');
  }

  function specFromAgg(side) {
    const type = side === 'target' ? S.agg.targetType : S.agg.compareType;
    const value = side === 'target' ? S.agg.targetValue : S.agg.compareValue;
    if (type === 'all' || type === 'others') return { type, value: null };
    return { type, value };
  }

  function captureAggInputs() {
    const pn = document.getElementById('agg-name');
    if (pn) S.agg.personaName = pn.value;
    const tt = document.getElementById('agg-target-type');
    const tv = document.getElementById('agg-target-value');
    const ct = document.getElementById('agg-compare-type');
    const cv = document.getElementById('agg-compare-value');
    if (tt) S.agg.targetType = tt.value;
    if (tv && !tv.disabled) S.agg.targetValue = tv.value;
    if (ct) S.agg.compareType = ct.value;
    if (cv && !cv.disabled) S.agg.compareValue = cv.value;
    /* [変更] カスタムグループ名（集計タブに移設）を取り込む */
    document.querySelectorAll('[data-cg-name]').forEach(el => {
      const gi = +el.getAttribute('data-cg-name');
      if (S.cfg.customGroups[gi]) S.cfg.customGroups[gi].name = el.value.trim() || '無題グループ';
    });
  }

  function renderAggregate() {
    const ready = S.responses.length > 0 && S.cfg.jobTypes.length > 0 && S.cfg.ranks.length > 0;

    // 既定値の補完
    if (!S.agg.targetValue && S.agg.targetType === 'jobType')
      S.agg.targetValue = S.cfg.jobTypes[0] || '';
    if (S.agg.targetType === 'rank' && !S.cfg.ranks.includes(S.agg.targetValue))
      S.agg.targetValue = S.cfg.ranks[0] || '';

    const typeSelect = (id, val, withOthers) => `
      <select id="${id}" data-act="agg-ctl">
        <option value="all" ${val === 'all' ? 'selected' : ''}>全社員</option>
        <option value="jobType" ${val === 'jobType' ? 'selected' : ''}>職種</option>
        <option value="rank" ${val === 'rank' ? 'selected' : ''}>役職</option>
        <option value="custom" ${val === 'custom' ? 'selected' : ''}>カスタムグループ</option>
        ${withOthers ? `<option value="others" ${val === 'others' ? 'selected' : ''}>対象以外（補集合）</option>` : ''}
      </select>`;

    const tNeedsVal = S.agg.targetType === 'jobType' || S.agg.targetType === 'rank' || S.agg.targetType === 'custom';
    const cNeedsVal = S.agg.compareType === 'jobType' || S.agg.compareType === 'rank' || S.agg.compareType === 'custom';

    // プレビュー
    let preview = '';
    if (ready) {
      const tSpec = specFromAgg('target');
      const cSpec = specFromAgg('compare');
      let tN = 0, cN = 0;
      try { tN = resolveGroupMembers(tSpec, S.responses, S.cfg, tSpec).length; } catch (e) {}
      try { cN = resolveGroupMembers(cSpec, S.responses, S.cfg, tSpec).length; } catch (e) {}
      preview = `
        <div class="preview">

          <div class="pv"><b>${cN}</b><span>比較 ${esc(groupLabel(cSpec))}</span></div>

    // [変更] カスタムグループは集計実行タブで管理（任意・在メモリ＋自動保存）

      ? S.cfg.customGroups.map((g, gi) => renderCustomGroup(g, gi)).join('')
      : `<div class="cg-empty" style="padding:6px 0 12px;">カスタムグループは未作成です。任意のメンバー集合（例: 営業ハイパフォーマー候補）を作れます。</div>`;

        <div class="card-head">
          <div class="card-title">集計実行</div>

          ⚠ 集計には<strong>企業設定</strong>と<strong>1件以上の回答</strong>が必要です。
          「初期設定」で職種・役職を定義し、「回答状況」で回答を用意してください。
        </div>` : `<div class="callout">
          集計は1回実行して <strong>personaResult</strong> を生成・保存します（案Y）。
          結果ページ群はこの保存データを読むだけです。
        </div>`}

        <div class="section-label">ペルソナ名</div>
        <div class="field">
          <input type="text" id="agg-name" value="${esc(S.agg.personaName)}"
            placeholder="例: 営業職 採用ペルソナ" ${ready ? '' : 'disabled'}>
        </div>

        <div class="section-label">カスタムグループ（任意）</div>
        <div class="field-hint" style="margin:-4px 0 10px;">
          職種・役職とは別に、指名したメンバーの集合を作れます。下の対象／比較グループで「カスタムグループ」として選択できます。編集は自動保存されます。
        </div>
        ${cgHtml}
        <button class="btn btn-sm" data-act="add-cg">+ グループを追加</button>

        <div class="section-label">対象グループ（このグループが特に重視する条件を抽出）</div>
        <div class="field-row">
          <div class="field"><label class="field-label">種別</label>${typeSelect('agg-target-type', S.agg.targetType, false)}</div>
          <div class="field"><label class="field-label">値</label>
            <select id="agg-target-value" data-act="agg-ctl" ${tNeedsVal ? '' : 'disabled'}>
              ${tNeedsVal ? valueOptionsFor(S.agg.targetType, S.agg.targetValue) : '<option>—</option>'}
            </select>
          </div>
        </div>

        <div class="section-label">比較グループ（Fit 判定の対比対象）</div>
        <div class="field-row">
          <div class="field"><label class="field-label">種別</label>${typeSelect('agg-compare-type', S.agg.compareType, true)}</div>
          <div class="field"><label class="field-label">値</label>
            <select id="agg-compare-value" data-act="agg-ctl" ${cNeedsVal ? '' : 'disabled'}>
              ${cNeedsVal ? valueOptionsFor(S.agg.compareType, S.agg.compareValue) : '<option>—</option>'}
            </select>
          </div>
        </div>
        ${preview}

        <div class="section-label">集計モード</div>
        <div class="mode-opts">
          <div class="mode-opt ${S.agg.mode === 'a' ? 'selected' : ''}" data-act="agg-mode" data-arg="a">
            <div class="mode-radio"></div>
            <div><div class="mode-name">(a) 現状追認型</div>
              <div class="mode-desc">データ通りに分類します。標準。</div></div>
          </div>
          <div class="mode-opt ${S.agg.mode === 'b' ? 'selected' : ''}" data-act="agg-mode" data-arg="b">
            <div class="mode-radio"></div>
            <div><div class="mode-name">(b) 未来志向型</div>
              <div class="mode-desc">算出後に代表者が分類を手動で上書き可能（監査証跡が残る）。</div></div>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary btn-block" data-act="run-agg" ${ready ? '' : 'disabled'}>
            集計を実行
          </button>
        </div>
        ${S.aggStatus ? `<div class="status ${S.aggStatus.type}">${S.aggStatus.msg}</div>` : ''}
        ${S.lastResult ? renderResultSummary(S.lastResult) : ''}
      </div>`;
  }

  /* ── 分類カウント ─────────────────────────────────────── */
  function classificationCounts(persona) {
    // [D-8] dev_* キーを持たせる。これが無いと dev_* 項目が else 分岐で
    //       未分類に誤計上される（classifyItem v10 で Tier2/3 が dev_* を返すため）。
    const c = { hygiene: 0, fit: 0, soft_fit: 0, profile: 0, unclassified: 0,
                dev_high: 0, dev_mid: 0, dev_low: 0 };
    (persona.items || []).forEach(it => {
      if (c[it.classification] != null) c[it.classification]++;
      else c.unclassified++;
    });
    c.dev = c.dev_high + c.dev_mid + c.dev_low;   // [D-8] 育成テーマ（dev_*）合計
    return c;
  }

  function renderResultSummary(p) {
    const c = classificationCounts(p);
    const cell = (key, label) => `
      <div class="cls ${key}">
        <div class="cls-num">${c[key]}</div>
        <div class="cls-name">${label}</div>
      </div>`;
    const small = (p.dataQuality && p.dataQuality.smallGroupsExcludedFromHygiene) || [];
    return `
      <div class="divider"></div>
      <div class="section-label">直近の集計結果</div>
      <div class="status ok">✓ <strong>${esc(p.personaName)}</strong> を保存しました
        （${fmtDateTime(p.calculatedAt)}）。結果ページ群の最新データになりました。</div>
      <div style="font-size:12px; color:var(--text-secondary); margin:10px 0 2px;">
        対象 ${esc(groupLabel(p.targetGroup))} <b>${p.sampleSizes.target}名</b>
        ／ 比較 ${esc(groupLabel(p.compareGroup))} <b>${p.sampleSizes.others}名</b>
        ／ 全社 <b>${p.sampleSizes.all}名</b> ／ モード(${p.mode})
      </div>
      <div class="cls-grid">
        ${cell('hygiene', 'HYGIENE')}
        ${cell('fit', 'FIT')}
        ${cell('soft_fit', 'SOFT FIT')}
        ${cell('profile', 'PROFILE')}
        ${cell('dev', '育成テーマ')}
        ${cell('unclassified', '未分類')}
      </div>
      ${small.length ? `<div class="status warn">
        ⚠ 小グループ（${small.map(s => esc(s.value)).join('・')}）は Hygiene 横断判定から除外されました。
      </div>` : ''}
      <div class="btn-row">
        <button class="btn btn-sm" data-act="open-results">結果ページを開く</button>
        <button class="btn btn-sm" data-act="open-detail">詳細セクションを開く</button>
        <button class="btn btn-sm btn-ghost" data-act="tab" data-arg="personas">ペルソナ一覧へ</button>
      </div>`;
  }

  /* ── 集計の実行 ───────────────────────────────────────── */
  function runAggregation() {
    captureAggInputs();
    if (S.responses.length === 0) {
      S.aggStatus = { type: 'err', msg: '⚠ 回答が0件です。集計できません。' };
      renderAggregate();
      return;
    }
    const tSpec = specFromAgg('target');
    const cSpec = specFromAgg('compare');

    if ((tSpec.type === 'jobType' || tSpec.type === 'rank' || tSpec.type === 'custom') && !tSpec.value) {
      S.aggStatus = { type: 'err', msg: '⚠ 対象グループの値を選択してください。' };
      renderAggregate();
      return;
    }
    if ((cSpec.type === 'jobType' || cSpec.type === 'rank' || cSpec.type === 'custom') && !cSpec.value) {
      S.aggStatus = { type: 'err', msg: '⚠ 比較グループの値を選択してください。' };
      renderAggregate();
      return;
    }

    let tN = 0, cN = 0;
    try {
      tN = resolveGroupMembers(tSpec, S.responses, S.cfg, tSpec).length;
      cN = resolveGroupMembers(cSpec, S.responses, S.cfg, tSpec).length;
    } catch (e) {}

    const warnings = [];
    if (tN === 0) warnings.push('対象グループの該当者が0名です（多くの項目が「分類不能」になります）');
    if (cN === 0) warnings.push('比較グループの該当者が0名です（Fit／Soft Fit が判定できません）');
    if (tSpec.type === 'all') warnings.push('対象が全社員のため Fit 判定（特定グループの突出）は意味を持ちません');
    if (tSpec.type === cSpec.type && tSpec.value === cSpec.value && tSpec.type !== 'others')
      warnings.push('対象と比較が同一グループです。差分は常に0になります');

    const personaName = (S.agg.personaName || '').trim() || (groupLabel(tSpec) + ' 採用ペルソナ');

    let persona;
    try {
      persona = aggregatePersona({
        rawResponses: S.responses,
        companyConfig: S.cfg,
        personaName: personaName,
        targetGroup: tSpec,
        compareGroup: cSpec,
        mode: S.agg.mode,
      });
      // 集計ロジックは companyName を出力しないため、結果ページ群（PERSONA.companyName
      // を参照）向けに付与する。ロジック本体は改変しない。
      persona.companyName = S.cfg.companyName;
      PrismStorage.savePersonaResult(persona);
      S.personas = PrismStorage.loadPersonaResults() || [];
      S.lastResult = persona;
      S.agg.personaName = personaName;
      S.aggStatus = warnings.length
        ? { type: 'warn', msg: '✓ 集計を保存しました。ただし注意：' + warnings.map(esc).join('／') }
        : null;  // 成功時の本文は renderResultSummary 側で表示
    } catch (e) {
      S.aggStatus = { type: 'err', msg: '⚠ 集計に失敗しました：' + esc(e.message) };
    }
    renderTabs();
    renderAggregate();
  }

  /* ============================================================
     ④ ペルソナ一覧
     ============================================================ */
  function renderPersonas() {
    const list = S.personas;
    const lastIdx = list.length - 1;

    const cards = list.length
      ? list.map((p, i) => p).reverse().map((p) => {
          const realIdx = list.indexOf(p);
          const isLatest = realIdx === lastIdx;
          const c = classificationCounts(p);
          const mini = [
            ['hygiene', 'HYG', c.hygiene, 'var(--hygiene)', 'rgba(4,120,87,0.1)'],
            ['fit', 'FIT', c.fit, 'var(--fit)', 'rgba(190,24,93,0.1)'],
            ['soft_fit', 'SOFT', c.soft_fit, 'var(--soft-fit)', 'rgba(180,83,9,0.1)'],
            ['profile', 'PROF', c.profile, 'var(--profile)', 'rgba(22,163,74,0.1)'],
            ['dev', '育成', c.dev, '#0d9488', 'rgba(13,148,136,0.1)'],
          ].map(([k, lab, n, col, bg]) =>
            `<span style="color:${col}; background:${bg};">${lab} ${n}</span>`).join('');
          return `
            <div class="persona-card ${isLatest ? 'latest' : ''}">
              <div class="pc-top">
                <div class="pc-name">${esc(p.personaName)}</div>
                ${isLatest ? '<span class="pc-badge">結果ページに表示中</span>' : ''}
              </div>
              <div class="pc-meta">
                対象 <b>${esc(groupLabel(p.targetGroup))}</b>
                vs 比較 <b>${esc(groupLabel(p.compareGroup))}</b>
                <span class="mode-tag">mode ${esc(p.mode)}</span>
              </div>
              <div class="pc-meta">
                ${fmtDateTime(p.calculatedAt)}
                ・対象${p.sampleSizes.target}名／比較${p.sampleSizes.others}名／全社${p.sampleSizes.all}名
              </div>
              <div class="pc-mini">${mini}</div>
              <div class="pc-actions">
                <button class="btn btn-sm" data-act="open-persona" data-id="${esc(p.personaId)}">結果ページで開く</button>
                ${p.mode === 'b'
                  ? `<button class="btn btn-sm" data-act="edit-persona" data-id="${esc(p.personaId)}">${S.editingPersona === p.personaId ? '× 編集を閉じる' : '分類を編集'}</button>`
                  : ''}
                ${isLatest ? '' :
                  `<button class="btn btn-sm" data-act="promote-persona" data-id="${esc(p.personaId)}">最新にする</button>`}
                <button class="btn btn-sm btn-danger" data-act="del-persona" data-id="${esc(p.personaId)}">削除</button>
              </div>
              ${S.editingPersona === p.personaId ? renderOverridePanel(p) : ''}
            </div>`;
        }).join('')
      : `<div class="empty-state"><div class="es-icon">🗂</div>
           保存済みのペルソナはありません。「集計実行」タブで作成してください。</div>`;

    view.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div class="card-title">ペルソナ一覧</div>
          <div class="card-desc">保存済みの集計結果（<code>prism_persona_results</code>）。</div>
        </div>
        <div class="callout">
          結果ページ（<code>prism-results-v6.html</code> ／ <code>prism-detail-section-v6.html</code>）は、
          一覧の<strong>最新（末尾）の集計結果</strong>を表示します。別の結果を表示したいときは
          「最新にする」を押してください。
        </div>
        ${cards}
        ${list.length ? `<div class="btn-row">
          <button class="btn btn-sm btn-danger" data-act="clear-personas">全ペルソナを削除</button>
        </div>` : ''}
      </div>`;
  }

  /* [D-6] Mode(b) 分類上書きパネル ─ 代表者が分類を手動変更する */
  function renderOverridePanel(p) {
    const clsLabel = {
      hygiene: 'HYGIENE', fit: 'FIT', soft_fit: 'SOFT FIT',
      profile: 'PROFILE', unclassified: '未分類',
      dev_high: '育成優先度:高', dev_mid: '育成優先度:中', dev_low: '育成優先度:低',
    };
    const baseOpts = [
      ['hygiene', 'HYGIENE（衛生要件）'],
      ['fit', 'FIT（適合要件）'],
      ['soft_fit', 'SOFT FIT（弱適合）'],
      ['unclassified', '未分類'],
    ];
    // [D-8] 育成層(Tier2/3)向けの選択肢。代表者が育成優先度を再設定できる。
    const devOpts = [
      ['dev_high', '育成優先度:高'],
      ['dev_mid',  '育成優先度:中'],
      ['dev_low',  '育成優先度:低'],
    ];
    const rows = (p.items || []).map(it => {
      const cur = it.classification;
      // [D-8] 育成層は dev_* を既定の選択肢にする（これが無いと dev_* が選択肢に
      //       無く、select が先頭のHYGIENEに化けて適用時に誤分類される）。
      //       §2-4 の逃げ道として採用ゲート(baseOpts)も併置する。
      const isDev = !!it.isDevelopmental ||
        (typeof cur === 'string' && cur.indexOf('dev_') === 0);
      const opts = isDev ? devOpts.concat(baseOpts) : baseOpts.slice();
      // profile（G3 等の記述項目）は現在値としてのみ残す
      if (cur === 'profile' && !isDev) opts.unshift(['profile', 'PROFILE（記述）']);
      const optHtml = opts.map(([v, lab]) =>
        `<option value="${v}" ${v === cur ? 'selected' : ''}>${lab}</option>`).join('');
      const hist = Array.isArray(it.overrideHistory) ? it.overrideHistory : [];
      const badge = it.manualOverride
        ? '<span class="ov-badge">代表者判断</span>' : '';
      const orig = (it.manualOverride && hist.length)
        ? `<span class="ov-orig">元の判定: ${clsLabel[hist[0].from] || esc(hist[0].from)}</span>` : '';
      return `
        <div class="ov-row ${it.manualOverride ? 'overridden' : ''}">
          <div class="ov-item">
            <span class="ov-iid">${esc(it.itemId)}</span>
            <span class="ov-iname">${esc(it.itemName)}</span>
            ${badge}${orig}
          </div>
          <div class="ov-ctl">
            <select id="ov-c-${esc(it.itemId)}">${optHtml}</select>
            <input type="text" id="ov-r-${esc(it.itemId)}" placeholder="変更理由（必須）">
            <button class="btn btn-sm" data-act="apply-override"
              data-id="${esc(p.personaId)}" data-arg="${esc(it.itemId)}">適用</button>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="ov-panel">
        <div class="ov-head">
          <div class="ov-title">分類の上書き ─ Mode (b) 未来志向型</div>
          <div class="ov-desc">
            データ算出後の分類を代表者が手動で変更します。変更は監査証跡
            （変更前後の分類・変更者・理由・日時）として記録され、結果にも反映されます。
            Tier 2/3（育成テーマ）は既定では採用ゲートになりません。特定の育成項目を
            選考要件に格上げしたい場合のみ、ここで FIT 等へ変更してください。
          </div>
        </div>
        <div class="ov-actor">
          変更者：<input type="text" id="ov-actor" value="${esc(S.overrideActor || '代表者')}">
        </div>
        ${S.ovStatus ? `<div class="status ${S.ovStatus.type}" style="margin:9px 13px;">${S.ovStatus.msg}</div>` : ''}
        <div class="ov-rows">${rows}</div>
      </div>`;
  }

  function promotePersona(id, openAfter) {
    const idx = S.personas.findIndex(p => p.personaId === id);
    if (idx < 0) return;
    const [p] = S.personas.splice(idx, 1);
    S.personas.push(p);
    try {
      localStorage.setItem('prism_persona_results', JSON.stringify(S.personas));
    } catch (e) {}
    if (openAfter) openExternal('prism-results-v6.html');
    renderPersonas();
  }

  function deletePersona(id) {
    S.personas = S.personas.filter(p => p.personaId !== id);
    try { localStorage.setItem('prism_persona_results', JSON.stringify(S.personas)); } catch (e) {}
    if (S.lastResult && S.lastResult.personaId === id) S.lastResult = null;
    renderTabs();
    renderPersonas();
  }

  function openExternal(file) {
    /* バンドル（同梱版）内では親プラットフォームにページ切替を依頼。
       スタンドアロン時は従来どおり新規タブで開く。 */
    if (window.parent !== window) {
      try { window.parent.postMessage({ prismOpen: file }, '*'); return; }
      catch (e) { /* postMessage 不可なら下の新規タブへフォールバック */ }
    }
    try {
      const w = window.open(file, '_blank');
      if (!w) alert(file + ' を開けませんでした。同じフォルダに配置して再度お試しください。');
    } catch (e) {
      alert(file + ' を開けませんでした：' + e.message);
    }
  }

  /* ============================================================
     描画 & イベント
     ============================================================ */
  function updateCompanyTag() {
    const el = document.getElementById('companyTag');
    if (el) el.textContent = S.cfg.companyName || '管理画面';
  }

  function render() {
    renderTabs();
    updateCompanyTag();
    if (S.tab === 'config') renderConfig();
    else if (S.tab === 'responses') renderResponses();
    else if (S.tab === 'aggregate') renderAggregate();
    else if (S.tab === 'personas') renderPersonas();
    window.scrollTo(0, 0);
  }

  /* クリック委譲 */
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.getAttribute('data-act');
    const arg = t.getAttribute('data-arg');
    const id = t.getAttribute('data-id');

    switch (act) {
      case 'tab':
        if (S.tab === 'config') captureConfigInputs();
        if (S.tab === 'aggregate') captureAggInputs();
        S.tab = arg; render(); break;

      /* 初期設定 */
      case 'add-job': {
        const inp = document.getElementById('add-job');
        const v = inp ? inp.value.trim() : '';
        captureConfigInputs();
        if (v && !S.cfg.jobTypes.includes(v)) S.cfg.jobTypes.push(v);
        renderConfig(); break;
      }
      case 'rm-job':
        captureConfigInputs(); S.cfg.jobTypes.splice(+arg, 1); renderConfig(); break;
      case 'add-rank': {
        const inp = document.getElementById('add-rank');
        const v = inp ? inp.value.trim() : '';
        captureConfigInputs();
        if (v && !S.cfg.ranks.includes(v)) S.cfg.ranks.push(v);
        renderConfig(); break;
      }
      case 'rm-rank':
        captureConfigInputs(); S.cfg.ranks.splice(+arg, 1); renderConfig(); break;
      case 'add-cg':
        captureAggInputs();
        S.cfg.customGroups.push({ groupId: nextGroupId(), name: '新しいグループ', memberIds: [] });
        persistCfg(); renderAggregate(); break;
      case 'rm-cg':
        captureAggInputs(); S.cfg.customGroups.splice(+arg, 1);
        persistCfg(); renderAggregate(); break;
      case 'save-cfg':
        saveConfig(); break;

      /* [変更] Tier 2/3 セクションの開閉トグル（開閉状態は S.tierOpen に保持） */
      case 'tier-toggle': {
        captureConfigInputs();
        const n = +arg;
        S.tierOpen[n] = !S.tierOpen[n];
        renderConfig(); break;
      }

      /* [D-5] Tier 2/3 項目の一括選択／解除 */
      case 'tier-all': {
        const n = +arg;
        captureConfigInputs();
        const ids = TIER1_ITEMS.filter(it => (it.tier || 1) === n).map(it => it.id);
        ids.forEach(id => {
          if (S.cfg.enabledItems.indexOf(id) === -1) S.cfg.enabledItems.push(id);
        });
        renderConfig(); break;
      }
      case 'tier-none': {
        const n = +arg;
        captureConfigInputs();
        const ids = TIER1_ITEMS.filter(it => (it.tier || 1) === n).map(it => it.id);
        S.cfg.enabledItems = S.cfg.enabledItems.filter(id => ids.indexOf(id) === -1);
        renderConfig(); break;
      }

      /* 回答状況 */
      case 'del-resp': {
        S.responses = S.responses.filter(r => r.respondentId !== id);
        try { localStorage.setItem('prism_raw_responses', JSON.stringify(S.responses)); } catch (e) {}
        S.respStatus = { type: 'info', msg: '回答を1件削除しました。' };
        renderTabs(); renderResponses(); break;
      }
      case 'clear-resp':
        if (confirm('すべての回答（実回答・デモ回答とも）を削除します。よろしいですか？')) {
          S.responses = [];
          try { localStorage.setItem('prism_raw_responses', JSON.stringify([])); } catch (e) {}
          S.respStatus = { type: 'info', msg: '全回答を削除しました。' };
          renderTabs(); renderResponses();
        }
        break;
      case 'seed-demo':
        seedDemo(); break;

      /* 集計 */
      case 'agg-mode':
        captureAggInputs(); S.agg.mode = arg; renderAggregate(); break;
      case 'run-agg':
        runAggregation(); break;
      case 'open-results':
        openExternal('prism-results-v6.html'); break;
      case 'open-detail':
        openExternal('prism-detail-section-v6.html'); break;

      /* ペルソナ一覧 */
      case 'open-persona':
        promotePersona(id, true); break;
      case 'promote-persona':
        promotePersona(id, false); break;
      case 'del-persona':
        if (confirm('このペルソナを削除します。よろしいですか？')) deletePersona(id);
        break;

      /* [D-6] Mode(b) 分類の上書き */
      case 'edit-persona':
        S.editingPersona = (S.editingPersona === id) ? null : id;
        S.ovStatus = null;
        renderPersonas(); break;
      case 'apply-override': {
        const persona = S.personas.find(p => p.personaId === id);
        if (!persona) break;
        const selEl = document.getElementById('ov-c-' + arg);
        const reaEl = document.getElementById('ov-r-' + arg);
        const actorEl = document.getElementById('ov-actor');
        if (actorEl) S.overrideActor = actorEl.value.trim() || '代表者';
        const newCls = selEl ? selEl.value : null;
        const reason = reaEl ? reaEl.value.trim() : '';
        const item = persona.items.find(i => i.itemId === arg);
        if (!reason) {
          S.ovStatus = { type: 'err', msg: '⚠ 変更理由を入力してください（監査証跡に必須）。' };
          renderPersonas(); break;
        }
        if (item && item.classification === newCls) {
          S.ovStatus = { type: 'err', msg: '⚠ ' + arg + ' は分類が変わっていません。' };
          renderPersonas(); break;
        }
        try {
          applyManualOverride(persona, arg, newCls, { actor: S.overrideActor, reason: reason });
          localStorage.setItem('prism_persona_results', JSON.stringify(S.personas));
          S.ovStatus = { type: 'ok',
            msg: '✓ ' + arg + ' の分類を「' + newCls + '」に変更しました（代表者判断・記録済み）。' };
        } catch (e) {
          S.ovStatus = { type: 'err', msg: '⚠ 上書きに失敗：' + esc(e.message) };
        }
        renderPersonas(); break;
      }
      case 'clear-personas':
        if (confirm('保存済みのペルソナをすべて削除します。よろしいですか？')) {
          S.personas = [];
          try { localStorage.setItem('prism_persona_results', JSON.stringify([])); } catch (e) {}
          S.lastResult = null;
          renderTabs(); renderPersonas();
        }
        break;
    }
  });

  /* 変更委譲（select / checkbox） */
  document.addEventListener('change', function (e) {
    const t = e.target;
    const act = t.getAttribute && t.getAttribute('data-act');
    if (act === 'agg-ctl') {
      // 種別変更で値リストが変わるため、入力を取り込んでから再描画
      const prevTType = S.agg.targetType, prevCType = S.agg.compareType;
      captureAggInputs();
      // 種別が変わったら値を初期化
      if (S.agg.targetType !== prevTType) S.agg.targetValue = '';
      if (S.agg.compareType !== prevCType) S.agg.compareValue = '';
      renderAggregate();
    } else if (act === 'item-toggle') {
      // [D-5] Tier 2/3 項目の個別選択
      const id = t.getAttribute('data-arg');
      captureConfigInputs();
      const arr = S.cfg.enabledItems;
      const i = arr.indexOf(id);
      if (t.checked && i === -1) arr.push(id);
      else if (!t.checked && i !== -1) arr.splice(i, 1);
      renderConfig();
    } else if (act === 'cg-mem') {
      // カスタムグループのメンバー増減（再描画せずモデルとカウントだけ更新＋自動保存）
      const gi = +t.getAttribute('data-arg');
      const memId = t.getAttribute('data-id');
      const g = S.cfg.customGroups[gi];
      if (!g) return;
      if (t.checked) {
        if (!g.memberIds.includes(memId)) g.memberIds.push(memId);
      } else {
        g.memberIds = g.memberIds.filter(x => x !== memId);
      }
      const cnt = document.getElementById('cg-count-' + gi);
      if (cnt) cnt.textContent = g.memberIds.length + ' 名';
      persistCfg();
    } else if (t.getAttribute && t.getAttribute('data-cg-name') != null) {
      // カスタムグループ名の編集（blur 時）→ モデル更新＋自動保存
      const gi = +t.getAttribute('data-cg-name');
      if (S.cfg.customGroups[gi]) {
        S.cfg.customGroups[gi].name = t.value.trim() || '無題グループ';
        persistCfg();
      }
    }
  });

  /* 職種・役職は「追加」ボタンでのみ追加する（Enter での即時追加はしない）。
     入力欄での Enter は何もしない（誤って項目が増えるのを防ぐ）。 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    const t = e.target;
    if (t && (t.id === 'add-job' || t.id === 'add-rank')) e.preventDefault();
  });

  /* 起動 */
  loadAll();
  render();
})();
<\/script>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function colCenter(i) { return PLOT.X0 + 25 + i * PLOT.COL_W; }   // 155, 205, ...
function yFor(rate)   { return PLOT.Y1 - (rate / 100) * (PLOT.Y1 - PLOT.Y0); }
function groupLabel(spec) {
  if (!spec) return '—';
  if (spec.type === 'all') return '全社員';
  if (spec.type === 'others') return '他役職';
  if (spec.type === 'jobType' || spec.type === 'rank') return spec.value;
  if (spec.type === 'custom') return '指定グループ';
  return '—';
}

   isDevelopmental が無い旧 personaResult は全項目を採用判断側として扱う（後方互換）。 */
function coreItems() { return (PERSONA.items || []).filter(it => !it.isDevelopmental); }
function devItems()  { return (PERSONA.items || []).filter(it =>  it.isDevelopmental); }

/* 状態 */
let PERSONA = null, IS_SAMPLE = false;
let LINE_A = 'target', LINE_B = 'others';

function loadPersona() {
  try {
    const raw = localStorage.getItem('prism_persona_results');
    if (raw) {
      const list = JSON.parse(raw);
      if (Array.isArray(list) && list.length) return { persona: list[list.length - 1], isSample: false };
    }
  } catch (e) { /* フォールバック */ }
  return { persona: SAMPLE_PERSONA, isSample: true };
}

/* ラインのラベル（凡例・ドロップダウン用） */
function lineLabel(which) {
  if (which === 'target') return '対象 (' + groupLabel(PERSONA.targetGroup) + ')';
  if (which === 'others') return groupLabel(PERSONA.compareGroup) || '他役職';
  return '全社員';
}

/* 連続する同カテゴリのまとまりを返す [{cat, start, count}] */
function catRuns(items) {
  const runs = [];
  let i = 0;
  while (i < items.length) {
    const cat = items[i].category;
    let j = i;
    while (j < items.length && items[j].category === cat) j++;
    runs.push({ cat, start: i, count: j - i });
    i = j;
  }
  return runs;
}

/* ---- SVGチャート生成（採用判断＝Tier 1 のみ） ---- */
function buildChart() {
  const items = coreItems();
  const runs = catRuns(items);

  // カテゴリ背景
  let bg = runs.map(r =>
    `<rect x="${PLOT.X0 + r.start * PLOT.COL_W}" y="${PLOT.Y0}" width="${r.count * PLOT.COL_W}" height="${PLOT.Y1 - PLOT.Y0}" fill="${CAT_COLOR[r.cat]}" fill-opacity="0.06"/>`
  ).join('');
  // Hygiene帯（70〜100%）
  bg += `<rect x="${PLOT.X0}" y="${PLOT.Y0}" width="${PLOT.X1 - PLOT.X0}" height="${yFor(70) - PLOT.Y0}" fill="#10b981" fill-opacity="0.07"/>`;

  // 横グリッド + Y軸ラベル
  let grid = '<g font-family="Outfit, sans-serif" font-size="10" fill="#999">';
  for (let p = 0; p <= 100; p += 10) {
    const y = yFor(p);
    if (p === 70)      grid += `<line x1="${PLOT.X0}" y1="${y}" x2="${PLOT.X1}" y2="${y}" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/><text x="120" y="${y + 4}" text-anchor="end" fill="#10b981" font-weight="700">70%</text>`;
    else if (p === 50) grid += `<line x1="${PLOT.X0}" y1="${y}" x2="${PLOT.X1}" y2="${y}" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3,3"/><text x="120" y="${y + 4}" text-anchor="end" fill="#b45309" font-weight="600">50%</text>`;
    else               grid += `<line x1="${PLOT.X0}" y1="${y}" x2="${PLOT.X1}" y2="${y}" stroke="#c8c8c8" stroke-width="1"/><text x="120" y="${y + 4}" text-anchor="end">${p}%</text>`;
  }
  grid += '</g>';

  // 縦カラム線
  let cols = '<g stroke="#c8c8c8" stroke-width="1">';
  for (let k = 0; k <= items.length; k++) {
    const x = PLOT.X0 + k * PLOT.COL_W;
    cols += `<line x1="${x}" y1="${PLOT.Y0}" x2="${x}" y2="${PLOT.Y1}"/>`;
  }
  cols += '</g>';

  // カテゴリ区切り（太線）
  let seps = '<g stroke="#888" stroke-width="1.5">';
  runs.forEach(r => {
    const end = r.start + r.count;
    if (end < items.length) {
      const x = PLOT.X0 + end * PLOT.COL_W;
      seps += `<line x1="${x}" y1="${PLOT.Y0}" x2="${x}" y2="${PLOT.Y1}"/>`;
    }
  });
  seps += '</g>';

  // G3（順位項目）列のウォッシュ + ラベル
  let g3 = '';
  const g3idx = items.findIndex(it => it.isRanking);
  if (g3idx >= 0) {
    const x = PLOT.X0 + g3idx * PLOT.COL_W, cx = x + 25;
    g3 = `<rect x="${x}" y="${PLOT.Y0}" width="${PLOT.COL_W}" height="${PLOT.Y1 - PLOT.Y0}" fill="#16a34a" fill-opacity="0.10"/>`
       + `<text x="${cx}" y="150" text-anchor="middle" font-family="Outfit, sans-serif" font-size="9" font-weight="700" fill="#16a34a" transform="rotate(-90 ${cx} 150)">PROFILE ・ 順位項目</text>`;
  }

  // 折れ線（合意率 null の項目はスキップ。G3 も動機強度ヒアリングにより合意率を持つ）
  function lineSvg(which, color, w, r, whiteStroke) {
    const pts = [];
    items.forEach((it, idx) => {
      const v = it.consensus ? it.consensus[which] : null;
      if (v == null) return;
      pts.push(colCenter(idx) + ',' + yFor(v).toFixed(1));
    });
    if (!pts.length) return '';
    const circles = pts.map(p => {
      const [cx, cy] = p.split(',');
      return `<circle cx="${cx}" cy="${cy}" r="${r}"${whiteStroke ? ' stroke="#fff" stroke-width="1.5"' : ''}/>`;
    }).join('');
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`
         + `<g fill="${color}">${circles}</g>`;
  }
  const lineB = lineSvg(LINE_B, LINE_COLOR[LINE_B], 2, 3.5, false);
  const lineA = lineSvg(LINE_A, LINE_COLOR[LINE_A], 2.5, 4.5, true);

  const outline = `<rect x="${PLOT.X0}" y="${PLOT.Y0}" width="${PLOT.X1 - PLOT.X0}" height="${PLOT.Y1 - PLOT.Y0}" fill="none" stroke="#1d1e22" stroke-width="1.2"/>`;

  return `<svg class="svg-chart" viewBox="0 0 1080 300" preserveAspectRatio="none">${bg}${grid}${cols}${seps}${g3}${lineB}${lineA}${outline}</svg>`;
}

/* ---- 差分マーカーのセルクラス・表記（A線−B線で算出） ---- */
function diffCellClass(d) {
  if (d == null) return 'none';
  if (Math.abs(d) >= 25) return d > 0 ? 'high-pos' : 'high-neg';
  return 'low';
}
function diffText(d) {
  if (d == null) return '—';
  if (d === 0) return '±0';
  return (d > 0 ? '+' : '−') + Math.abs(d);
}

/* ---- データ表生成（採用判断＝Tier 1 のみ） ---- */
function buildTable() {
  const items = coreItems();
  const runs = catRuns(items);
  const bg = cat => 'bg-' + cat.toLowerCase();

  const colgroup = '<colgroup><col style="width:130px">'
    + items.map(() => '<col style="width:50px">').join('') + '</colgroup>';

  // カテゴリ見出し行
  const catHClass = { HEART: 'heart-h', GUT: 'gut-h', CORE: 'core-h', HEAD: 'head-h', MGMT: 'mgmt-h' };
  let catRow = '<tr class="section-header-row"><td class="row-label-cell"></td>'
    + runs.map(r => `<td colspan="${r.count}" class="${catHClass[r.cat]}">${r.cat}</td>`).join('')
    + '</tr>';

  // 項目ラベル行
  let labelRow = '<tr class="item-label-row"><td class="row-label-cell"></td>'
    + items.map(it => `<td class="${bg(it.category)}"><span class="item-label-text">${esc(it.itemId)} ${esc(it.itemName)}</span></td>`).join('')
    + '</tr>';

  // 合意率の値行（対象 / 他役職 / 全社員 ─ 固定3行）
  function valueRow(label, pillClass, which) {
    return `<tr><td class="row-label-cell"><span class="row-label-pill ${pillClass}">${esc(label)}</span></td>`
      + items.map(it => {
          const v = it.consensus ? it.consensus[which] : null;
          return `<td class="value-cell ${bg(it.category)}">${v == null ? '—' : v}</td>`;
        }).join('') + '</tr>';
  }
  const targetRow = valueRow(lineLabel('target'), 'target', 'target');
  const othersRow = valueRow(lineLabel('others'), 'others', 'others');
  const allRow    = valueRow('全社員', 'all', 'all');

  // Hygiene帯マーカー行（選択中A/B線の両方が70%↑）
  let bandRow = '<tr><td class="row-label-cell"><span class="row-label-pill hygiene-band">Hygiene帯</span></td>'
    + items.map(it => {
        const a = it.consensus ? it.consensus[LINE_A] : null;
        const b = it.consensus ? it.consensus[LINE_B] : null;
        const band = (a != null && b != null && a >= HYGIENE_RATE && b >= HYGIENE_RATE);
        return `<td class="marker-cell ${bg(it.category)}">${band ? '<span class="marker-band" title="両線とも70%↑"></span>' : ''}</td>`;
      }).join('') + '</tr>';

  // 差分マーカー行（A線−B線）
  let diffRow = '<tr><td class="row-label-cell"><span class="row-label-pill diff">差分マーカー</span></td>'
    + items.map(it => {
        const a = it.consensus ? it.consensus[LINE_A] : null;
        const b = it.consensus ? it.consensus[LINE_B] : null;
        const d = (a == null || b == null) ? null : (a - b);
        const title = it.isRanking ? ' title="動機の重要度の差分（順位項目・記述参考）"' : '';
        return `<td class="marker-cell ${bg(it.category)}"><span class="marker-diff ${diffCellClass(d)}"${title}>${diffText(d)}</span></td>`;
      }).join('') + '</tr>';

  // 分類行（personaResult の確定値・ライン選択では変わらない）
  const CLS = {
    hygiene: ['hygiene-cell', 'HYG'], fit: ['fit-cell', 'FIT'],
    soft_fit: ['softfit-cell', 'SOFT'], profile: ['profile-cell', 'PROF'],
    unclassified: ['uncl-cell', '—'],
    // [v10] 育成テーマ。通常は専用セクションに描画されこの表には現れないが、保険として定義。
    dev_high: ['uncl-cell', '育成:高'], dev_mid: ['uncl-cell', '育成:中'],
    dev_low: ['uncl-cell', '育成:低'],
  };
  let classRow = '<tr class="persona-label-row"><td class="row-label-cell" style="font-size:11px; color:var(--text-secondary);">分類</td>'
    + items.map(it => { const c = CLS[it.classification] || ['uncl-cell', '—']; return `<td class="${c[0]}">${c[1]}${it.manualOverride ? '<sup class="ov-sup" title="代表者判断による上書き">代</sup>' : ''}</td>`; }).join('')
    + '</tr>';

  const spacer = '<tr class="spacer-row"><td colspan="' + (items.length + 1) + '"></td></tr>';

  return `<table class="data-table">${colgroup}${catRow}${labelRow}${targetRow}${othersRow}${allRow}${spacer}${bandRow}${diffRow}${spacer}${classRow}</table>`;
}

/* ---- 育成テーマ セクション生成（Tier 2/3 = dev_*。絶対値ベース・比較なし） ---- */
const DEV_PRIORITY = [
  { key: 'dev_high', cls: 'dev-high', label: '育成優先度 ─ 高',
    note: 'この職務が強く必要とする育成可能領域。入社後の重点育成テーマ。' },
  { key: 'dev_mid',  cls: 'dev-mid',  label: '育成優先度 ─ 中',
    note: '職務上の必要性が一定程度ある育成可能領域。' },
  { key: 'dev_low',  cls: 'dev-low',  label: '育成優先度 ─ 低',
    note: '現時点で職務上の必要度は低い育成可能領域。' },
];

function devRow(it, barCls) {
  const t = (it.consensus && it.consensus.target != null) ? it.consensus.target : null;
  const catCls = 'cat-' + String(it.category || '').toLowerCase();
  const str = (it.avgStrength != null) ? it.avgStrength : '—';
  return `
    <div class="dev-row">
      <div class="dev-row-id ${catCls}">${esc(it.itemId)}</div>
      <div class="dev-row-name">${esc(it.itemName)}<span class="dev-row-cat">${esc(it.category)}</span></div>
      <div class="dev-row-bar"><div class="dev-row-bar-fill ${barCls}" style="width:${t == null ? 0 : t}%"></div></div>
      <div class="dev-row-val">${t == null ? '—' : t + '%'}</div>
      <div class="dev-row-str">強度 ${str}</div>
    </div>`;
}

function buildDevSection() {
  const section = document.getElementById('devSection');
  const devs = devItems();
  if (!devs.length) { section.style.display = 'none'; return; }
  section.style.display = '';

  let html = '';
  DEV_PRIORITY.forEach(g => {
    const its = devs.filter(it => it.classification === g.key);
    if (!its.length) return;
    html += `
      <div class="dev-group">
        <div class="dev-group-head ${g.cls}">
          <span class="dev-group-label">${g.label}</span>
          <span class="dev-group-count">${its.length}項目</span>
        </div>
        <div class="dev-group-note">${g.note}</div>
        <div class="dev-rows">${its.map(it => devRow(it, g.cls)).join('')}</div>
      </div>`;
  });
  // データ不足で育成優先度を判定できなかった項目（classification = unclassified）
  const unc = devs.filter(it => !DEV_PRIORITY.some(g => g.key === it.classification));
  if (unc.length) {
    html += `
      <div class="dev-group">
        <div class="dev-group-head dev-uncl">
          <span class="dev-group-label">分類不能（回答不足）</span>
          <span class="dev-group-count">${unc.length}項目</span>
        </div>
        <div class="dev-group-note">有効回答が不足しており育成優先度を判定できません。</div>
        <div class="dev-rows">${unc.map(it => devRow(it, 'dev-uncl')).join('')}</div>
      </div>`;
  }
  document.getElementById('devBody').innerHTML = html ||
    '<div class="dev-empty">育成テーマに該当する項目はありません。</div>';

  const tgt = groupLabel(PERSONA.targetGroup);
  document.getElementById('devSub').textContent =
    `入社後の育成対象（Tier 2/3）${devs.length}項目 ／ 対象「${tgt}」の合意率による育成優先度順`;
}

/* ---- ヘッダー・メタ情報 ---- */
function modeLabel(m) { return m === 'b' ? '(b) 未来志向型' : '(a) 現状追認型'; }
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function renderHeader() {
  document.getElementById('personaName').textContent = PERSONA.personaName || '採用ペルソナ';
  document.getElementById('companyName').textContent = PERSONA.companyName || PERSONA.companyId || '';
  const s = PERSONA.sampleSizes || {};
  const meta = [
    ['全社員', 'n = ' + (s.all != null ? s.all : '—')],
    ['対象 (' + groupLabel(PERSONA.targetGroup) + ')', 'n = ' + (s.target != null ? s.target : '—')],
    [groupLabel(PERSONA.compareGroup) || '他役職', 'n = ' + (s.others != null ? s.others : '—')],
    ['Mode', modeLabel(PERSONA.mode)],
    ['集計日', formatDate(PERSONA.calculatedAt)],
  ];
  document.getElementById('metaRow').innerHTML = meta.map((m, i) =>
    (i ? '<div class="meta-divider"></div>' : '') +
    `<div class="meta-item">${esc(m[0])} <strong>${esc(m[1])}</strong></div>`
  ).join('');
  document.getElementById('coreCount').textContent = coreItems().length;
  document.getElementById('devCount').textContent = devItems().length;
}

/* ---- ドロップダウン・凡例 ---- */
function buildSelectors() {
  const opts = [['target', lineLabel('target')], ['all', '全社員'], ['others', lineLabel('others')]];
  const optHtml = opts.map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('');
  const selA = document.getElementById('selA'), selB = document.getElementById('selB');
  selA.innerHTML = optHtml; selB.innerHTML = optHtml;
  selA.value = LINE_A; selB.value = LINE_B;
  selA.onchange = () => { LINE_A = selA.value; render(); };
  selB.onchange = () => { LINE_B = selB.value; render(); };
}
function renderLegend() {
  document.getElementById('dotA').style.background = LINE_COLOR[LINE_A];
  document.getElementById('dotB').style.background = LINE_COLOR[LINE_B];
  document.getElementById('legDotA').style.background = LINE_COLOR[LINE_A];
  document.getElementById('legDotB').style.background = LINE_COLOR[LINE_B];
  document.getElementById('legLabelA').textContent = lineLabel(LINE_A) + 'の合意率';
  document.getElementById('legLabelB').textContent = lineLabel(LINE_B) + 'の合意率';
}

/* ---- メイン描画 ---- */
function render() {
  renderHeader();
  document.getElementById('vizInner').innerHTML = buildChart() + buildTable();
  buildDevSection();
  renderLegend();
}

function init() {
  const r = loadPersona();
  PERSONA = r.persona; IS_SAMPLE = r.isSample;
  document.getElementById('sampleBanner').style.display = IS_SAMPLE ? 'block' : 'none';
  buildSelectors();
  render();
}
init();
<\/script>

</body>
</html>

</script>
<script type="text/html" id="mod-detail">
<!DOCTYPE html>
<!--
================================================================================
  PRISM LOGIC v5 ─ 採用ペルソナ 詳細セクション（確定版）
================================================================================
  v4「詳細カード レイアウト比較」からの確定版。
  - パターンA（3カラムカード形式）に一本化。パターンB・比較表示は削除。
  - G3「動機方向性」を独立セクション「動機プロファイル」として新設。
    G3は5択ランキング項目のため合意率が定義できず、Hygiene/Fit/Soft Fitの
    閾値分類には含めない（profile = 記述専用）。集計はBorda（1位5点〜5位1点）。
  - 5動機ドライバー = B案: 成果 / 仲間 / 裁量 / 評価 / 安心
  - 未分類リストから「動機方向性」を除外（6項目 → 5項目）。
  配色: HEART赤 / GUT緑 / CORE青 / HEAD グレー (v4準拠)

  【v10 追加 ─ D-10: 育成テーマセクション】
  Tier 2/3（dev_*）を採用判断（Hygiene/Fit/Soft Fit）から分離し、専用の
  「育成テーマ」セクションを新設。育成優先度（高/中/低）でグルーピングし、
  各項目を renderCard(sectionType='dev') で描画する（強度分布＋平均強度）。
  育成カードのメタ表記は「対象の必要度（合意率の絶対値）」のみ＝比較は持たない。
  byClass は採用判断セクション用に isDevelopmental 項目を除外。
================================================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM LOGIC ─ 採用ペルソナ 詳細セクション</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #f4f5f7;
  --bg-white: #ffffff;
  --bg-soft: #ebedf0;
  --border: #e6e8ec;
  --border-strong: #d6d9df;
  --grid-line: #c8c8c8;
  --text-primary: #1d1e22;
  --text-secondary: #6c6e75;
  --text-dim: #a7a9b0;

  --heart-color: #ef4444;
  --gut-color: #22c55e;
  --core-color: #3b82f6;
  --head-color: #6b7280;

  --heart-bg: rgba(239, 68, 68, 0.06);
  --gut-bg: rgba(34, 197, 94, 0.06);
  --core-bg: rgba(59, 130, 246, 0.06);
  --head-bg: rgba(107, 114, 128, 0.05);

  --hygiene-color: #047857;
  --hygiene-icon: #1f2937;
  --fit-color: #be185d;
  --soft-fit-color: #b45309;
  --profile-color: #16a34a;
  --unclassified-color: #6b7280;

  --type-a: #0ea5e9;
  --type-b: #f97316;
  --type-neutral: #d1d5db;
  --intensity-high: #be185d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  font-size: 14px;
}

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

/* ─── Document header ─────────────────────── */
.doc-head {
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--text-primary);
}
.doc-eyebrow {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.doc-head h1 {
  font-family: 'Outfit', sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.doc-head p {
  font-size: 13px;
  color: var(--text-secondary);
}
.doc-head p strong { color: var(--text-primary); font-weight: 600; }

/* ─── Section ─────────────────────────────── */
.section {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 20px;
  overflow: hidden;
}
.section-header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.section-header-left { display: flex; align-items: center; gap: 16px; }
.section-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.section-icon.hygiene { background: var(--hygiene-icon); color: #fff; }
.section-icon.fit { background: var(--fit-color); color: #fff; }
.section-icon.soft-fit { background: var(--soft-fit-color); color: #fff; }
.section-icon.profile { background: var(--profile-color); color: #fff; }
.section-icon.unclassified { background: var(--unclassified-color); color: #fff; }
.section-title-block h2 {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 2px;
}
.section-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
}
.section-count {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
}
.section-count strong {
  font-size: 22px;
  color: var(--text-primary);
  font-weight: 700;
  margin-right: 4px;
}
.section-flag {
  font-family: 'Outfit', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 4px 10px;
  border-radius: 12px;
  white-space: nowrap;
}
.section-flag.profile {
  background: var(--gut-bg);
  color: var(--profile-color);
  border: 1px solid rgba(22, 163, 74, 0.25);
}

.cat-tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font-family: 'Outfit', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  width: fit-content;
}
.cat-tag.heart { background: var(--heart-bg); color: #dc2626; }
.cat-tag.gut { background: var(--gut-bg); color: #16a34a; }
.cat-tag.core { background: var(--core-bg); color: #2563eb; }
.cat-tag.head { background: var(--head-bg); color: #4b5563; }
.cat-tag.mgmt { background: rgba(217,119,6,0.08); color: #b45309; }

/* Type distribution bar */
.type-bar-row {
  display: flex;
  height: 26px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.type-segment {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  min-width: 0;
  white-space: nowrap;
}
.type-segment.type-a { background: var(--type-a); }
.type-segment.type-b { background: var(--type-b); }
.type-segment.type-neutral { background: var(--type-neutral); color: #4b5563; }
.type-segment.intensity-high { background: var(--intensity-high); }
.type-segment.intensity-mid { background: #d1d5db; color: #4b5563; }
.type-segment.intensity-low { background: #e5e7eb; color: #6b7280; }
.type-dominant-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
}
.type-dominant-tag.a { background: var(--type-a); }
.type-dominant-tag.b { background: var(--type-b); }
.type-dominant-tag.intensity { background: var(--intensity-high); }
.type-dominant-tag.none { background: var(--text-dim); }

/* Intensity gauge */
.intensity-gauge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-secondary);
}
.intensity-track {
  flex: 1;
  height: 6px;
  background: #ececec;
  border-radius: 3px;
  overflow: hidden;
  max-width: 120px;
}
.intensity-fill {
  height: 100%;
  background: var(--intensity-high);
  border-radius: 3px;
}
.intensity-val {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  color: var(--text-primary);
  font-size: 12px;
}

/* Reason text */
.reason-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.7;
}
.reason-text strong { color: var(--text-primary); font-weight: 600; }

/* ════════════════════════════════════════════
   3カラムカード形式（パターンA・確定）
   ════════════════════════════════════════════ */
.pa-body { padding: 6px 0; }
.pa-item {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 200px 1fr 300px;
  gap: 28px;
  align-items: center;
}
.pa-item:last-child { border-bottom: none; }
.pa-item:hover { background: var(--bg-soft); }

.pa-name-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pa-name {
  font-size: 16px;
  font-weight: 600;
}
.pa-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-secondary);
}
.pa-rate {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--text-primary);
}

.pa-center {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pa-center-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-secondary);
}

.pa-reason-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pa-reason-title {
  font-family: 'Outfit', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-dim);
}

/* Soft Fit note */
.soft-fit-note {
  margin: 12px 28px 14px;
  padding: 12px 14px;
  background: rgba(180, 83, 9, 0.08);
  border-left: 3px solid var(--soft-fit-color);
  border-radius: 4px;
  font-size: 12px;
  line-height: 1.7;
}
.soft-fit-note strong { color: var(--soft-fit-color); }

/* ════════════════════════════════════════════
   動機プロファイル（G3 ─ 記述専用）
   ════════════════════════════════════════════ */
.profile-note {
  margin: 14px 28px 4px;
  padding: 12px 14px;
  background: var(--gut-bg);
  border-left: 3px solid var(--profile-color);
  border-radius: 4px;
  font-size: 12px;
  line-height: 1.75;
  color: var(--text-secondary);
}
.profile-note strong { color: var(--profile-color); font-weight: 600; }

.profile-body { padding: 18px 28px 24px; }

/* ─── 育成テーマ セクション（Tier 2/3 = dev_*） ─────────────── */
.section-icon.dev { background: #0d9488; color: #fff; }
.section-flag.dev {
  background: rgba(13,148,136,0.08);
  color: #0d9488;
  border: 1px solid rgba(13,148,136,0.25);
}
.dev-note {
  margin: 14px 28px 4px;
  padding: 12px 14px;
  background: rgba(13,148,136,0.06);
  border-left: 3px solid #0d9488;
  border-radius: 4px;
  font-size: 12px; line-height: 1.75;
  color: var(--text-secondary);
}
.dev-note strong { color: #0f766e; font-weight: 600; }
.dev-grp { padding: 4px 28px 0; }
.dev-grp-head {
  display: flex; align-items: center; gap: 10px;
  margin: 14px 0 0;
}
.dev-grp-label {
  font-family: 'Outfit', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 0.5px; color: #0d9488;
}
.dev-grp-count {
  font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700;
  padding: 1px 8px; border-radius: 9px;
  background: rgba(13,148,136,0.10); color: #0f766e;
}
.dev-grp-note {
  font-size: 11px; color: var(--text-secondary); margin: 4px 0 2px;
}

/* 動機の重要度（強度ヒアリング）読み出し */
.profile-strength {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.ps-item {
  flex: 1;
  padding: 11px 14px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.ps-label {
  display: block;
  font-size: 10.5px;
  color: var(--text-secondary);
  margin-bottom: 3px;
}
.ps-val {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--profile-color);
}
.ps-val.sub { font-size: 16px; color: var(--text-primary); }
@media (max-width: 560px) { .profile-strength { flex-wrap: wrap; } }

.profile-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 18px;
}
.profile-top-label {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
}
.profile-top-driver {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--profile-color);
}
.profile-top-sub {
  font-size: 11px;
  color: var(--text-secondary);
}

.profile-chart-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.profile-bars {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.profile-bar-row {
  display: grid;
  grid-template-columns: 30px 160px 1fr 46px;
  gap: 12px;
  align-items: center;
}
.profile-rank {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 700;
  background: #ececec;
  color: var(--text-secondary);
}
.profile-bar-row.is-top .profile-rank {
  background: var(--profile-color);
  color: #fff;
}
.profile-driver { display: flex; flex-direction: column; gap: 1px; }
.profile-driver-name {
  font-size: 13px;
  font-weight: 600;
}
.profile-bar-row.is-top .profile-driver-name { color: var(--profile-color); }
.profile-driver-sub {
  font-size: 10px;
  color: var(--text-dim);
}
.profile-track {
  height: 22px;
  background: #f0efe9;
  border-radius: 6px;
  overflow: hidden;
}
.profile-fill {
  height: 100%;
  background: rgba(34, 197, 94, 0.45);
  border-radius: 6px;
}
.profile-bar-row.is-top .profile-fill {
  background: var(--profile-color);
}
.profile-share {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 700;
  text-align: right;
  color: var(--text-primary);
}
.profile-compare {
  margin-top: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.7;
}
.profile-compare strong { color: var(--text-primary); font-weight: 600; }

/* Unclassified collapsible list */
.collapsible { cursor: pointer; user-select: none; }
.collapsible:hover { background: var(--bg-soft); }
.collapse-toggle {
  font-size: 14px;
  color: var(--text-secondary);
  transition: transform 0.2s;
}
.collapsed .collapse-toggle { transform: rotate(-90deg); }
.collapsed .uncl-list { display: none; }
.collapsed .section-header { border-bottom: none; }

.uncl-list { padding: 8px 0; }
.uncl-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 28px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.uncl-row:last-child { border-bottom: none; }
.uncl-name { font-weight: 600; min-width: 130px; }
.uncl-rate {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  color: var(--text-secondary);
  min-width: 50px;
}
.uncl-reason {
  font-size: 11px;
  color: var(--text-secondary);
  flex: 1;
}

@media (max-width: 860px) {
  .pa-item { grid-template-columns: 1fr; gap: 16px; }
  .profile-bar-row { grid-template-columns: 26px 120px 1fr 44px; }
}

/* ---- セクションアイコン（v5から継承） ---- */
const ICONS = {

  fit:          '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>',
  soft_fit:     '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
  profile:      '<line x1="4" y1="20" x2="4" y2="11"/><line x1="10" y1="20" x2="10" y2="5"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="22" y1="20" x2="2" y2="20"/>',
  unclassified: '<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/><circle cx="12" cy="12" r="10"/>',
  dev:          '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
};
function svgIcon(type) {
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + ICONS[type] + '</svg>';
}

/* ---- ユーティリティ ---- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function pct(v) { return v == null ? '—' : v + '%'; }
function groupLabel(spec) {
  if (!spec) return '—';
  if (spec.type === 'all') return '全社員';
  if (spec.type === 'others') return '他役職';
  if (spec.type === 'jobType' || spec.type === 'rank') return spec.value;
  if (spec.type === 'custom') return '指定グループ';
  return '—';
}
// セグメント幅に応じてラベルを出し分け（狭い帯での文字あふれを防ぐ）
function segText(short, p) {
  if (p < 7) return '';
  if (p < 16) return p + '%';
  return short + ' ' + p + '%';
}

/* ---- personaResult の読み込み ---- */
function loadPersona() {
  try {
    const raw = localStorage.getItem('prism_persona_results');
    if (raw) {
      const list = JSON.parse(raw);
      if (Array.isArray(list) && list.length) {
        return { persona: list[list.length - 1], isSample: false };
      }
    }
  } catch (e) { /* 破損時はサンプルにフォールバック */ }
  return { persona: SAMPLE_PERSONA, isSample: true };
}

/* ---- カード内: タイプ分布 / 強度分布 ---- */
function renderTypeBlock(item) {
  const td = item.typeDistribution;
  if (!td) return '';

  // 強度のみ項目（G1・C4）
  if (td.isIntensityOnly) {
    const dom = td.dominant === 'high'
      ? '<span class="type-dominant-tag intensity">高強度 優勢</span>'
      : '<span class="type-dominant-tag none">優勢なし</span>';
    return `
      <div class="pa-center-label"><span>強度分布 (1〜7)</span>${dom}</div>
      <div class="type-bar-row">
        <div class="type-segment intensity-high" style="width:${td.high}%">${segText('高', td.high)}</div>
        <div class="type-segment intensity-mid" style="width:${td.mid}%">${segText('中', td.mid)}</div>
        <div class="type-segment intensity-low" style="width:${td.low}%">${segText('低', td.low)}</div>
      </div>`;
  }

  // binary 項目
  let dom;
  if (td.dominant === 'a')      dom = `<span class="type-dominant-tag a">${esc(td.labelA)} 優勢</span>`;
  else if (td.dominant === 'b') dom = `<span class="type-dominant-tag b">${esc(td.labelB)} 優勢</span>`;
  else                          dom = '<span class="type-dominant-tag none">優勢なし</span>';

  if (!td.respondedCount) {
    return `
      <div class="pa-center-label"><span>タイプ分布（強度加重）</span>${dom}</div>
      <div class="type-bar-row"><div class="type-segment type-neutral" style="width:100%">方向回答なし</div></div>`;
  }
  const shortA = String(td.labelA || '').replace('型', '');
  const shortB = String(td.labelB || '').replace('型', '');
  return `
    <div class="pa-center-label"><span>タイプ分布（強度加重）</span>${dom}</div>
    <div class="type-bar-row">
      <div class="type-segment type-a" style="width:${td.a}%">${segText(shortA, td.a)}</div>
      <div class="type-segment type-neutral" style="width:${td.neutral}%">${segText('中', td.neutral)}</div>
      <div class="type-segment type-b" style="width:${td.b}%">${segText(shortB, td.b)}</div>
    </div>`;
}

/* ---- カード内: 平均強度ゲージ ---- */
function renderGauge(item) {
  const v = item.avgStrength;
  if (v == null) {
    return `<div class="intensity-gauge">平均強度<div class="intensity-track"><div class="intensity-fill" style="width:0%"></div></div><span class="intensity-val">— / 7</span></div>`;
  }
  const w = Math.round(v / 7 * 100);
  return `<div class="intensity-gauge">平均強度<div class="intensity-track"><div class="intensity-fill" style="width:${w}%"></div></div><span class="intensity-val">${v.toFixed(1)} / 7</span></div>`;
}

/* ---- 項目カード ---- */
function renderCard(item, sectionType, targetLabel) {
  const cat = String(item.category).toLowerCase();
  const meta = sectionType === 'hygiene'
    ? `全社員合意率 <span class="pa-rate">${pct(item.consensus.all)}</span>`
    : sectionType === 'dev'
    ? `${esc(targetLabel)}の必要度 <span class="pa-rate">${pct(item.consensus.target)}</span>`
    : `${esc(targetLabel)} <span class="pa-rate">${pct(item.consensus.target)}</span> / 他 ${pct(item.consensus.others)}`;
  const override = item.manualOverride
    ? '<span style="margin-left:8px; font-size:10px; font-weight:700; color:#7c3aed; border:1px solid #ddd6fe; background:#f5f3ff; padding:2px 7px; border-radius:4px;">代表者判断</span>'
    : '';
  return `
    <div class="pa-item">
      <div class="pa-name-block">
        <span class="cat-tag ${cat}">${esc(item.category)}</span>
        <span class="pa-name">${esc(item.itemName)}</span>
        <span class="pa-meta">${meta}</span>${override}
      </div>
      <div class="pa-center">
        ${renderTypeBlock(item)}
        ${renderGauge(item)}
      </div>
      <div class="pa-reason-block">
        <div class="pa-reason-title">${sectionType === 'dev' ? '育成テーマとしての位置づけ' : '分類理由'}</div>
        <div class="reason-text">${esc(item.reason)}</div>
      </div>
    </div>`;
}

/* ---- 育成テーマ セクション（Tier 2/3 = dev_*。採用ゲート対象外） ---- */
function renderDevSection(devs, targetLabel) {
  if (!devs.length) return '';
  const GROUPS = [
    { key: 'dev_high', label: '育成優先度 ─ 高',
      note: 'この職務が強く必要とする育成可能領域。入社後の重点育成テーマ。' },
    { key: 'dev_mid',  label: '育成優先度 ─ 中',
      note: '職務上の必要性が一定程度ある育成可能領域。' },
    { key: 'dev_low',  label: '育成優先度 ─ 低',
      note: '現時点で職務上の必要度は低い育成可能領域。' },
  ];
  let blocks = '';
  GROUPS.forEach(g => {
    const its = devs.filter(it => it.classification === g.key);
    if (!its.length) return;
    blocks += `
      <div class="dev-grp">
        <div class="dev-grp-head">
          <span class="dev-grp-label">${g.label}</span>
          <span class="dev-grp-count">${its.length}項目</span>
        </div>
        <div class="dev-grp-note">${g.note}</div>
        <div class="pa-body">${its.map(it => renderCard(it, 'dev', targetLabel)).join('')}</div>
      </div>`;
  });
  // データ不足で育成優先度を判定できなかった項目
  const unc = devs.filter(it => !GROUPS.some(g => g.key === it.classification));
  if (unc.length) {
    blocks += `
      <div class="dev-grp">
        <div class="dev-grp-head">
          <span class="dev-grp-label" style="color:var(--text-dim);">分類不能（回答不足）</span>
          <span class="dev-grp-count">${unc.length}項目</span>
        </div>
        <div class="dev-grp-note">有効回答が不足しており育成優先度を判定できません。</div>
        <div class="pa-body">${unc.map(it => renderCard(it, 'dev', targetLabel)).join('')}</div>
      </div>`;
  }
  return `
    <div class="section">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-icon dev">${svgIcon('dev')}</div>
          <div class="section-title-block">
            <h2>育成テーマ</h2>
            <div class="section-subtitle">入社後の育成対象（Tier 2/3）─ 育成優先度順の${devs.length}項目</div>
          </div>
        </div>
        <div class="section-flag dev">採用ゲート対象外 ・ 入社後の育成</div>
      </div>
      <div class="dev-note"><strong>この枠の見方：</strong>Tier 2/3（HEAD・MGMT）は経験で伸ばせる育成可能層です。<strong>採用の合否はゲートしません</strong>。育成優先度は対象グループがその力をどれだけ必要としているか（合意率の絶対値）で決まり、他グループとの比較は用いません（Fitとは別の指標）。SKILL（OJT）／HEAD 層の育成計画に接続してください。</div>
      ${blocks}
    </div>`;
}

/* ---- 分類セクション（Hygiene / Fit / Soft Fit） ---- */
function renderClassSection(type, items, targetLabel) {
  if (!items.length) return '';
  const h2 = type === 'hygiene' ? 'HYGIENE' : type === 'fit' ? 'FIT' : 'SOFT FIT';
  const sub = type === 'hygiene' ? `全採用必須 ─ 文化基盤を担保する${items.length}項目`
    : type === 'fit' ? `${esc(targetLabel)}で特に重視 ─ 役職文化適合の${items.length}項目`
    : `議論余地あり ─ 代表者判断が必要な${items.length}項目`;
  const iconClass = type === 'soft_fit' ? 'soft-fit' : type;
  const note = type === 'soft_fit'
    ? `<div class="soft-fit-note"><strong>⚠ 要協議</strong> 対象職種で他役職より <strong>+25pt 以上</strong> 重視されるが、Fit基準（対象70%↑ かつ 他役職50%↓）に未達。採用ペルソナに含めるかは代表者と協議。</div>`
    : '';
  return `
    <div class="section">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-icon ${iconClass}">${svgIcon(type)}</div>
          <div class="section-title-block">
            <h2>${h2}</h2>
            <div class="section-subtitle">${sub}</div>
          </div>
        </div>
        <div class="section-count"><strong>${items.length}</strong>項目</div>
      </div>
      ${note}
      <div class="pa-body">
        ${items.map(it => renderCard(it, type, targetLabel)).join('')}
      </div>
    </div>`;
}

/* ---- 動機プロファイル（G3） ---- */
function renderProfile(g3, targetLabel) {
  const rd = g3.rankingDistribution;
  if (!rd || !rd.drivers || !rd.drivers.length) return '';
  const top = rd.drivers[0];
  const bars = rd.drivers.map(d => `
    <div class="profile-bar-row ${d.rank === 1 ? 'is-top' : ''}">
      <span class="profile-rank">${d.rank}</span>
      <div class="profile-driver">
        <span class="profile-driver-name">${esc(d.label)}</span>
        <span class="profile-driver-sub">${esc(d.desc)}</span>
      </div>
      <div class="profile-track"><div class="profile-fill" style="width:${d.share}%"></div></div>
      <span class="profile-share">${d.share}</span>
    </div>`).join('');

  let compareHtml = '';
  const cmp = g3.rankingDistributionCompare;
  if (cmp && cmp.drivers && cmp.drivers.length) {
    const cTop = cmp.drivers[0];
    compareHtml = `<div class="profile-compare"><strong>他グループとの比較（参考）：</strong>他グループでは「${esc(cTop.label)}」が1位（順位スコア${cTop.share}）。${esc(targetLabel)}の最優先「${esc(top.label)}」とは優先順位が異なる。 ※ 順位データのため職種間の数値差は<strong>参考程度</strong>に留め、閾値判定には用いない。</div>`;
  }

  // 動機の重要度（強度ヒアリング ─ D-1）
  const cT = g3.consensus ? g3.consensus.target : null;
  const cO = g3.consensus ? g3.consensus.others : null;
  const avg = g3.avgStrength;
  const strengthBlock = (cT != null)
    ? `<div class="profile-strength">
         <div class="ps-item"><span class="ps-label">${esc(targetLabel)}で「動機が重要」</span>
           <span class="ps-val">${cT}%</span></div>
         <div class="ps-item"><span class="ps-label">他グループ</span>
           <span class="ps-val sub">${cO == null ? '—' : cO + '%'}</span></div>
         <div class="ps-item"><span class="ps-label">平均強度（重要回答）</span>
           <span class="ps-val sub">${avg == null ? '—' : avg.toFixed(1) + ' / 7'}</span></div>
       </div>`
    : '';

  return `
    <div class="section">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-icon profile">${svgIcon('profile')}</div>
          <div class="section-title-block">
            <h2>MOTIVATION PROFILE</h2>
            <div class="section-subtitle">動機プロファイル ─ ${esc(targetLabel)}の動機の重要度と優先順位</div>
          </div>
        </div>
        <div class="section-flag profile">順位は記述専用 ・ 分類対象外</div>
      </div>
      <div class="profile-note"><strong>この枠の見方：</strong>動機方向性（G3）は重要度(1〜7)に加えて「5つの動機の順位づけ」をヒアリングします。<strong>重要度</strong>は合意率・平均強度として集計し、俯瞰グラフにも反映します。一方<strong>5動機の順位</strong>は方向の記述データで、Hygiene / Fit / Soft Fit の閾値分類には用いません（順位スコアは強度加重）。</div>
      <div class="profile-body">
        ${strengthBlock}
        <div class="profile-top">
          <div>
            <div class="profile-top-label">この職種の最優先ドライバー</div>
            <div class="profile-top-driver">${esc(top.label)}</div>
          </div>
          <div class="profile-top-sub">「${esc(top.desc)}」を重視する${esc(targetLabel)}が最多。順位スコア${top.share}で動機の中心。</div>
        </div>
        <div class="profile-chart-label">5動機ドライバーの優先度（順位スコア・強度加重・${esc(targetLabel)} n=${rd.respondedCount}）</div>
        <div class="profile-bars">${bars}</div>
        ${compareHtml}
      </div>
    </div>`;
}

/* ---- 未分類セクション（折りたたみ） ---- */
function renderUnclassified(items) {
  if (!items.length) return '';
  const rows = items.map(it => `
    <div class="uncl-row">
      <span class="cat-tag ${String(it.category).toLowerCase()}">${esc(it.category)}</span>
      <span class="uncl-name">${esc(it.itemName)}</span>
      <span class="uncl-rate">${pct(it.consensus.target)}</span>
      <span class="uncl-reason">${esc(it.reason)}</span>
    </div>`).join('');
  return `
    <div class="section collapsed" id="uncl">
      <div class="section-header collapsible" onclick="document.getElementById('uncl').classList.toggle('collapsed')">
        <div class="section-header-left">
          <div class="section-icon unclassified">${svgIcon('unclassified')}</div>
          <div class="section-title-block">
            <h2>未分類</h2>
            <div class="section-subtitle">この会社・職種では特に重視されていない${items.length}項目</div>
          </div>
        </div>
        <div style="display:flex; gap:16px; align-items:center;">
          <div class="section-count"><strong>${items.length}</strong>項目</div>
          <span class="collapse-toggle">▼</span>
        </div>
      </div>
      <div class="uncl-list">${rows}</div>
    </div>`;
}

/* ---- メイン描画 ---- */
function render() {
  const { persona, isSample } = loadPersona();
  const targetLabel  = groupLabel(persona.targetGroup);
  const compareLabel = groupLabel(persona.compareGroup);

  document.getElementById('docPersona').innerHTML =
    `<strong>${esc(persona.personaName)}</strong> ／ ${esc(persona.companyName || persona.companyId || '')} ・ 比較: ${esc(targetLabel)} vs ${esc(compareLabel)}`;
  document.getElementById('sampleBanner').style.display = isSample ? 'block' : 'none';

  const items = persona.items || [];
  // [v10] 採用判断（Tier 1）と育成テーマ（Tier 2/3）を分離。
  // byClass は採用判断セクション用なので育成項目を除外する。
  const byClass = c => items.filter(i => i.classification === c && !i.isDevelopmental);
  const devs = items.filter(i => i.isDevelopmental);
  const g3 = items.find(i => i.isRanking);

  let html = '';
  html += renderClassSection('hygiene',  byClass('hygiene'),  targetLabel);
  html += renderClassSection('fit',      byClass('fit'),      targetLabel);
  html += renderClassSection('soft_fit', byClass('soft_fit'), targetLabel);
  if (g3) html += renderProfile(g3, targetLabel);
  html += renderUnclassified(byClass('unclassified'));
  html += renderDevSection(devs, targetLabel);

  document.getElementById('sections').innerHTML = html ||
    '<div class="section"><div style="padding:48px; text-align:center; color:#94a3b8;">表示できる項目がありません。</div></div>';
}

render();
<\/script>
