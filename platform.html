<!DOCTYPE html>
<!--
================================================================================
  PRISM LOGIC ─ 統合プラットフォーム v1   [ダッシュボード統合フェーズ・組み込み版]
================================================================================
  引き継ぎシート v22 に準拠。
  ・ダッシュボードを「器」として流用 ── ヘッダー／サイドバー／レイアウト／
    ページ切替（SPA）／トースト、およびホーム画面。配色は問診ページに統一。
  ・統合方式は iframe。作成済みの v6 ツールを独立HTMLのまま埋め込む。
    ツール間連携は従来どおり localStorage（prism_company_config /
    prism_raw_responses / prism_persona_results）で成立。
  ・サイドバー2本：ホーム／ペルソナ設計。問診は本番 index.html へ移行済み。
  ・データは Supabase。起動時にハイドレートし、保存は storage イベント経由で
    write-through（引き継ぎ v28 の方針）。
      - ペルソナ設計  → prism-admin-v6.html?embed=1（初期設定・回答状況・
        集計・ペルソナ一覧を内蔵タブで持つ一体型コンソール）
      - 問診プレビュー → prism-questionnaire-v6.html?embed=1（回答者向け
        問診画面のプレビュー。embed 時は保存をスキップし回答データを汚さない）
  ・結果／詳細（prism-results-v6.html / prism-detail-section-v6.html）は
    admin のペルソナ一覧「結果ページで開く」から到達。
  ・【同梱版】admin / questionnaire / results / detail を本ファイル内に
    text/html データ島として埋め込み、srcdoc で iframe に渡す。外部ファイルへの
    フェッチが無いため、配信環境を問わず 404 にならず単独で動作する。
  ・モジュール間連携は従来どおり localStorage（srcdoc は親と同一オリジン）。
  ・結果／詳細は admin の「結果ページで開く」→ postMessage で親に通知し、
    親が該当ページへ切替える（同一ウィンドウ内遷移）。
================================================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM LOGIC ─ プラットフォーム（同梱版）</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --soft: #ebedf0;
  --border: #e6e8ec;
  --border-strong: #d6d9df;
  --text: #1d1e22;
  --text-sub: #6c6e75;
  --text-dim: #a7a9b0;
  --btn-dark: #1f2024;
  --accent: #16a34a;
  --accent-soft: rgba(22,163,74,0.10);
  --brand-blue: #3b82f6;
  --brand-green: #22c55e;
  --brand-red: #ef4444;
  --danger: #dc2626;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 13px; line-height: 1.6;
}

/* ─── ヘッダー ────────────────────────────── */
.topbar {
  height: 58px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; position: sticky; top: 0; z-index: 50;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo svg { width: 28px; height: 28px; }
.logo-text {
  font-family: 'Outfit', sans-serif;
  font-size: 19px; font-weight: 700; letter-spacing: 2.5px;
  background: linear-gradient(135deg, var(--brand-blue), var(--brand-green), var(--brand-red));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; color: transparent;
}
.topbar-right { display: flex; align-items: center; gap: 14px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-sub); cursor: pointer;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.icon-btn:hover { background: var(--soft); }
.bell-dot {
  position: absolute; top: 7px; right: 8px; width: 7px; height: 7px;
  background: var(--brand-red); border-radius: 50%;
}
.user-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 12px 5px 6px; border: 1px solid var(--border);
  border-radius: 999px; background: var(--surface);
}
.user-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--btn-dark); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
}
.user-name { font-size: 12px; font-weight: 600; }

/* ─── レイアウト ──────────────────────────── */
.layout { display: flex; min-height: calc(100vh - 58px); }
.sidebar {
  width: 224px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border); padding: 16px 0;
}
.co {
  padding: 4px 20px 6px; font-size: 11px; color: var(--text-dim);
  font-weight: 600; letter-spacing: 0.3px;
}
.co-refresh {
  display: block; margin: 0 20px 14px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 11px; font-weight: 600;
  padding: 4px 8px; background: var(--bg); color: var(--text-sub);
  border: 1px solid var(--border-strong); border-radius: 6px; cursor: pointer;
}
.co-refresh:hover { color: var(--accent); border-color: var(--accent); }
.co-refresh:disabled { opacity: 0.5; cursor: default; }
.nav-section {
  padding: 14px 20px 5px; font-size: 10px; font-weight: 700;
  letter-spacing: 1px; color: var(--text-dim); font-family: 'Outfit', sans-serif;
}
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 11px 20px; border: none; background: transparent;
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: var(--text-sub);
  cursor: pointer; text-align: left; border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft); color: var(--accent);
  border-left-color: var(--accent); font-weight: 600;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

.main { flex: 1; min-width: 0; padding: 24px 26px 48px; }
.main.flush { padding: 0; }

/* ─── ページ共通 ─────────────────────────── */
.page { animation: fade 0.28s ease; }
.page[hidden] { display: none; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.module-frame {
  width: 100%; height: calc(100vh - 58px);
  border: 0; display: block; background: var(--surface);
}
.mod-toolbar {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 16px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.mod-toolbar button {
  font: inherit; font-size: 13px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); cursor: pointer;
}
.mod-toolbar button:hover { background: var(--bg); }
.mod-toolbar .spacer { flex: 1; }
.page-with-toolbar .module-frame { height: calc(100vh - 103px); }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 22px;
}
.card-h {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 600; margin-bottom: 14px;
}
.card-h svg { width: 16px; height: 16px; color: var(--accent); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* ─── タイル ──────────────────────────────── */
.tile-row { display: flex; gap: 10px; }
.tile {
  flex: 1; border: 1px solid var(--border-strong); border-radius: 10px;
  padding: 16px 8px 14px; text-align: center; background: var(--surface);
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.tile:hover { border-color: var(--accent); background: var(--accent-soft); }
.tile-icon {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;
}
.tile-icon svg { width: 24px; height: 24px; }
.tile-text { font-size: 12.5px; line-height: 1.45; }
.tile-text b { font-weight: 600; }
.tile.muted { cursor: not-allowed; }
.tile.muted:hover { border-color: var(--border-strong); background: var(--surface); }
.tile.muted .tile-icon { background: var(--soft); color: var(--text-dim); }
.tile.muted .tile-text { color: var(--text-dim); }
.tile-badge {
  display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 700;
  color: var(--text-dim); background: var(--soft);
  border-radius: 5px; padding: 1px 7px; letter-spacing: 0.5px;
}

.search-lab { font-size: 11px; color: var(--text-sub); font-weight: 600; margin: 16px 0 6px; }
.search-row { display: flex; gap: 6px; }
.search-row input {
  flex: 1; padding: 8px 11px; font-size: 12px; font-family: inherit;
  border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface);
}
.search-row input:focus { outline: none; border-color: var(--accent); }
.search-row button {
  padding: 8px 14px; border-radius: 7px; cursor: pointer;
  background: var(--btn-dark); color: #fff; border: none;
  display: flex; align-items: center;
}
.search-row button svg { width: 15px; height: 15px; }

/* ─── テーブル・リスト ───────────────────── */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th {
  text-align: left; padding: 8px 6px; color: var(--text-sub); font-weight: 600;
  border-bottom: 1px solid var(--border-strong); white-space: nowrap;
}
.tbl td { padding: 10px 6px; border-bottom: 1px solid var(--border); }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: var(--bg); }
.link-r { text-align: right; margin-top: 10px; }
.link-r a, .inline-link { color: var(--accent); font-size: 12px; cursor: pointer; font-weight: 600; }
.link-r a:hover, .inline-link:hover { text-decoration: underline; }

.list { list-style: none; }
.list li {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px;
}
.list li:last-child { border-bottom: none; }
.list .due { color: var(--danger); font-weight: 600; white-space: nowrap; }
.list .title-link { cursor: pointer; }
.list .title-link:hover { color: var(--accent); }
.count-r { font-size: 11px; color: var(--text-sub); text-align: right; margin-top: 8px; }
.home-empty { color: var(--text-sub); text-align: center; padding: 14px 6px; font-size: 13px; }
.count-r b { color: var(--accent); font-size: 13px; font-weight: 700; margin: 0 2px; }

.period { display: inline-flex; align-items: center; gap: 4px; color: var(--text-sub); }
.period svg { width: 13px; height: 13px; }

/* ─── お知らせ ────────────────────────────── */
.news-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.pill {
  display: inline-block; margin-left: 8px; padding: 3px 10px;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; font-size: 11px; font-weight: 600;
}
.news-row {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 2px; border-bottom: 1px solid var(--border);
  font-size: 12px; cursor: pointer;
}
.news-row:last-child { border-bottom: none; }
.news-row:hover { background: var(--bg); }
.news-date { color: var(--text-dim); width: 62px; flex-shrink: 0; font-family: 'Outfit', sans-serif; }
.news-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─── ホーム改修（統合カード・7:3・お知らせ） ───────────── */
.home-stack { display: flex; flex-direction: column; gap: 16px; }
#page-home .card { border-radius: 8px; }              /* シャープ寄せ（ホームのみ） */
#page-home .card-h { margin-bottom: 20px; }           /* 見出し下に余白 */
/* ① 受検状況を確認する｜新着の問診完了者（案B：白地＋中央カラー区切り） */
.hm-merge { display: flex; flex-direction: column; min-height: 288px; }
.hm-split { display: flex; align-items: stretch; flex: 1; }
.hm-pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: 2px 20px; }
.hm-pane:first-child { padding-left: 2px; }
.hm-pane:last-child { padding-right: 2px; }
.hm-pane .link-r { margin-top: auto; }
.hm-divider { flex: 0 0 4px; align-self: stretch; border-radius: 4px;
  background: linear-gradient(180deg, var(--accent), var(--brand-blue)); margin: 2px 16px; }
.hm-subh { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; margin: 0 0 18px; }
.hm-subh svg { width: 15px; height: 15px; }
.hm-subh-green { color: var(--accent); }
.hm-subh-blue { color: var(--brand-blue); }
/* ② 公開中(7)｜受検期限が近い(3) */
.home-row73 { display: flex; gap: 16px; align-items: stretch; }
.home-row73 .hm-col7 { flex: 7 1 0; min-width: 0; }
.home-row73 .hm-col3 { flex: 3 1 0; min-width: 0; }
.home-row73 .card { display: flex; flex-direction: column; min-height: 288px; }
.home-row73 .count-r, .home-row73 .link-r { margin-top: auto; }
.list .soon { color: var(--text-dim); white-space: nowrap; }
/* ③ お知らせ（見出しは箱の外・内容は四角ボックス） */
.nw-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 4px 12px; }
.nw-hl { display: flex; align-items: center; gap: 11px; }
.nw-hl svg { width: 22px; height: 22px; color: var(--accent); }
.nw-hl b { font-size: 17px; font-weight: 700; }
.nw-sub { color: var(--accent); font-size: 13.5px; font-weight: 600; }
.nw-more { color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.nw-box { background: var(--surface); border: 1px solid var(--border); border-radius: 0; overflow: hidden; }
.nw-item { border-bottom: 1px solid var(--soft); }
.nw-item:last-child { border-bottom: none; }
.nw-row { display: flex; align-items: center; gap: 20px; padding: 15px 22px; }
.nw-date { flex: 0 0 auto; min-width: 74px; color: var(--text-sub); font-size: 13px; font-family: 'Outfit', sans-serif; }
.nw-ttl { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nw-detail { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; font-family: inherit; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
.nw-detail svg { width: 13px; height: 13px; transition: transform .2s; }
.nw-item.open .nw-detail svg { transform: rotate(180deg); }
.nw-body { display: none; padding: 0 22px 16px; font-size: 13px; line-height: 1.7; color: var(--text-sub); white-space: pre-wrap; }
.nw-item.open .nw-body { display: block; }

/* ─── トースト ───────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--btn-dark); color: #fff; font-size: 12.5px;
  padding: 11px 20px; border-radius: 9px; opacity: 0;
  pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .grid-2 { grid-template-columns: 1fr; }
  .hm-split, .home-row73 { flex-direction: column; }
  .hm-divider { display: none; }
  .hm-merge, .home-row73 .card { min-height: 0; }
  .sidebar { width: 64px; }
  .co, .nav-section, .nav-item span { display: none; }
  .nav-item { justify-content: center; padding: 13px 0; }
}

/* ─── 企業セレクタ / 起動オーバーレイ（Supabase 連携で追加）──────────── */
.co-select {
  width: 100%; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 8px; border: 1px solid var(--border-strong);
  border-radius: 7px; background: var(--surface); color: var(--text); cursor: pointer;
}
.co-select:focus { outline: none; border-color: var(--accent); }
.user-chip { cursor: pointer; }
.boot-overlay {
  position: fixed; inset: 0; z-index: 200; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.boot-overlay[hidden] { display: none; }
.boot-msg {
  font-size: 13.5px; color: var(--text-sub); font-weight: 600;
  font-family: 'Noto Sans JP', sans-serif; text-align: center; padding: 0 20px;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <svg viewBox="0 0 36 36" aria-hidden="true">
      <defs>
        <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="50%" stop-color="#22c55e"/>
          <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
      </defs>
      <polygon points="18,3 33,31 3,31" fill="none" stroke="url(#pg)" stroke-width="2.4"/>
    </svg>
    <span class="logo-text">PRISM LOGIC</span>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="toast('お知らせは3件あります')" aria-label="お知らせ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16zM10 20a2 2 0 0 0 4 0"/></svg>
      <span class="bell-dot"></span>
    </button>
    <div class="user-chip">
      <span class="user-avatar">人</span>
      <span class="user-name">人事 ご担当者</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="co" id="companyLabel">読み込み中…</div>
    <nav>
      <button class="nav-item active" data-page="home" onclick="showPage('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </button>
      <div class="nav-section">PRISM LOGIC</div>
      <button class="nav-item" data-page="persona" onclick="showPage('persona')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12,2 22,8 22,16 12,22 2,16 2,8"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="8" x2="22" y2="16"/><line x1="22" y1="8" x2="2" y2="16"/></svg>
        <span>ペルソナ設計</span>
      </button>
      <button class="nav-item" data-page="requests" onclick="showPage('requests')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="18" r="1.5"/><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/></svg>
        <span>受検者一覧</span>
      </button>
    </nav>
  </aside>

  <main class="main">

    <!-- ============ ホーム ============ -->
    <section class="page" id="page-home">
      <div class="home-stack">

        <!-- ① 受検状況を確認する｜新着の問診完了者（案B：白地＋中央カラー区切り）-->
        <section class="card hm-merge">
          <div class="hm-split">
            <div class="hm-pane">
              <div class="hm-subh hm-subh-green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="10" cy="7" r="4"/></svg>
                受検状況を確認する
              </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* データ島に格納したモジュール HTML を取り出して復元する。
   ビルド時にスクリプト終了タグをバックスラッシュで退避してあるため、ここで戻す。 */
function moduleHtml(id) {
  var tpl = document.getElementById(id);
  if (!tpl) return '';
  var html = tpl.textContent.replace(/<\\\/script/gi, '<\/script');
  /* [v32] モジュール自身のスクリプトより前に「企業ID＋キャッシュシム」を注入する。
     srcdoc iframe は親と別レルムなので、ここで各 iframe にもシムを効かせる。
     文字列リテラル中の終了タグは分割して親 <script> を閉じないようにする。 */
  var inject = '<scr' + 'ipt>window.PRISM_CID=' + JSON.stringify(currentCompanyId || '') + ';</scr' + 'ipt>'
             + '<scr' + 'ipt>' + PRISM_CACHE_SHIM + '</scr' + 'ipt>';
  if (/<head[^>]*>/i.test(html)) {
    return html.replace(/<head[^>]*>/i, function(m){ return m + inject; });
  }
  return inject + html;
}

/* モジュールを iframe へ srcdoc 注入。
   force=true のときは再注入＝再起動し、localStorage を読み直させる。 */
function loadModule(name, force) {
  var f = document.querySelector('#page-' + name + ' iframe');
  if (!f) return;
  if (force || !f.getAttribute('srcdoc')) {
    f.setAttribute('srcdoc', moduleHtml(f.dataset.mod));
  }
}

/* ── 更新（明示的なリハイドレート）─────────────────────────────────
   サイドバーの「最新化」ボタンから呼ぶ。クラウドの最新を取り直し、
   いま表示中のモジュールを再注入して、画面表示も更新する。 */
async function refreshPlatform() {
  if (!appReady || !currentCompanyId) return;
  var btn = document.getElementById('refreshBtn');
  if (btn) btn.disabled = true;
  showOverlay('最新のデータに更新中…');
  try {
    /* [v31-B] 保留中のローカル編集を先にクラウドへ反映させてから取り直す */
    await flushPendingSyncs();
    await hydrate(currentCompanyId);
    /* 企業名ラベルを更新 */
    try {
      var cfg = JSON.parse(localStorage.getItem('prism_company_config') || '{}');
      var lbl = document.getElementById('companyLabel');
      if (lbl) lbl.textContent = cfg.companyName || '（企業名なし）';
    } catch (e) {}
    /* 表示中のモジュール／受検者一覧を再読込 */
    var visible = document.querySelector('.page:not([hidden])');
    if (visible && visible.id && visible.id.indexOf('page-') === 0) {
      var pname = visible.id.slice('page-'.length);
      if (FRAME_PAGES[pname]) {
        loadModule(pname, true);
      } else if (pname === 'requests') {
        var rf = document.getElementById('requestsFrame');
        if (rf) {
          var ru = 'requests.html?company=' + encodeURIComponent(currentCompanyId)
                 + '&_=' + Date.now();
          rf.setAttribute('src', ru);
        }
      } else if (pname === 'home') {
        renderHome();   /* [v32-①] ホームも最新化対象に */
      }
    }
  } catch (err) {
    console.error(err);
    alert('更新に失敗しました。通信状態をご確認ください。');
  }
  hideOverlay();
  if (btn) btn.disabled = false;
}

var FRAME_PAGES = { persona: 1, results: 1, detail: 1 };

function showPage(name, force) {
  document.querySelectorAll('.page').forEach(function(p) {
    p.hidden = (p.id !== 'page-' + name);
  });
  /* results / detail は admin 配下の画面。サイドバーは「ペルソナ設計」を点灯 */
  var navName = (name === 'results' || name === 'detail') ? 'persona' : name;
  document.querySelectorAll('.nav-item').forEach(function(b) {
    b.classList.toggle('active', b.dataset.page === navName);
  });
  var isFrame = !!FRAME_PAGES[name];
  /* 受検者一覧（requests）は本番 requests.html を src 埋め込み。loadModule は使わない */
  var isRequests = (name === 'requests');
  document.querySelector('.main').classList.toggle('flush', isFrame || isRequests);
  if (isFrame) loadModule(name, force);

/* ── [v32-①] ホーム画面の実データ描画 ─────────────────────────────────
   ダミーを撤去し、現在企業の survey_requests（受検依頼）から3カードを描画する。
   受検依頼は「受検者1人＝1行」モデルなので、キャンペーン概念ではなく受検者単位で扱う。
   お知らせは任意の announcements テーブルから読み、無ければ黙って非表示（デプロイ安全）。*/
let homeRequests = [];
function hEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function hDate(iso, short){
  if (!iso) return '—';
  var d = new Date(iso); if (isNaN(d)) return '—';
  var p = function(n){ return String(n).padStart(2,'0'); };
  var y = d.getFullYear();
  return short ? (String(y).slice(2)+'.'+p(d.getMonth()+1)+'.'+p(d.getDate()))
               : (y+'/'+p(d.getMonth()+1)+'/'+p(d.getDate()));
}
function hStatusJa(s){ return s==='completed' ? '完了' : (s==='opened' ? '受検中' : '未着手'); }
function homeRow3(msg){ return '<tr><td colspan="3" class="home-empty">'+hEsc(msg)+'</td></tr>'; }

async function renderHome(){
  if (!currentCompanyId || !sb) return;
  var elC = document.getElementById('home-completed');
  var elA = document.getElementById('home-active');
  var elAc = document.getElementById('home-active-count');
  var elD = document.getElementById('home-deadline');
  if (elC) elC.innerHTML = homeRow3('読み込み中…');
  try {
    var res = await sb.from('survey_requests')
      .select('respondent_name, job_type, status, expires_at, created_at, completed_at')
      .eq('company_id', currentCompanyId);
    if (res.error) throw res.error;
    homeRequests = res.data || [];
  } catch (e) {
    console.error('[home] survey_requests', e);
    if (elC)  elC.innerHTML = homeRow3('読み込みに失敗しました');
    if (elA)  elA.innerHTML = '<tr><td colspan="2" class="home-empty">読み込みに失敗しました</td></tr>';
    if (elAc) elAc.textContent = '—';
    if (elD)  elD.innerHTML = '<li class="home-empty">読み込みに失敗しました</li>';
    return;
  }
  paintCompleted(homeRequests);

  /* 公開中（未完了＝pending/opened）の受検依頼 */
  var active = homeRequests.filter(function(r){ return r.status !== 'completed'; });
  if (elAc) elAc.textContent = String(active.length);
  if (elA) {
    if (!active.length) {
      elA.innerHTML = '<tr><td colspan="2" class="home-empty">公開中の受検依頼はありません</td></tr>';
    } else {
      active.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
      elA.innerHTML = active.slice(0,6).map(function(r){
        var due = r.expires_at ? ('〆 '+hDate(r.expires_at)) : (hStatusJa(r.status));
        return '<tr onclick="showPage(\'requests\')"><td>'+hEsc(r.respondent_name||'—')+'</td>'
             + '<td>'+hEsc(r.job_type||'—')+' / '+hEsc(due)+'</td></tr>';
      }).join('');
    }
  }

  /* 受検期限が近い（未完了かつ expires_at あり、昇順）*/
  if (elD) {
    var withDue = active.filter(function(r){ return !!r.expires_at; })
      .sort(function(a,b){ return new Date(a.expires_at) - new Date(b.expires_at); });
    if (!withDue.length) {
      elD.innerHTML = '<li class="home-empty">期限の近い受検依頼はありません</li>';
    } else {
      elD.innerHTML = withDue.slice(0,5).map(function(r){
        var days = Math.ceil((new Date(r.expires_at) - Date.now()) / 86400000);
        var label = days < 0 ? '期限切れ' : (days === 0 ? '本日まで' : 'あと' + days + '日');
        var cls = days <= 3 ? 'due' : 'soon';
        return '<li><span class="title-link" onclick="showPage(\'requests\')">'
             + hEsc(r.respondent_name||'—') + '（' + hEsc(r.job_type||'—') + '）</span>'
             + '<span class="' + cls + '">' + label + '</span></li>';
      }).join('');
    }
  }

  await renderNews();
}

/* 新着の問診完了者（検索時は名前で全ステータスを絞り込み）*/
function paintCompleted(list, query){
  var elC = document.getElementById('home-completed');
  if (!elC) return;
  var rows;
  if (query) {
    rows = list.filter(function(r){ return (r.respondent_name||'').indexOf(query) > -1; });
    if (!rows.length) { elC.innerHTML = homeRow3('「'+hEsc(query)+'」に一致する受検者はいません'); return; }
    rows = rows.slice(0,12);
    elC.innerHTML = rows.map(function(r){
      var third = r.status==='completed' ? hDate(r.completed_at) : hStatusJa(r.status);
      return '<tr onclick="showPage(\'persona\')"><td>'+hEsc(r.respondent_name||'—')+'</td>'
           + '<td>'+hEsc(r.job_type||'—')+'</td><td>'+hEsc(third)+'</td></tr>';
    }).join('');
    return;
  }
  var done = list.filter(function(r){ return r.status==='completed'; })
    .sort(function(a,b){ return new Date(b.completed_at) - new Date(a.completed_at); });
  if (!done.length) { elC.innerHTML = homeRow3('まだ完了した受検者はいません'); return; }
  elC.innerHTML = done.slice(0,6).map(function(r){
    return '<tr onclick="showPage(\'persona\')"><td>'+hEsc(r.respondent_name||'—')+'</td>'
         + '<td>'+hEsc(r.job_type||'—')+'</td><td>'+hDate(r.completed_at)+'</td></tr>';
  }).join('');
}

/* ============================================================================
   Supabase 連携 ── ハイドレート ＋ write-through 方式（引き継ぎ v28 → 本フェーズ）
   ----------------------------------------------------------------------------
   ・親シェルだけで完結。各モジュール（admin / results / detail）の内部は無改修。
   ・localStorage は「ローカルキャッシュ兼モジュール間バス」として存続させる。
   ・起動時に Supabase → localStorage へハイドレート（3キーを流し込む）。
   ・モジュールが localStorage に書き込むと、親が storage イベントで検知して
     Supabase へ write-through する。対象は prism_company_config と
     prism_persona_results の2キーのみ。
   ・prism_raw_responses（回答）は読み取り専用。プラットフォームからは
     一切書き戻さない（本番 responses テーブルの汚染を防ぐ）。
   ============================================================================ */
const SUPABASE_URL = 'https://ntsqmhcyvopnsxdhtwzj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e6kLk_fC9OIiaMhiiqKjXA_pFE1KKc1';

let currentCompanyId = null;   /* 選択中の企業（Supabase の uuid）         */
let appReady = false;          /* ハイドレート完了フラグ                   */
let hydrating = false;         /* ハイドレート中は write-through を抑止     */

/* ── ローカルキャッシュ（前回ユーザーの取り残し防止）─────────────────
   localStorage は読み込み高速化のための一時コピーで、正本は Supabase。
   ブラウザを別のユーザーが使った場合に前回のデータが残らないよう、
   ログイン直後（bootstrap 冒頭）とログアウト時に確実に消す。              */
const STORAGE_KEYS = ['prism_company_config', 'prism_raw_responses', 'prism_persona_results'];

/* ── [v32] キャッシュの企業ID名前空間化＋刻印ガード ──────────────────────
   問題: 3つのキャッシュキーはブラウザで1組を共有していたため、スタッフが複数企業を
   同時タブで開くと、後発タブのハイドレートが共有キャッシュを上書きし、別企業の回答が
   チャートに混じる恐れがあった（クライアントは自社1社のみで無関係）。
   対策: 3キーへの get/set/removeItem を <base>__<companyId> に透過的に振り替える
   シムを、親と各モジュール srcdoc の "両方" に適用する。別企業のキャッシュは物理的に
   別キーとなり混ざらない。さらに値に __cid を刻印し、読み出し時に現在企業と一致しな
   ければ null を返す二重ガードを設ける。companyId は window.PRISM_CID から取得する。
   注: 親とモジュールは別レルム（Storage.prototype が各々独立）なので、同一シムを
   両方で走らせる必要がある。関数として定義し、親はそのまま実行、srcdoc には
   toString() でソースを埋め込む（eval 不使用・単一ソース）。 */
function prismCacheShim() {
  if (window.__prismShim) return;
  window.__prismShim = true;
  var BASE = { prism_company_config: 1, prism_raw_responses: 1, prism_persona_results: 1 };
  function cid() { return window.PRISM_CID || ''; }
  function rk(b) { var c = cid(); return c ? (b + '__' + c) : b; }
  var P = Storage.prototype, g = P.getItem, s = P.setItem, r = P.removeItem;
  window.__prismRaw = { g: g, s: s, r: r };
  P.getItem = function(k) {
    if (!BASE[k]) return g.call(this, k);
    var raw = g.call(this, rk(k));
    if (raw == null) return null;
    try {
      var o = JSON.parse(raw);
      if (o && typeof o === 'object' && '__cid' in o) {
        return (o.__cid === cid()) ? o.v : null;   /* 別企業の刻印は使わない */
      }
      return raw;                                   /* 旧形式（刻印なし）はそのまま */
    } catch (e) { return raw; }
  };
  P.setItem = function(k, v) {
    if (!BASE[k]) return s.call(this, k, v);
    return s.call(this, rk(k), JSON.stringify({ __cid: cid(), v: v }));
  };
  P.removeItem = function(k) {
    if (!BASE[k]) return r.call(this, k);
    return r.call(this, rk(k));
  };
}
prismCacheShim();   /* 親レルムへ適用 */
/* srcdoc 注入用のソース文字列（同一実装を toString で取り出す）*/
const PRISM_CACHE_SHIM = '(' + prismCacheShim.toString() + ')();';

/* 全企業の prism キャッシュを物理キーから直接削除する（ログアウト時の衛生）。
   シムを通すと現在企業ぶんしか消せないため、生の removeItem で全 __<cid> を消す。 */
function clearLocalCache() {
  try {
    var rem = (window.__prismRaw && window.__prismRaw.r)
      ? window.__prismRaw.r.bind(localStorage)
      : localStorage.removeItem.bind(localStorage);
    var kill = [];
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (!key) continue;
      for (var j = 0; j < STORAGE_KEYS.length; j++) {
        if (key === STORAGE_KEYS[j] || key.indexOf(STORAGE_KEYS[j] + '__') === 0) {
          kill.push(key); break;
        }
      }
    }
    kill.forEach(function(k){ try { rem(k); } catch (e) {} });
  } catch (e) {}
}

/* ── ハイドレート：Supabase → localStorage ───────────────────────────── */
async function hydrate(companyId) {
  window.PRISM_CID = companyId || '';   /* [v32] 以降のキャッシュ書込を企業名前空間へ */
  hydrating = true;
  try {
    const [coRes, respRes] = await Promise.all([
      sb.from('companies').select('*').eq('id', companyId).single(),
      sb.from('responses').select('answers').eq('company_id', companyId),
    ]);
    if (coRes.error)   throw coRes.error;
    if (respRes.error) throw respRes.error;

    /* personas: persona_id 列つきで取得。マイグレーション（prism-personas-upsert.sql）
       未実行の環境では persona_id 列が無く 400 になるため、その場合は meta のみで
       再取得し、プラットフォーム全体が落ちないようにする（後方互換・自己回復）。 */
    let persRes = await sb.from('personas').select('meta, persona_id').eq('company_id', companyId)
      .order('created_at', { ascending: true });
    if (persRes.error) {
      console.warn('[hydrate] personas の persona_id 取得に失敗。meta のみで再取得します'
        + '（prism-personas-upsert.sql 未実行の可能性）:', persRes.error);
      persRes = await sb.from('personas').select('meta').eq('company_id', companyId)
        .order('created_at', { ascending: true });
    }
    if (persRes.error) throw persRes.error;

    /* companies 1行 → prism_company_config */
    localStorage.setItem('prism_company_config',
      JSON.stringify(rowToConfig(coRes.data)));
    /* responses.answers（buildRawResponse 出力そのもの）→ prism_raw_responses */
    const responses = (respRes.data || []).map(r => r.answers).filter(Boolean);
    localStorage.setItem('prism_raw_responses', JSON.stringify(responses));
    /* personas.meta（旧ペルソナオブジェクトを丸ごと格納）→ prism_persona_results */
    /* [v31-C] バッチ insert は created_at が同一になり並び順が保証されないため、
       meta._order（保存時の並び）で安定ソートする。_order を持たない旧データは
       0 扱い＝クエリの created_at 昇順がそのまま残る（後方互換）。 */
    const personas = (persRes.data || []).map(function(r) {
      var m = r.meta || null;
      if (!m) return null;
      /* [v37-③] 安定ID（persona_id 列）をローカルへ復元。meta に personaId が無い
         旧データだけ列から補完し、次回保存で同じIDを衝突キーとして使い回す。 */
      if (!m.personaId && r.persona_id) m = Object.assign({}, m, { personaId: r.persona_id });
      return m;
    }).filter(Boolean);
    personas.sort(function(a, b) {
      const ao = (a && typeof a._order === 'number') ? a._order : 0;
      const bo = (b && typeof b._order === 'number') ? b._order : 0;
      return ao - bo;
    });
    localStorage.setItem('prism_persona_results', JSON.stringify(personas));
  } finally {
    hydrating = false;
  }
}

/* ── write-through を直列化（delete→insert の競合・順序逆転を防ぐ）────── */
let syncChain = Promise.resolve();
const syncTimers = {};
const pendingFns = {};                 /* [v31-B] 保留中の同期関数（フラッシュ用）*/
function runSync(key) {
  clearTimeout(syncTimers[key]);
  delete syncTimers[key];
  const fn = pendingFns[key];
  if (!fn) return;
  delete pendingFns[key];
  syncChain = syncChain.then(fn).catch(function(err) {
    console.error('[supabase sync]', err);
  });
}
function scheduleSync(key, fn) {
  /* 同一キーへの連続書き込みは 200ms デバウンスで1回にまとめる */
  clearTimeout(syncTimers[key]);
  pendingFns[key] = fn;
  syncTimers[key] = setTimeout(function() { runSync(key); }, 200);
}
/* [v31-B] 保留中のデバウンス同期を即時実行し、直列チェーンの完了まで待つ。
   最新化（再ハイドレート）の直前に呼ぶ。ローカル編集を先にクラウドへ反映させて
   から取り直すため、「編集直後に最新化すると一瞬編集が消える」窓を解消する。 */
async function flushPendingSyncs() {
  Object.keys(pendingFns).forEach(runSync);
  await syncChain;
}

/* ── write-through：prism_company_config → companies ────────────────── */
async function pushConfig(cfg) {
  if (!currentCompanyId) return;
  const { error } = await sb.from('companies')

  if (error) { console.error('[config sync]', error); toast('⚠ 設定の同期に失敗しました'); }
  else       { toast('✓ 設定を Supabase に保存しました'); }
}

/* ── write-through：prism_persona_results → personas ────────────────── */
/* [v37-③] delete-all-then-insert → upsert＋差分削除へ移行。
   ペルソナごとに安定ID persona_id（クライアント採番 personaId）を持たせ、
     1) upsert（あれば更新・無ければ挿入。衝突キー = company_id, persona_id）
     2) 現在セットに無い既存行だけ削除（全削除はしない）
   の順で行う。upsert を先に通すので「消えてから入る」窓（partial-failure）を
   作らない。upsert 失敗時は削除へ進まない。空リストは企業の全ペルソナ削除。 */
function newPersonaId() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return 'pid-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
async function pushPersonas(list) {
  if (!currentCompanyId) return;
  list = list || [];

  /* 1) 行を作る（persona_id 必須・meta にも personaId として保持して往復させる）。
     既存の personaId があれば再利用（＝upsert で当該行が温存・更新される）。 */
  const seen = {};
  const rows = list.map(function(p, i) {
    const pid = p.personaId || (p.meta && p.meta.persona_id) || p.persona_id || newPersonaId();
    return {
      company_id:   currentCompanyId,
      persona_id:   pid,
      persona_name: p.personaName || '無題ペルソナ',
      company_name: p.companyName || null,
      mode:         p.mode || 'a',
      items:        p.items || [],
      /* 並び順を meta._order に焼き込む（hydrate 側で安定ソート）。元オブジェクトは
         汚さないよう浅いコピーに付与。personaId も meta に残し再ハイドレートで復元。 */
      meta:         Object.assign({}, p, { _order: i, personaId: pid }),
    };
  }).filter(function(r) {
    /* 同一 persona_id の重複は upsert が拒否する（ON CONFLICT が同一行を二度更新できない）。
       万一の重複に備え、先勝ちで一意化する。 */
    if (seen[r.persona_id]) return false;
    seen[r.persona_id] = 1; return true;
  });

  /* 2) upsert（先に入れてから消す＝窓を作らない）。 */
  if (rows.length) {
    const up = await sb.from('personas')
      .upsert(rows, { onConflict: 'company_id,persona_id' });
    if (up.error) {
      console.error('[persona sync] upsert', up.error);
      toast('⚠ ペルソナの同期に失敗しました'); return;   /* 失敗時は削除しない */
    }
  }

  /* 3) 現在セットに無い既存行だけ削除。空リスト時は企業の全ペルソナ削除。 */
  const keep = rows.map(function(r) { return r.persona_id; });
  let delq = sb.from('personas').delete().eq('company_id', currentCompanyId);
  if (keep.length) {
    delq = delq.not('persona_id', 'in',
      '(' + keep.map(function(x) { return '"' + x + '"'; }).join(',') + ')');
  }
  const del = await delq;
  if (del.error) {
    console.error('[persona sync] delete', del.error);
    toast('⚠ ペルソナの同期に失敗しました'); return;
  }

  toast('✓ ペルソナを Supabase に保存しました');
}

/* ── storage イベント購読：モジュール（iframe）の書き込みを拾う ──────── */
/* srcdoc iframe は親と同一オリジン。iframe 内の localStorage 書き込みは
   親コンテキストに storage イベントとして届く（書いた当人には届かない）。
   よってモジュールを一切改変せずに write-through を実現できる。 */
window.addEventListener('storage', function(e) {
  if (hydrating || !appReady) return;
  if (!e.key || !e.newValue) return;
  /* [v32] キーは <base>__<companyId>、値は {__cid, v} で刻印されている。
     現在企業のキーだけを対象にする（別企業タブの書き込みイベントは無視）。
     これにより複数タブでも他社の編集を取り込まない。 */
  var cid = currentCompanyId || '';
  function payload() {
    try {
      var o = JSON.parse(e.newValue);
      var s = (o && typeof o === 'object' && '__cid' in o) ? (o.__cid === cid ? o.v : null) : e.newValue;
      return (s == null) ? null : JSON.parse(s);
    } catch (err) { return null; }
  }
  if (e.key === 'prism_company_config__' + cid) {
    var cfg = payload();
    if (cfg) scheduleSync('config', function() { return pushConfig(cfg); });
  } else if (e.key === 'prism_persona_results__' + cid) {
    var list = payload();
    if (list) scheduleSync('personas', function() { return pushPersonas(list); });
  }
  /* prism_raw_responses は write-through しない（responses は読み取り専用）*/
});

/* ── 企業セレクタ変更 ─────────────────────────────────────────────── */
/* ── 企業の文脈を解決（selector は廃止）─────────────────────────────
   ・URL に ?company=<id> があればそれ（スタッフが当社管理画面から開いた場合）
   ・無ければ memberships から自社を解決（クライアント）
   ・どちらも無い（スタッフが企業未指定で直接開いた）→ null を返す      */
async function resolveCompanyId() {
  var fromUrl = new URLSearchParams(location.search).get('company');
  if (fromUrl) return fromUrl;
  var res = await sb.from('memberships').select('company_id');
  if (res.error) { console.error(res.error); return null; }
  var rows = res.data || [];
  return rows.length ? rows[0].company_id : null;
}

/* ── 起動シーケンス ───────────────────────────────────────────────── */
async function bootstrap() {
  showOverlay('読み込み中…');
  /* [v32] かつてはここで全キャッシュを消していたが、キャッシュは企業IDで名前空間化され
     hydrate が現在企業ぶんを必ず上書きするため、起動時の全消去は不要になった。
     全消去は他タブ（別企業）のキャッシュまで巻き込むため、ログアウト時のみに限定する。 */
  if (!sb) {
    showOverlay('Supabase に接続できません。ネットワーク環境をご確認ください。');
    return;
  }
  /* 1) セッション確認。未ログインならログインページへ */
  let session = null;
  try {
    const res = await sb.auth.getSession();
    session = res.data ? res.data.session : null;
  } catch (err) { console.error(err); }
  if (!session) { location.href = 'login.html'; return; }

  /* ログインユーザーを表示し、クリックでログアウト */
  const email = session.user && session.user.email;
  if (email) {
    var nameEl = document.querySelector('.user-name');
    if (nameEl) nameEl.textContent = email;
    var avEl = document.querySelector('.user-avatar');
    if (avEl) avEl.textContent = email.charAt(0).toUpperCase();
  }
  var chip = document.querySelector('.user-chip');
  if (chip) {
    chip.title = 'クリックでログアウト';
    chip.addEventListener('click', async function() {
      if (!confirm('ログアウトしますか？')) return;
      clearLocalCache();   /* 退出時にもキャッシュを残さない */
      try { await sb.auth.signOut(); } catch (e) {}
      location.href = 'login.html';
    });
  }

  /* 2) 企業の文脈を解決 */
  let companyId = null;
  try { companyId = await resolveCompanyId(); }
  catch (err) { console.error(err); }
  if (!companyId) {
    /* スタッフが企業未指定で開いた場合。リダイレクトループを避け、
       自動転送せずに当社管理画面への導線を出す。 */
    var bm = document.getElementById('bootMsg');
    if (bm) bm.innerHTML =
      '企業が指定されていません。<br>'
      + '<a href="admin.html" style="color:var(--accent);font-weight:700;">当社管理画面へ</a>';
    showOverlay();
    return;
  }
  currentCompanyId = companyId;
  window.PRISM_CID = companyId || '';   /* [v32] 企業名前空間を確定（hydrate 前の読みも安全に）*/

  /* 3) ハイドレート */
  try {
    await hydrate(currentCompanyId);
  } catch (err) {
    console.error(err);
    /* 自動ログイン→失敗のループに陥らないよう、明示的な「ログインし直す」導線を出す
       （クリックで signOut＋キャッシュ掃除＝login.html が再リダイレクトしなくなる）。 */
    var bmE = document.getElementById('bootMsg');
    if (bmE) bmE.innerHTML =
      '企業データの読み込みに失敗しました。アクセス権をご確認ください。<br>'
      + '<a href="#" id="reloginLink" style="color:var(--accent);font-weight:700;">ログインし直す</a>';
    showOverlay();
    var rl = document.getElementById('reloginLink');
    if (rl) rl.onclick = async function(e) {
      e.preventDefault();
      try { await sb.auth.signOut(); } catch (_) {}
      try { clearLocalCache(); } catch (_) {}
      location.href = 'login.html';
    };
    return;
  }

  /* サイドバーに企業名を表示 */
  try {
    var cfg = JSON.parse(localStorage.getItem('prism_company_config') || '{}');
    var lbl = document.getElementById('companyLabel');
    if (lbl) lbl.textContent = cfg.companyName || '（企業名なし）';
  } catch (e) {}

  appReady = true;
  hideOverlay();

  /* [v32-①] 既定ページはホーム。起動完了時に実データで描画する。 */
  var firstPage = document.querySelector('.page:not([hidden])');
  if (firstPage && firstPage.id === 'page-home') renderHome();
}

/* スクリプトは body 末尾にあり DOM は構築済み。直ちに起動する。 */
bootstrap();
</script>

<script type="text/html" id="mod-admin">
<!DOCTYPE html>
<!--
================================================================================
  PRISM LOGIC v6 ─ 初期設定・集計画面 (Admin / Setup & Aggregation)
================================================================================
  引き継ぎシート v9 §6 の次フェーズ候補 #1（最優先）として実装。
  これにより 問診 → 初期設定 → 集計 → 結果ページ群 の通しが実データで成立する。

  本画面の役割:
    ① 初期設定   companyConfig を作成/編集（職種・役職・カスタムグループ）
                 → localStorage 'prism_company_config' に保存
    ② 回答状況   問診の生回答（prism_raw_responses）の件数・グループ規模を確認
                 デモ用サンプル回答データの生成も可能（通し確認用）
    ③ 集計実行   対象/比較グループ・モードを選び aggregatePersona() を実行
                 → personaResult を 'prism_persona_results' に保存
    ④ ペルソナ一覧 保存済み personaResult の管理（最新化・削除）

  集計ロジックは prism-aggregation-logic-v6.js を本ファイルに同梱（改変なし）。
  契約は引き継ぎシート v9 のとおり据え置き。
  ※ aggregatePersona() の出力には companyName が含まれないため、結果ページ群
    （PERSONA.companyName を参照）向けに、保存直前に companyName を付与する。
    集計ロジック本体は変更しない。

  配色・トークンは v6 系（問診ページ）に準拠：HEART赤 / GUT緑 / CORE青 / HEAD灰。
================================================================================
-->

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">PRISM<span> LOGIC</span></div>
      <div class="brand-sub" id="companyTag">管理画面</div>
    </div>
    <div class="topbar-note">初期設定・集計 ─ 問診で集めた回答から採用ペルソナを生成します</div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="view"></div>

<script>
/* ============================================================================
   [同梱] PRISM LOGIC 集計・分類ロジック (prism-aggregation-logic-v6.js)
   ── 改変なしで同梱。module.exports はブラウザでは無視され、全関数が
      グローバルに公開される。本画面の UI スクリプトはこれを呼び出す。
   ============================================================================ */
/* ============================================================================
   PRISM LOGIC v5 ─ 集計・分類ロジック 実装   [v6 修正版]
   ============================================================================
   データ統合設計書 (prism-data-integration-design.md) に対応する実装。
   問診ページ・結果ページの両方から利用される中核ロジック。

   設計方針:
   - グループは「職種/役職/全社員/任意グループ」すべてを同一に扱う
   - 集計は1回実行して personaResult を生成（案Y）
   - 閾値: 合意率 70% / 50% / 差分 25pt

   ──────────────────────────────────────────────────────────────────────────
   v6 での修正（引き継ぎシート v6 §4-1 / §4-2 に対応）
   ──────────────────────────────────────────────────────────────────────────
   B-3  G3ランキングを集計に対応。calcRankingDistribution()（Borda）を新設し、
        classifyItem に ranking → 'profile' 分岐を追加。【システム阻害・最優先】
   B-1  欠損/null回答を分母から除外。合意率の分母を「その項目を有効回答した
        人数」に変更。保存エラーが「重要でない」に倒れる問題を解消。
   B-2  混在Tier集計に対応。項目ごとに「実際に有効回答した人」を分母にする
        ことで、聞かれていない項目が誤って 0% 側に倒れない（B-1と同根の修正）。
   B-4  getDiffMarker を符号対応に。負の大差は 'high_reverse'（ティール）。
   B-5  小グループが全社Hygiene判定を単独で覆す問題を解消。MIN_GROUP_N 未満の
        グループは Hygiene 横断チェックから除外し、dataQuality に記録。
   C-1  hygieneBandMarker のハードコード 70 を PRISM_CONFIG.HYGIENE_RATE に。
   C-2  avgStrength を「重要(strength>=5)と答えた人」だけの平均に変更。
        「重要と思う度合いの強さ」という指標定義と整合させた。
   C-3  personaId にプロセス内連番＋乱数を付与。バッチ実行のミリ秒衝突を回避。
   C-4  Mode(b)の分類上書きに監査証跡を追加。applyManualOverride() を新設し、
        overrideHistory（変更前値・変更者・理由・日時）を残す。
   C-5  generateReason を mode 対応に。Mode(a)で「代表者判断」と出ない。

   ★ 契約変更（呼び出し側への申し送り）
     - calcConsensusRate / calcAvgStrength は第2引数が itemId → item オブジェクト。
     - calcConsensusRate / calcAvgStrength は有効回答ゼロ時 0 ではなく null を返す。
       「0%が重要と回答」と「誰も回答していない」を区別するため。
     - personaResult.items[].consensus 等は数値または null。描画側は null を
       「データなし」として扱うこと。

   ──────────────────────────────────────────────────────────────────────────
   v7 での修正（動機強度ヒアリング対応）
   ──────────────────────────────────────────────────────────────────────────
   D-1  G3「動機方向性」も重要度(strength)をヒアリングする方式に変更。問診の
        G3回答が { strength, ranking } 形式になったことに対応。
        ・calcConsensusRate / calcAvgStrength が G3 でも値を返す（強度ベース）。
        ・aggregatePersona の G3 分岐が consensus / diff / avgStrength を出力。
        ・calcRankingDistribution の Borda を strength で加重（タイプA設計と同じ
          関与度加重）。weighted フラグを追加。
        ・classification は 'profile' のまま（5択ランキングは閾値分類対象外）。
        ・後方互換: 強度なしの旧 G3 データは consensus=null・重み1で従来挙動。

   ──────────────────────────────────────────────────────────────────────────
   v8 での修正（Tier 2 / Tier 3 項目の追加）
   ──────────────────────────────────────────────────────────────────────────
   D-3  TIER1_ITEMS に Tier 2（E1-E16, category 'HEAD'）と Tier 3（M1-M11,
        category 'MGMT'）を追加。全て intensityOnly。Lominger Harder tier 由来。
        ・aggregatePersona は companyConfig.questionnaireTier 以下の tier の
          項目だけを集計対象にする（Tier1のみ運用企業に空項目を出さない）。
        ・分類は既存の classifyItem に委譲（合意率ベース。新カテゴリ MGT も
          hygiene/fit/soft_fit/profile に分類されうる）。
        ※ TIER1_ITEMS の名称は歴史的経緯。実体は「全Tierの項目マスター」。

   ──────────────────────────────────────────────────────────────────────────
   v9 での修正（Tier 2/3 の項目単位の取捨選択）
   ──────────────────────────────────────────────────────────────────────────
   D-5  Tier 2/3 を「Tier単位の累積ON/OFF」から「項目単位の取捨選択」に変更。
        ・companyConfig.enabledItems（選択された Tier 2/3 項目IDの配列）を新設。
        ・Tier 1 は常に必須・全項目出題。Tier 2/3 は enabledItems のみ。
        ・aggregatePersona は resolveEnabledItems() で対象項目を解決。
        ・後方互換: 旧 questionnaireTier しか無い設定は同関数が累積導出する。

   ──────────────────────────────────────────────────────────────────────────
   v10 での修正（Tier 2/3 を採用判断にどう使うか ─ B案修正版）
   ──────────────────────────────────────────────────────────────────────────
   D-7  Tier 2/3（HEAD・MGMT＝育成可能層）を採用ゲートから分離し、「育成優先度」
        として分類する。引き継ぎシート v15 §2 の方法論判断＝B案修正版の実装。
        ・根拠: Gakusapo 中核原則「HEAD＝育成可能層は採用ゲートにしない」。従来の
          classifyItem は Tier を問わず全項目を hygiene/fit に分類しており、Tier 2
          項目が「全職種必須のゲート」になりうる原則矛盾があった。
        ・classifyItem に isDevelopmental（第5引数）を追加。Tier 2/3 は
          hygiene/fit/soft_fit/profile の判定を行わず、dev_high / dev_mid /
          dev_low（育成優先度 高/中/低）に分類する。
        ・【修正版の要点】育成優先度は「対象グループ合意率の絶対値」のみで判定し、
          比較(diff)は使わない。Fit は比較概念だが育成優先度は絶対概念のため。
          閾値は採用ゲートと別の定数 DEV_PRIORITY_HIGH/MID として独立定義（暗黙
          継承の回避）。
        ・checkHygieneAcrossGroups は tier>1 を判定対象外（false）に。
        ・aggregatePersona は item に isDevelopmental を出力。育成層の
          hygieneBandMarker は常に false。
        ・applyManualOverride の有効分類に dev_* を追加。個別企業の例外（特定の
          育成項目を選考要件に格上げ）は従来どおり Mode(b) で fit へ手動上書き。
        ・admin: 分類サマリ・上書きパネルが dev_* を扱えるよう対応（下記 D-8）。

   D-8  admin の表示系を dev_* 分類に対応（このファイル固有の修正）。
        ・classificationCounts に dev_high/mid/low キーを追加。未追加だと dev_*
          項目が else 分岐で「未分類」に誤計上される不具合があった。
        ・集計結果サマリ／ペルソナ一覧に「育成テーマ」(dev_* 合計) を追加。
        ・Mode(b) 上書きパネル: 育成層の項目に育成優先度(dev_*)の選択肢を表示。
          未対応だと select の現在値が候補に無く、適用時に先頭(HYGIENE)へ
          誤って化ける不具合があった。§2-4 の逃げ道として採用ゲートも併置。
   ============================================================================ */

/* ----------------------------------------------------------------------------
   設定定数
---------------------------------------------------------------------------- */
const PRISM_CONFIG = {
  IMPORTANT_THRESHOLD: 5,      // strength >= 5 を「重要」とみなす
  HYGIENE_RATE: 70,            // Hygiene/Fit の合意率閾値 (%)
  FIT_OTHERS_MAX: 50,          // Fit判定: 他グループ合意率の上限 (%)
  SOFT_FIT_DIFF: 25,           // Soft Fit判定: 差分の下限 (pt)
  DIFF_MARKER_LOW: 15,         // 差分マーカー: low/none の境界 (pt)
  DIFF_MARKER_HIGH: 25,        // 差分マーカー: none/high の境界 (pt)
  TYPE_DOMINANT_RATE: 60,      // タイプ優勢判定の閾値 (%)
  MIN_GROUP_N: 3,              // [B-5] これ未満のグループは Hygiene 横断判定から除外

  /* [D-7 / B案修正版] Tier 2/3（HEAD・MGMT＝育成可能層）の「育成優先度」判定閾値。
     採用ゲートの閾値（HYGIENE_RATE / FIT_OTHERS_MAX / SOFT_FIT_DIFF）とは
     目的が異なるため、数値が同じでも別の定数として独立に定義する（暗黙の継承を避ける）。
     育成優先度は「対象グループ合意率の絶対値」だけで判定し、比較(diff)は使わない。
     ── Fit は比較概念（他職種と違うから適合）。育成優先度は絶対概念
        （その職務が単独でその力をどれだけ必要とするか）。 */
  DEV_PRIORITY_HIGH: 70,       // 対象グループ合意率 >= これ → 育成優先度「高」
  DEV_PRIORITY_MID: 50,        // 対象グループ合意率 >= これ → 育成優先度「中」（未満は「低」）

  /* [v21 / STEP3-i 同点タイブレーク] 問診STEP1で強度が同点になった項目群が
     この人数以上のとき、STEP3-i で順位タスクを発火させる。3問同点は係数効果が
     構造上ゼロ（順位1〜3が全て係数1.0）のため対象外＝4以上で発火、と確定済み
     （引き継ぎシート v21 §2）。係数の帯は tiebreakCoefficient() を参照。 */
  TIEBREAK_MIN_GROUP: 4,
};

/* G3「動機方向性」5ドライバー定義（引き継ぎシート v6 付録A・B案） */
const G3_DRIVERS = [
  { id: 'seika',  label: '成果', desc: 'やり遂げた手応え・数字が出る' },
  { id: 'nakama', label: '仲間', desc: '信頼できる仲間と働く' },
  { id: 'sairyo', label: '裁量', desc: '自分で決めて動ける' },
  { id: 'hyoka',  label: '評価', desc: '認められ、処遇に反映される' },
  { id: 'anshin', label: '安心', desc: '生活と立場が安定している' },
];

/* Tier 1 の19項目定義（カテゴリ順 / 種別フラグ付き）
   - intensityOnly: 強度のみ項目（方向ステップなし）
   - ranking:       順位づけ項目（G3のみ。合意率は定義されない → 'profile'）
   ※ tier フィールドは将来 Tier 2/3 追加時の項目ゲーティング用（B-2）。
     現状は全項目 tier:1。混在Tier集計は「項目別の有効回答分母」で吸収する。 */
const TIER1_ITEMS = [
  { id: 'H1', name: '仕事観',     category: 'HEART', tier: 1, labelA: '貢献型',     labelB: '探究型',     intensityOnly: false },
  { id: 'H2', name: '倫理・誠実性', category: 'HEART', tier: 1, labelA: '規範型',     labelB: '良心型',     intensityOnly: false },
  { id: 'H3', name: '他者・組織',  category: 'HEART', tier: 1, labelA: '共生型',     labelB: '触発型',     intensityOnly: false },
  { id: 'H4', name: 'ユーモア',    category: 'HEART', tier: 1, labelA: '親和型',     labelB: '着想型',     intensityOnly: false },
  { id: 'H5', name: '自己開示',    category: 'HEART', tier: 1, labelA: '共有型',     labelB: '表明型',     intensityOnly: false },
  { id: 'G1', name: '自律動機',    category: 'GUT',   tier: 1, labelA: null,        labelB: null,        intensityOnly: true  },
  { id: 'G2', name: '知的好奇心',  category: 'GUT',   tier: 1, labelA: '広域型',     labelB: '深堀型',     intensityOnly: false },
  { id: 'G3', name: '動機方向性',  category: 'GUT',   tier: 1, labelA: null,        labelB: null,        intensityOnly: false, ranking: true, drivers: G3_DRIVERS },
  { id: 'C1', name: '内省的学習',  category: 'CORE',  tier: 1, labelA: '体験型',     labelB: '概念型',     intensityOnly: false },

/* ----------------------------------------------------------------------------
   有効回答の判定  [B-1 / B-2 の中核]
   「正常な回答（not_asked 含む）」と「欠損・異常データ」を区別する。

   - 通常/強度項目: answers[id] が存在し strength が 1〜7 の数値なら有効。
     strength<=4 の not_asked は "正常にスキップされた有効回答" として扱う
     （重要でない票としてカウント対象。分母からは除外しない）。
   - 順位項目(G3): ranking が長さ5の配列なら有効。
   - null / undefined / 型不正 / 範囲外 は無効 → 分母から除外。
---------------------------------------------------------------------------- */
function hasValidAnswer(ans, item) {
  if (!ans) return false;
  if (item.ranking) {
    return Array.isArray(ans.ranking) && ans.ranking.length === 5;
  }
  const s = ans.strength;
  return typeof s === 'number' && Number.isFinite(s) && s >= 1 && s <= 7;
}

/* その項目を有効回答したメンバーだけを返す */
function validAnswerers(members, item) {
  return members.filter(r => hasValidAnswer(r.answers ? r.answers[item.id] : null, item));
}

/* ----------------------------------------------------------------------------
   実効強度（STEP3-i 同点タイブレークの集計反映）   [v21 新設]
   実効強度 = 強度 × 係数（tiebreakCoefficient）。係数は順位帯で決まる：
   順位 1〜3 = 1.0 ／ 4〜6 = 0.9 ／ 7位以降 = 0.8。tiebreakRank を持たない回答は
   係数 1.0 → 実効強度＝強度（後方互換）。集計は実効強度を用いる。
   ※ prism-aggregation-logic-v6.js と同一実装（同梱コピー）。
---------------------------------------------------------------------------- */
function tiebreakCoefficient(rank) {
  if (typeof rank !== 'number' || !Number.isFinite(rank) || rank < 1) return 1.0;
  if (rank <= 3) return 1.0;
  if (rank <= 6) return 0.9;
  return 0.8;
}

/* answers[id] 1件分の実効強度。strength が無効なら null。 */
function effectiveStrength(ans) {
  if (!ans) return null;
  const s = ans.strength;
  if (typeof s !== 'number' || !Number.isFinite(s) || s < 1 || s > 7) return null;
  return s * tiebreakCoefficient(ans.tiebreakRank);
}

/* ----------------------------------------------------------------------------
   グループ解決
   職種/役職/全社員/任意グループ/他グループ(others) のどれでも
   「回答者の配列」に解決する。比較ロジックを1本化するための抽象化。

   groupSpec の形:
     { type: 'all' }
     { type: 'jobType', value: '営業' }
     { type: 'rank',    value: '主任' }
     { type: 'custom',  value: 'grp_custom_01' }
     { type: 'others',  value: null }   ← targetGroup の補集合
---------------------------------------------------------------------------- */
function resolveGroupMembers(groupSpec, rawResponses, companyConfig, targetGroup) {
  switch (groupSpec.type) {
    case 'all':
      return rawResponses.slice();

    case 'jobType':
      return rawResponses.filter(r => r.jobType === groupSpec.value);

    case 'rank':
      return rawResponses.filter(r => r.rank === groupSpec.value);

    case 'custom': {
      const grp = (companyConfig.customGroups || []).find(g => g.groupId === groupSpec.value);
      if (!grp) return [];
      return rawResponses.filter(r => grp.memberIds.includes(r.respondentId));
    }

    case 'others': {
      // targetGroup の補集合（targetに含まれない回答者全員）
      const targetMembers = resolveGroupMembers(targetGroup, rawResponses, companyConfig, null);
      const targetIds = new Set(targetMembers.map(r => r.respondentId));
      return rawResponses.filter(r => !targetIds.has(r.respondentId));
    }

    default:
      return [];
  }
}

/* ----------------------------------------------------------------------------
   合意率の算出   [B-1 / B-2 修正済み]
   「重要(strength>=5)」と答えた人の割合。direction は使わない。

   分母 = その項目を有効回答した人数（欠損/null は除外）。
   有効回答が1件も無ければ null（「データなし」。0%とは区別する）。
   順位項目(G3)には合意率が定義できないため null を返す。
---------------------------------------------------------------------------- */
function calcConsensusRate(members, item) {
  const valid = validAnswerers(members, item);
  if (valid.length === 0) return null;      // 有効回答ゼロ → 算出不能
  if (item.ranking) {
    // [D-1] 順位項目(G3)も強度をヒアリングする。強度を持つ回答だけを母数に合意率を
    // 算出する。強度なしの旧データのみなら null（従来どおり「合意率なし」扱い）。
    const withS = valid.filter(r => {
      const s = r.answers[item.id].strength;
      return typeof s === 'number' && Number.isFinite(s) && s >= 1 && s <= 7;
    });
    if (withS.length === 0) return null;
    const imp = withS.filter(
      r => effectiveStrength(r.answers[item.id]) >= PRISM_CONFIG.IMPORTANT_THRESHOLD
    ).length;
    return Math.round((imp / withS.length) * 100);
  }
  const importantCount = valid.filter(
    r => effectiveStrength(r.answers[item.id]) >= PRISM_CONFIG.IMPORTANT_THRESHOLD
  ).length;
  return Math.round((importantCount / valid.length) * 100);
}

/* ----------------------------------------------------------------------------
   平均強度の算出（5-7）   [C-2 修正済み]
   「重要と思っている度合いの強さ」を表す指標。
   → 重要(strength>=5)と答えた人だけの平均。not_asked(<=4) は分子に含めない。
   重要回答が1件も無ければ null。
---------------------------------------------------------------------------- */
function calcAvgStrength(members, item) {
  // [D-1] 順位項目(G3)も強度を持つため、ここでは ranking を除外しない。
  const strengths = validAnswerers(members, item)
    .map(r => effectiveStrength(r.answers[item.id]))
    .filter(s => typeof s === 'number' && s >= PRISM_CONFIG.IMPORTANT_THRESHOLD);
  if (strengths.length === 0) return null;
  const sum = strengths.reduce((a, b) => a + b, 0);
  return Math.round((sum / strengths.length) * 10) / 10;
}

/* ----------------------------------------------------------------------------
   タイプ分布の算出   [タイプA設計: 強度加重]
   binary項目は全回答者から方向(A/B/neutral)を採取し、各票を strength で加重した
   シェアを返す（not_asked 廃止）。strength は「その項目を重視する度合い＝回答者の
   関与度」の重みであり、方向の選好強度そのものではない点に注意。
   合意率(consensus)は別途 strength>=5 で算出し、本関数とは独立。
   順位項目(G3)は calcRankingDistribution を使うため、ここでは null を返す。
---------------------------------------------------------------------------- */
function calcTypeDistribution(members, item) {
  if (item.ranking) return null;            // 順位項目はタイプ分布の対象外

  // 強度のみ項目は強度3段階分布を返す
  if (item.intensityOnly) {
    const counts = { high: 0, mid: 0, low: 0 };
    members.forEach(r => {
      const s = r.answers ? effectiveStrength(r.answers[item.id]) : null;
      if (typeof s !== 'number') return;
      if (s >= 6) counts.high++;
      else if (s >= 4) counts.mid++;
      else counts.low++;
    });
    const total = counts.high + counts.mid + counts.low || 1;
    return {
      isIntensityOnly: true,
      respondedCount: counts.high + counts.mid + counts.low,
      high: Math.round((counts.high / total) * 100),
      mid:  Math.round((counts.mid / total) * 100),
      low:  Math.round((counts.low / total) * 100),
      dominant: counts.high / total >= 0.6 ? 'high' : null,
    };
  }

  // 通常(binary)項目: A / B / neutral の強度加重シェア
  // 各回答者の方向票を strength で加重。旧 not_asked 等の無効方向は除外。
  const w = { A: 0, B: 0, neutral: 0 };
  let respondedCount = 0;
  members.forEach(r => {
    const ans = r.answers ? r.answers[item.id] : null;
    if (!ans) return;
    const s = effectiveStrength(ans), dir = ans.direction;
    if (typeof s !== 'number') return;
    if (dir !== 'A' && dir !== 'B' && dir !== 'neutral') return;
    w[dir] += s;
    respondedCount++;
  });
  const totalW = w.A + w.B + w.neutral || 1;
  const a = Math.round((w.A / totalW) * 100);
  const b = Math.round((w.B / totalW) * 100);
  const neutral = Math.round((w.neutral / totalW) * 100);

  let dominant = null;
  if (a >= PRISM_CONFIG.TYPE_DOMINANT_RATE) dominant = 'a';
  else if (b >= PRISM_CONFIG.TYPE_DOMINANT_RATE) dominant = 'b';

  return {
    isIntensityOnly: false,
    weighted: true,
    respondedCount,
    labelA: item.labelA, labelB: item.labelB,
    a, neutral, b, dominant,
  };
}

/* ----------------------------------------------------------------------------
   順位分布の算出（G3 ─ Borda スコア）   [B-3 新設]
   各回答者の順位（1位〜5位）を Borda 点（1位=5点 … 5位=1点）に換算し集計。

   出力:
     share = グループ平均 Borda 点を 0-100 に正規化（score / (n × 5) × 100）。
             全員1位 → 100、全員5位 → 20。詳細セクションの profile-share に対応。
   重複ID・未知ID・要素数不正のランキングは無効としてスキップ（B-1と同方針）。
---------------------------------------------------------------------------- */
function calcRankingDistribution(members, item) {
  if (!item.ranking) return null;
  const drivers = item.drivers || G3_DRIVERS;
  const driverIds = drivers.map(d => d.id);
  const scores = {};
  driverIds.forEach(id => { scores[id] = 0; });

  let n = 0;
  let totalWeight = 0;
  members.forEach(r => {
    const ans = r.answers ? r.answers[item.id] : null;
    if (!hasValidAnswer(ans, item)) return;
    // ランキングの中身を検証: 過不足なく全ドライバーが1回ずつ
    const seen = new Set(ans.ranking);
    if (seen.size !== drivers.length) return;
    if (!ans.ranking.every(id => id in scores)) return;
    // [D-1] 強度加重（タイプA設計と同じ関与度加重）。動機を重視する＝よく考えて
    // いる回答者ほど順位の意見を重く扱う。[v21] 加重は実効強度（STEP3-i 反映）。
    // 強度がなければ重み1（後方互換）。
    const es = effectiveStrength(ans);
    const w = (typeof es === 'number') ? es : 1;
    n++;
    totalWeight += w;
    ans.ranking.forEach((id, idx) => {
      scores[id] += (drivers.length - idx) * w;  // idx0(1位)=5点 … idx4(5位)=1点 ×重み
    });
  });

  const maxPerRespondent = drivers.length;   // 1位の点数 = 5（重み1あたり）
  const ranked = drivers
    .map(d => {
      const raw = scores[d.id];
      // 加重後シェア: 全員1位 → 100、全員5位 → 20（重みで正規化）
      const share = totalWeight > 0
        ? Math.round((raw / (totalWeight * maxPerRespondent)) * 100) : 0;
      return { driverId: d.id, label: d.label, desc: d.desc, bordaScore: raw, share };
    })
    .sort((x, y) => y.bordaScore - x.bordaScore)
    .map((d, i) => ({ ...d, rank: i + 1 }));

  return {
    isRanking: true,
    weighted: true,
    respondedCount: n,
    drivers: ranked,
    topDriver: ranked.length ? { driverId: ranked[0].driverId, label: ranked[0].label } : null,
  };
}

/* ----------------------------------------------------------------------------
   分類判定（Hygiene / Fit / Soft Fit / Profile / 育成優先度 / Unclassified）
   設計書 3-2 のロジック。

   isRanking       : 順位項目なら true → 常に 'profile'（閾値分類の対象外）
   hygieneCheck    : 全グループ横断の合意率チェック結果（boolean）
   targetRate / othersRate : 選択中の比較ペアの合意率（null = データなし）
   isDevelopmental : Tier 2/3（HEAD・MGMT＝育成可能層）なら true

   [D-7 / B案修正版] Tier 2/3 は採用ゲート（hygiene/fit/soft_fit）に一切入れない。
   Gakusapo 中核原則「HEAD＝育成可能層は採用ゲートにしない」と整合させるための分岐。
   育成層は「対象グループ合意率の絶対値」だけで育成優先度（dev_high/mid/low）を判定し、
   比較(diff)は使わない。個別企業が特定の育成項目を選考要件に格上げしたい場合は、
   Mode(b) の applyManualOverride() で fit 等へ手動上書きする（既定ルールは原則どおり）。
---------------------------------------------------------------------------- */
function classifyItem(hygieneCheck, targetRate, othersRate, isRanking, isDevelopmental) {
  // 順位項目は記述専用。閾値分類しない。
  if (isRanking) return 'profile';

  // [D-7] Tier 2/3（育成可能層）── 採用ゲート判定を行わず、育成優先度に分類。
  //       対象グループ合意率の絶対値のみで判定（hygiene 横断・diff は不使用）。
  if (isDevelopmental) {
    if (targetRate == null) return 'unclassified';   // データ不足
    if (targetRate >= PRISM_CONFIG.DEV_PRIORITY_HIGH) return 'dev_high';
    if (targetRate >= PRISM_CONFIG.DEV_PRIORITY_MID)  return 'dev_mid';
    return 'dev_low';
  }

  // ── 以下 Tier 1（中核層）のみ。採用合否をゲートする閾値分類 ──

  // STEP 1: Hygiene（最優先）
  if (hygieneCheck) return 'hygiene';

  // データ不足なら分類不能
  if (targetRate == null || othersRate == null) return 'unclassified';

  // STEP 2: Fit
  if (targetRate >= PRISM_CONFIG.HYGIENE_RATE &&
      othersRate <= PRISM_CONFIG.FIT_OTHERS_MAX) {
    return 'fit';
  }

  // STEP 3: Soft Fit
  const diff = targetRate - othersRate;
  if (diff >= PRISM_CONFIG.SOFT_FIT_DIFF) {
    return 'soft_fit';
  }

  // STEP 4: 未分類
  return 'unclassified';
}

/* ----------------------------------------------------------------------------
   Hygiene 横断チェック   [B-5 修正済み]
   全職種・全役職グループそれぞれで合意率 >= 70% かどうか。
   比較ペアの選択と無関係。

   - MIN_GROUP_N 未満の小グループは判定から除外（少人数が全社判定を覆す問題）。
   - 有効回答ゼロのグループも除外。
   - 判定に使えるグループが1つも無ければ Hygiene 不成立（false）。
---------------------------------------------------------------------------- */
function checkHygieneAcrossGroups(item, rawResponses, companyConfig) {
  if (item.ranking) return false;           // 順位項目に Hygiene 判定は無い
  if ((item.tier || 1) > 1) return false;   // [D-7] Tier 2/3（育成層）は採用ゲート対象外
  const allGroups = [
    ...companyConfig.jobTypes.map(v => ({ type: 'jobType', value: v })),
    ...companyConfig.ranks.map(v => ({ type: 'rank', value: v })),
  ];
  let qualified = 0;
  const passed = allGroups.every(spec => {
    const members = resolveGroupMembers(spec, rawResponses, companyConfig, null);
    if (members.length < PRISM_CONFIG.MIN_GROUP_N) return true;  // 小グループは除外
    const rate = calcConsensusRate(members, item);
    if (rate == null) return true;          // 有効回答ゼロは除外
    qualified++;
    return rate >= PRISM_CONFIG.HYGIENE_RATE;
  });
  return qualified > 0 && passed;           // 評価対象ゼロなら不成立
}

/* ----------------------------------------------------------------------------
   差分マーカー判定（俯瞰ビュー用）   [B-4 修正済み]
   符号対応。負の大差（他グループが重視）は 'high_reverse'。

   diff == null            → 'na'           （データなし／順位項目）
   |diff| <  15pt          → 'low'          （青マーカー・差分小）
   15pt <= |diff| < 25pt   → 'none'         （マーカーなし）
   diff >=  25pt           → 'high'         （橙・対象グループが重視）
   diff <= -25pt           → 'high_reverse' （ティール・他グループが重視）
---------------------------------------------------------------------------- */
function getDiffMarker(diff) {
  if (diff == null) return 'na';
  const abs = Math.abs(diff);
  if (abs < PRISM_CONFIG.DIFF_MARKER_LOW)  return 'low';
  if (abs < PRISM_CONFIG.DIFF_MARKER_HIGH) return 'none';
  return diff > 0 ? 'high' : 'high_reverse';
}

/* ----------------------------------------------------------------------------
   分類理由の自動生成   [C-5 修正済み: mode 対応]
---------------------------------------------------------------------------- */
function generateReason(classification, item, rates, diff, mode) {
  const { target, others } = rates;
  switch (classification) {
    case 'hygiene':
      return `全職種・全役職で合意率70%以上。役職を問わず重視される文化基盤。`;
    case 'fit':
      return `対象グループ ${target}%↑ かつ 他グループ ${others}%↓ でFit基準を満たす。差分+${diff}pt。`;
    case 'soft_fit':
      return mode === 'b'
        ? `差分+${diff}ptは大きいが、対象グループの合意率が${target}%でFit基準(70%)に未達。代表者判断で要否を決定。`
        : `差分+${diff}ptは大きいが、対象グループの合意率が${target}%でFit基準(70%)に未達。Soft Fitとして記録（現状追認）。`;
    case 'dev_high':
      return `対象グループ合意率 ${target}%。この職務が強く必要とする育成可能領域。`
        + `入社後の重点育成テーマ（育成優先度:高）。HEAD/SKILL層の育成計画で扱い、採用合否はゲートしない。`;
    case 'dev_mid':
      return `対象グループ合意率 ${target}%。職務上の必要性が一定程度ある育成可能領域。`
        + `入社後の育成テーマ（育成優先度:中）。採用合否はゲートしない。`;
    case 'dev_low':
      return `対象グループ合意率 ${target != null ? target + '%' : 'データ取得待ち'}。`
        + `現時点で職務上の必要度は低い育成可能領域（育成優先度:低）。採用合否はゲートしない。`;
    case 'profile': {
      const impTxt = (target != null && others != null)
        ? `動機の重要度は 対象${target}%／他${others}%。`
        : '動機の重要度データは取得待ち。';
      return `${impTxt}5動機ドライバーの順位は強度加重の記述プロファイル。ランキング項目のため Hygiene/Fit の閾値分類は対象外。`;
    }
    case 'unclassified':
      if (target == null || others == null) {
        return `有効回答が不足しており分類不能。回答状況を確認すること。`;
      }
      return `Hygiene基準(70%)未達。差分${diff >= 0 ? '+' : ''}${diff}ptでFit/Soft Fitに該当せず。`;
    default:
      return '';
  }
}

/* ----------------------------------------------------------------------------
   personaId 生成   [C-3 修正済み]
   Date.now() 単独だとバッチ実行でミリ秒衝突。連番＋乱数で一意性を担保。
---------------------------------------------------------------------------- */
let _personaSeq = 0;
function nextPersonaId() {
  _personaSeq += 1;
  const rand = Math.random().toString(36).slice(2, 6);
  return `persona_${Date.now().toString(36)}_${_personaSeq.toString(36)}${rand}`;
}

/* ----------------------------------------------------------------------------
   [D-5] 出題対象の項目を解決する
   Tier 1 は常に必須。Tier 2/3 は人事が項目単位で取捨選択する（enabledItems）。
   後方互換: 旧 questionnaireTier（累積1〜3）しか無い設定はそこから導出する。
---------------------------------------------------------------------------- */
function resolveEnabledItems(companyConfig) {
  const c = companyConfig || {};
  if (Array.isArray(c.enabledItems)) return c.enabledItems.slice();
  // 旧 questionnaireTier からの移行
  const t = Number(c.questionnaireTier);
  if (Number.isFinite(t) && t > 1) {
    return TIER1_ITEMS
      .filter(it => (it.tier || 1) > 1 && (it.tier || 1) <= t)
      .map(it => it.id);
  }
  return [];
}
function isItemActive(item, enabledItems) {
  return (item.tier || 1) === 1 || enabledItems.indexOf(item.id) !== -1;
}

/* ----------------------------------------------------------------------------
   グループ規模の一覧（dataQuality 用 / B-5 の可視化）
---------------------------------------------------------------------------- */
function listGroupSizes(rawResponses, companyConfig) {
  const specs = [
    ...companyConfig.jobTypes.map(v => ({ type: 'jobType', value: v })),
    ...companyConfig.ranks.map(v => ({ type: 'rank', value: v })),
  ];
  return specs.map(spec => ({
    type: spec.type,
    value: spec.value,
    n: resolveGroupMembers(spec, rawResponses, companyConfig, null).length,
  }));
}

/* ----------------------------------------------------------------------------
   メイン: 集計実行（案Y ─ 1回実行して personaResult を生成）
---------------------------------------------------------------------------- */
function aggregatePersona(params) {
  const {
    rawResponses,      // 生回答データの配列
    companyConfig,     // 企業設定
    personaName,       // ペルソナ名
    targetGroup,       // 対象グループ spec  例: {type:'jobType', value:'営業'}
    compareGroup,      // 比較グループ spec  例: {type:'others', value:null}
    mode = 'a',        // 'a' or 'b'
  } = params;

  // グループ解決
  const targetMembers  = resolveGroupMembers(targetGroup,  rawResponses, companyConfig, targetGroup);
  const compareMembers = resolveGroupMembers(compareGroup, rawResponses, companyConfig, targetGroup);
  const allMembers     = rawResponses;

  // データ品質情報（B-5: 小グループの可視化）
  const groupSizes = listGroupSizes(rawResponses, companyConfig);
  const smallGroups = groupSizes.filter(
    g => g.n > 0 && g.n < PRISM_CONFIG.MIN_GROUP_N
  );

  // 項目ごとに集計
  // [D-5] Tier 1 は常に必須。Tier 2/3 は人事が選んだ項目(enabledItems)のみ対象。
  const enabledItems = resolveEnabledItems(companyConfig);
  const activeItems = TIER1_ITEMS.filter(it => isItemActive(it, enabledItems));
  const items = activeItems.map(item => {
    /* ── 順位項目(G3): 強度ヒアリング対応 [D-1] ─────────────────── */
    if (item.ranking) {
      const rankingDist = calcRankingDistribution(targetMembers, item);
      // G3 も重要度(strength)をヒアリングするため、合意率・差分・平均強度を算出。
      // ただし5択ランキングのため閾値分類はせず classification は 'profile' 固定。
      const rRateAll    = calcConsensusRate(allMembers,     item);
      const rRateTarget = calcConsensusRate(targetMembers,  item);
      const rRateOthers = calcConsensusRate(compareMembers, item);
      const rDiff = (rRateTarget != null && rRateOthers != null)
        ? rRateTarget - rRateOthers : null;
      return {
        itemId: item.id,
        itemName: item.name,
        category: item.category,
        isRanking: true,
        isDevelopmental: false,   // [D-7] 順位項目(G3)は Tier 1。育成層ではない。
        consensus: { all: rRateAll, target: rRateTarget, others: rRateOthers },
        diff: rDiff,
        diffMarker: getDiffMarker(rDiff),
        hygieneBandMarker: (
          rRateTarget != null && rRateOthers != null &&
          rRateTarget >= PRISM_CONFIG.HYGIENE_RATE &&
          rRateOthers >= PRISM_CONFIG.HYGIENE_RATE
        ),
        classification: 'profile',
        avgStrength: calcAvgStrength(targetMembers, item),
        respondedCount: rankingDist ? rankingDist.respondedCount : 0,
        typeDistribution: null,
        rankingDistribution: rankingDist,
        // 比較グループの順位分布（詳細セクションの「他役職比較」ブロック用・参考値）
        rankingDistributionCompare: calcRankingDistribution(compareMembers, item),
        reason: generateReason('profile', item,
          { target: rRateTarget, others: rRateOthers }, rDiff, mode),
        manualOverride: false,
        overrideHistory: [],
      };
    }

    /* ── 通常/強度項目 ───────────────────────────────────────────── */
    const rateAll    = calcConsensusRate(allMembers,     item);
    const rateTarget = calcConsensusRate(targetMembers,  item);
    const rateOthers = calcConsensusRate(compareMembers, item);
    const diff = (rateTarget != null && rateOthers != null)
      ? rateTarget - rateOthers
      : null;

    const hygieneCheck = checkHygieneAcrossGroups(item, rawResponses, companyConfig);
    // [D-7] Tier 2/3（HEAD・MGMT）は育成可能層 → 採用ゲートに入れず育成優先度で分類。
    const isDevelopmental = (item.tier || 1) > 1;
    const classification = classifyItem(
      hygieneCheck, rateTarget, rateOthers, false, isDevelopmental
    );

    return {
      itemId: item.id,
      itemName: item.name,
      category: item.category,
      isRanking: false,
      isDevelopmental,                        // [D-7] 結果画面の育成テーマ枠の振り分け用
      consensus: { all: rateAll, target: rateTarget, others: rateOthers },
      diff,
      diffMarker: getDiffMarker(diff),
      // [C-1] ハードコード 70 を撤廃。null は false 扱い。
      // [D-7] 育成層に Hygiene帯（採用ゲートの視覚補助）は無い。常に false。
      hygieneBandMarker: (
        !isDevelopmental &&
        rateTarget != null && rateOthers != null &&
        rateTarget >= PRISM_CONFIG.HYGIENE_RATE &&
        rateOthers >= PRISM_CONFIG.HYGIENE_RATE
      ),
      classification,
      avgStrength: calcAvgStrength(targetMembers, item),
      respondedCount: validAnswerers(targetMembers, item).length,
      typeDistribution: calcTypeDistribution(targetMembers, item),
      rankingDistribution: null,
      reason: generateReason(
        classification, item, { target: rateTarget, others: rateOthers }, diff, mode
      ),
      manualOverride: false,   // Mode(b)で代表者が上書きした場合 true
      overrideHistory: [],     // [C-4] 上書きの監査証跡
    };
  });

  return {
    personaId: nextPersonaId(),     // [C-3]
    companyId: companyConfig.companyId,
    personaName,
    targetGroup,
    compareGroup,
    mode,
    calculatedAt: new Date().toISOString(),
    sampleSizes: {
      all: allMembers.length,
      target: targetMembers.length,
      others: compareMembers.length,
    },
    dataQuality: {                  // [B-5]
      minGroupN: PRISM_CONFIG.MIN_GROUP_N,
      groupSizes,
      // MIN_GROUP_N 未満。Hygiene 横断判定から除外されている。
      smallGroupsExcludedFromHygiene: smallGroups,
    },
    items,
  };
}

/* ----------------------------------------------------------------------------
   Mode(b) 分類の手動上書き   [C-4 新設]
   代表者が分類を上書きする際は必ずこの関数を通す。
   overrideHistory に「変更前値・変更後値・変更者・理由・日時」を記録する。

   使用例:
     applyManualOverride(persona, 'D1', 'fit',
       { actor: 'hr_tanaka', reason: '次期戦略上、認知力を採用要件に格上げ' });
---------------------------------------------------------------------------- */
function applyManualOverride(persona, itemId, newClassification, meta = {}) {
  if (persona.mode !== 'b') {
    throw new Error('manualOverride は Mode(b) でのみ許可されます。');
  }
  const item = persona.items.find(i => i.itemId === itemId);
  if (!item) throw new Error('itemId が見つかりません: ' + itemId);

  // 有効分類: 採用ゲート(hygiene/fit/soft_fit) ＋ profile ＋ 育成優先度(dev_*) ＋ 未分類。
  // [D-7] dev_* を含めることで (1) 育成層の現在値が有効、(2) Mode(b)で代表者が
  //       特定の育成項目を fit 等の選考要件へ格上げする §2-4 の逃げ道を維持。
  const VALID = ['hygiene', 'fit', 'soft_fit', 'profile', 'unclassified',
                 'dev_high', 'dev_mid', 'dev_low'];
  if (!VALID.includes(newClassification)) {
    throw new Error('不正な classification: ' + newClassification);
  }
  if (!Array.isArray(item.overrideHistory)) item.overrideHistory = [];

  item.overrideHistory.push({
    from: item.classification,
    to: newClassification,
    actor: meta.actor || 'unknown',
    reason: meta.reason || '',
    at: new Date().toISOString(),
  });
  item.classification = newClassification;
  item.manualOverride = true;
  // 表示用の理由も上書きし、分類と矛盾しないようにする
  item.reason = '代表者判断により分類を変更（' + (meta.reason || '理由未記入') + '）';
  return item;
}

/* ----------------------------------------------------------------------------
   localStorage 保存/読み込み（プロトタイプ用）
---------------------------------------------------------------------------- */
const PrismStorage = {
  saveCompanyConfig(config) {
    localStorage.setItem('prism_company_config', JSON.stringify(config));
  },
  loadCompanyConfig() {
    const raw = localStorage.getItem('prism_company_config');
    return raw ? JSON.parse(raw) : null;
  },
  saveRawResponse(response) {
    const list = this.loadRawResponses();
    // 同一 respondentId は上書き
    const idx = list.findIndex(r => r.respondentId === response.respondentId);
    if (idx >= 0) list[idx] = response;
    else list.push(response);
    localStorage.setItem('prism_raw_responses', JSON.stringify(list));
  },
  loadRawResponses() {
    const raw = localStorage.getItem('prism_raw_responses');
    return raw ? JSON.parse(raw) : [];
  },
  savePersonaResult(persona) {
    const list = this.loadPersonaResults();
    list.push(persona);
    localStorage.setItem('prism_persona_results', JSON.stringify(list));
  },
  loadPersonaResults() {
    const raw = localStorage.getItem('prism_persona_results');
    return raw ? JSON.parse(raw) : [];
  },
};

if (typeof module !== 'undefined' && module.exports) {

  function renderCustomGroup(g, gi) {
    let memberHtml;
    if (S.responses.length === 0) {
      memberHtml = `<div class="cg-empty">回答者がまだいません。問診回答後（または「回答状況」タブでデモデータ生成後）にメンバーを指定できます。</div>`;
    } else {
      memberHtml = `<div class="cg-members">` + S.responses.map(r => {

        return `<label class="cg-mem">

  /* [D-5] 問診項目の選択 ─ Tier 1 必須／Tier 2,3 は人事が項目単位で取捨選択 */
  function renderTierScope(c) {
    const enabled = c.enabledItems || [];
    const tierGroup = (n, label, desc) => {
      const items = TIER1_ITEMS.filter(it => (it.tier || 1) === n);
      const selCount = items.filter(it => enabled.indexOf(it.id) !== -1).length;
      const open = !!(S.tierOpen && S.tierOpen[n]);
      const rows = items.map(it => {
        const on = enabled.indexOf(it.id) !== -1;
        return `
          <label class="iscope-item ${on ? 'on' : ''}">
            <input type="checkbox" data-act="item-toggle" data-arg="${it.id}" ${on ? 'checked' : ''}>
            <span class="iscope-iid">${it.id}</span>
            <span class="iscope-iname">${esc(it.name)}</span>
          </label>`;
      }).join('');
      return `
        <div class="iscope-group">
          <div class="iscope-ghead iscope-toggle" data-act="tier-toggle" data-arg="${n}"
               role="button" aria-expanded="${open ? 'true' : 'false'}">
            <div>
              <div class="iscope-glabel">${label}
                <span class="iscope-gcount">${selCount} / ${items.length} 選択</span></div>
              <div class="iscope-gdesc">${desc}</div>
            </div>
            <div class="iscope-head-right">
              <div class="iscope-bulk">
                <button type="button" data-act="tier-all" data-arg="${n}">全選択</button>
                <button type="button" data-act="tier-none" data-arg="${n}">全解除</button>
              </div>
              <svg class="iscope-chev ${open ? 'open' : ''}" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          ${open ? `<div class="iscope-items">${rows}</div>` : ''}
        </div>`;
    };
    const total = 19 + enabled.length;
    return `
      <div class="iscope">
        <div class="iscope-fixed">
          <strong>Tier 1 ─ 中核19項目</strong>は全回答者に必須で出題されます（選択不可）。
        </div>
        ${tierGroup(2, 'Tier 2 ─ Harder層（育成可能）',
          '見出しをタップで開閉。必要な項目だけにチェックを入れて全員の問診に追加します。')}
        ${tierGroup(3, 'Tier 3 ─ 管理職向け',
          '見出しをタップで開閉。必要な項目だけにチェックを入れて全員の問診に追加します。')}
        <div class="iscope-note">
          現在の問診ボリューム：<strong>中核19問 ＋ 選択 ${enabled.length}問 ＝ 全 ${total}問</strong>
        </div>
      </div>`;
  }

    const idEl = document.getElementById('cfg-id');
    if (nameEl) S.cfg.companyName = nameEl.value.trim() || S.cfg.companyName;

    document.querySelectorAll('[data-cg-name]').forEach(el => {

  /* [変更] カスタムグループ編集の自動保存（companyConfig を localStorage へ書込→
     親シェルの storage リスナが同期する。iframe からは親関数を呼ばない。） */
  function persistCfg() {
    try {
      PrismStorage.saveCompanyConfig({
        companyId: S.cfg.companyId,
        companyName: S.cfg.companyName,
        jobTypes: S.cfg.jobTypes,
        ranks: S.cfg.ranks,
        enabledItems: S.cfg.enabledItems,
        customGroups: S.cfg.customGroups,
      });
    } catch (e) { /* プレビュー枠ではストレージ制限あり */ }

  function saveConfig() {
    captureConfigInputs();
    if (S.cfg.jobTypes.length === 0 || S.cfg.ranks.length === 0) {
      S.cfgStatus = { type: 'err', msg: '⚠ 職種・役職をそれぞれ最低1つ定義してください。' };
      renderConfig();
      return;
    }
    try {
      PrismStorage.saveCompanyConfig({
        companyId: S.cfg.companyId,
        companyName: S.cfg.companyName,
        jobTypes: S.cfg.jobTypes,
        ranks: S.cfg.ranks,
        enabledItems: S.cfg.enabledItems,
        customGroups: S.cfg.customGroups,
      });
      S.cfgStatus = { type: 'ok', msg: '✓ 設定を保存しました。問診ページ・集計に反映されます。' };

      S.cfgStatus = { type: 'err', msg: '⚠ 保存に失敗しました：' + esc(e.message)
        + '（プレビュー枠ではストレージが制限される場合があります。ローカルで開いてください）' };
