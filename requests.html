<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM LOGIC ─ 受検依頼一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --white:#fff; --soft:#ebedf0; --border:#e6e8ec;
  --border-strong:#d6d9df; --text:#1d1e22; --text2:#6c6e75; --dim:#a7a9b0;
  --accent:#16a34a; --accent-soft:rgba(22,163,74,.12); --btn:#1f2024;
  --red:#dc2626; --blue:#2563eb;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{ font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); }
.app{ max-width:920px; margin:0 auto; padding:0 20px 60px; }
header{
  display:flex; align-items:center; gap:12px; padding:16px 0;
  border-bottom:1px solid var(--border); margin-bottom:24px; flex-wrap:wrap;
}
.logo{ display:flex; align-items:center; gap:8px; }
.prism-icon{ width:28px; height:28px; }
.logo-text{
  font-size:16px; font-weight:700; letter-spacing:.5px;
  background:linear-gradient(135deg,#3b82f6,#22c55e,#ef4444);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.spacer{ flex:1; }
.user{ font-size:12px; color:var(--text2); }
.btn-ghost{
  font-size:12px; font-family:inherit; padding:7px 12px; background:var(--white);
  border:1px solid var(--border-strong); border-radius:8px; color:var(--text2); cursor:pointer;
}
.card{
  background:var(--white); border:1px solid var(--border);
  border-radius:12px; padding:20px 22px; margin-bottom:20px;
}
.card h2{ font-size:14px; font-weight:700; margin-bottom:16px; }
.bar{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.bar label{ font-size:12px; font-weight:600; color:var(--text2); }
select,input[type=text],input[type=date]{
  font-family:inherit; font-size:13.5px; padding:9px 11px;
  border:1px solid var(--border-strong); border-radius:8px;
  background:var(--white); color:var(--text);
}
select:focus,input:focus{ outline:none; border-color:var(--accent); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-bottom:16px; }
.form-grid .f-full{ grid-column:1/-1; }
.f label{ display:block; font-size:11.5px; font-weight:600; color:var(--text2); margin-bottom:5px; }
.f input{ width:100%; }
.btn{
  font-family:inherit; font-size:13px; font-weight:700; padding:10px 18px; color:#fff;
  background:var(--btn); border:0; border-radius:8px; cursor:pointer;
}
.btn:disabled{ opacity:.55; cursor:default; }
.msg{ font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:14px; }
.msg.err{ background:rgba(220,38,38,.09); color:var(--red); }
.msg.ok{ background:var(--accent-soft); color:var(--accent); }
.issued{
  background:var(--accent-soft); border:1px solid rgba(22,163,74,.25);
  border-radius:9px; padding:13px 14px; margin-top:14px;
}
.issued .lbl{ font-size:11.5px; font-weight:600; color:var(--accent); margin-bottom:7px; }
.issued .url-row{ display:flex; gap:8px; }
.issued input{ flex:1; font-size:12px; background:var(--white); }
.tablewrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th{
  text-align:left; font-size:11px; font-weight:600; color:var(--text2);
  padding:8px 10px; border-bottom:1px solid var(--border-strong); white-space:nowrap;
}
td{ padding:10px; border-bottom:1px solid var(--border); white-space:nowrap; }
tr:last-child td{ border-bottom:0; }
.badge{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; }
.badge.pending{ background:var(--soft); color:var(--text2); }
.badge.opened{ background:rgba(37,99,235,.1); color:var(--blue); }
.badge.completed{ background:var(--accent-soft); color:var(--accent); }
.copy-btn{
  font-family:inherit; font-size:11.5px; padding:5px 10px; background:var(--white);
  border:1px solid var(--border-strong); border-radius:7px; color:var(--text2); cursor:pointer;
}
.empty{ text-align:center; color:var(--dim); font-size:13px; padding:26px 0; }
.center{ text-align:center; color:var(--text2); font-size:13px; padding:40px 0; }
.muted{ font-size:11.5px; color:var(--dim); }
@media (max-width:560px){ .form-grid{ grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg class="prism-icon" viewBox="0 0 36 36" aria-hidden="true">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#22c55e"/>
          <stop offset="100%" stop-color="#ef4444"/></linearGradient></defs>
        <polygon points="18,3 33,31 3,31" fill="none" stroke="url(#g)" stroke-width="2.4"/>
      </svg>
      <span class="logo-text">PRISM LOGIC</span>
    </div>
    <div class="spacer"></div>
    <span class="user" id="userEmail"></span>
    <button class="btn-ghost" id="logoutBtn">ログアウト</button>
  </header>

  <div id="loading" class="center">読み込み中…</div>

  <main id="main" hidden>
    <div class="bar">
      <label for="companySel">対象企業</label>
      <select id="companySel"></select>
    </div>

    <section class="card">
      <h2>受検依頼を新規発行</h2>
      <div id="formMsg"></div>
      <div class="form-grid">
        <div class="f f-full"><label>氏名（必須）</label>
          <input type="text" id="fName" placeholder="例：山田 太郎"></div>
        <div class="f"><label>職種</label>
          <input type="text" id="fJob" list="jobList" placeholder="任意"></div>
        <div class="f"><label>役職</label>
          <input type="text" id="fRank" list="rankList" placeholder="任意"></div>
        <div class="f f-full"><label>受検期限（任意）</label>
          <input type="date" id="fExpiry"></div>
      </div>
      <datalist id="jobList"></datalist>
      <datalist id="rankList"></datalist>
      <button class="btn" id="issueBtn">発行する</button>
      <div id="issuedArea"></div>
    </section>

    <section class="card">
      <h2>受検依頼一覧</h2>
      <div id="listArea"></div>
    </section>
  </main>
</div>
<script>
const SUPABASE_URL = 'https://ntsqmhcyvopnsxdhtwzj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e6kLk_fC9OIiaMhiiqKjXA_pFE1KKc1';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
/* 問診ページ(index.html)はこのページと同じディレクトリにある前提。
   テスト環境(github.io)でも本番(独自ドメイン)でも自動で正しいURLになる。 */
const SURVEY_BASE = new URL('.', location.href).href;

const $ = id => document.getElementById(id);
let companies = [];
let currentCompanyId = null;

const STATUS = {
  pending:   { c:'pending',   t:'未着手' },
  opened:    { c:'opened',    t:'開封済' },
  completed: { c:'completed', t:'回答済' },
};

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())
    +' '+p(d.getHours())+':'+p(d.getMinutes());
}

async function init(){
  if (!sb){ $('loading').textContent = '接続に失敗しました。ページを再読み込みしてください。'; return; }
  let session = null;
  try {
    const r = await sb.auth.getSession();
    session = r.data.session;
  } catch (e) { session = null; }
  if (!session){ location.replace('login.html'); return; }
  $('userEmail').textContent = (session.user && session.user.email) || '';
  $('logoutBtn').onclick = logout;
  $('issueBtn').onclick = issue;
  $('companySel').onchange = () => { currentCompanyId = $('companySel').value; applyCompany(); };
  await loadCompanies();
  $('loading').hidden = true;
  $('main').hidden = false;
}

async function logout(){
  try { await sb.auth.signOut(); } catch (e) {}
  location.replace('login.html');
}

async function loadCompanies(){
  const { data, error } = await sb.from('companies').select('*').order('name');
  if (error){ $('loading').textContent = '企業データの取得に失敗しました：' + error.message; return; }
  companies = data || [];
  const sel = $('companySel');
  if (!companies.length){
    sel.innerHTML = '<option value="">（企業なし）</option>';
    $('listArea').innerHTML = '<div class="empty">アクセスできる企業がありません。担当者にお問い合わせください。</div>';
    return;
  }
  /* 企業の文脈: ?company= 指定があればそれ。無ければ単一企業なら自動確定、
     複数（スタッフが直接開いた場合）のみセレクタを表示する。 */
  const paramCompany = new URLSearchParams(location.search).get('company');
  let scoped = null;
  if (paramCompany && companies.some(c => c.id === paramCompany)) scoped = paramCompany;
  else if (companies.length === 1) scoped = companies[0].id;
  if (scoped){
    const bar = document.querySelector('.bar');
    if (bar) bar.hidden = true;            /* 企業が確定 → セレクタは出さない */
    currentCompanyId = scoped;
  } else {
    sel.innerHTML = companies.map(c =>
      '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
    currentCompanyId = companies[0].id;
  }
  applyCompany();
}

function applyCompany(){
  const c = companies.find(x => x.id === currentCompanyId);
  const jobs  = (c && Array.isArray(c.job_types)) ? c.job_types : [];
  const ranks = (c && Array.isArray(c.ranks))     ? c.ranks     : [];
  $('jobList').innerHTML  = jobs.map(j  => '<option value="'+esc(j)+'">').join('');
  $('rankList').innerHTML = ranks.map(r => '<option value="'+esc(r)+'">').join('');
  loadRequests();
}

async function loadRequests(){
  const area = $('listArea');
  if (!currentCompanyId){ area.innerHTML = '<div class="empty">企業を選択してください。</div>'; return; }
  area.innerHTML = '<div class="center">読み込み中…</div>';
  const { data, error } = await sb.from('survey_requests').select('*')
    .eq('company_id', currentCompanyId)
    .order('created_at', { ascending:false });
  if (error){ area.innerHTML = '<div class="msg err">一覧の取得に失敗しました：' + esc(error.message) + '</div>'; return; }
  renderList(data || []);
}

function renderList(rows){
  const area = $('listArea');
  if (!rows.length){
    area.innerHTML = '<div class="empty">まだ受検依頼はありません。上のフォームから発行してください。</div>';
    return;
  }
  let h = '<div class="tablewrap"><table><thead><tr>'
    + '<th>氏名</th><th>職種・役職</th><th>ステータス</th><th>発行日</th><th>受検URL</th>'
    + '</tr></thead><tbody>';
  rows.forEach(r => {
    const st = STATUS[r.status] || STATUS.pending;
    const jr = [r.job_type, r.rank].filter(Boolean).join('・') || '—';
    const url = SURVEY_BASE + '?t=' + r.token;
    h += '<tr>'
      + '<td>' + esc(r.respondent_name) + '</td>'
      + '<td>' + esc(jr) + '</td>'
      + '<td><span class="badge ' + st.c + '">' + st.t + '</span></td>'
      + '<td class="muted">' + fmtDate(r.created_at) + '</td>'
      + '<td><button class="copy-btn" data-url="' + esc(url) + '">URLをコピー</button></td>'
      + '</tr>';
  });
  h += '</tbody></table></div>';
  area.innerHTML = h;
  area.querySelectorAll('.copy-btn').forEach(b => {
    b.onclick = () => copyText(b.dataset.url, b);
  });
}

async function issue(){
  const msg = $('formMsg');
  msg.textContent = ''; msg.className = '';
  const name = $('fName').value.trim();
  if (!currentCompanyId){ msg.textContent = '対象企業を選択してください。'; msg.className = 'msg err'; return; }
  if (!name){ msg.textContent = '氏名を入力してください。'; msg.className = 'msg err'; return; }
  const btn = $('issueBtn');
  btn.disabled = true; btn.textContent = '発行中…';
  const payload = {
    company_id: currentCompanyId,
    respondent_name: name,
    job_type: $('fJob').value.trim() || null,
    rank: $('fRank').value.trim() || null,
    expires_at: $('fExpiry').value ? ($('fExpiry').value + 'T23:59:59') : null,
  };
  const { data, error } = await sb.from('survey_requests').insert(payload).select().single();
  btn.disabled = false; btn.textContent = '発行する';
  if (error){ msg.textContent = '発行に失敗しました：' + error.message; msg.className = 'msg err'; return; }
  msg.textContent = '✓ 受検依頼を発行しました。'; msg.className = 'msg ok';
  const url = SURVEY_BASE + '?t=' + data.token;
  $('issuedArea').innerHTML =
    '<div class="issued">'
    + '<div class="lbl">' + esc(data.respondent_name) + ' さんの受検URL（このリンクを本人に送ってください）</div>'
    + '<div class="url-row">'
    + '<input type="text" id="issuedUrl" value="' + esc(url) + '" readonly>'
    + '<button class="copy-btn" id="issuedCopy">コピー</button>'
    + '</div></div>';
  $('issuedCopy').onclick = () => copyText(url, $('issuedCopy'));
  $('fName').value = ''; $('fJob').value = ''; $('fRank').value = ''; $('fExpiry').value = '';
  loadRequests();
}

function copyText(text, btn){
  const done = () => {
    const o = btn.textContent;
    btn.textContent = 'コピー済み';
    setTimeout(() => { btn.textContent = o; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

init();
</script>
</body>
</html>
