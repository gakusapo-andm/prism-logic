<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM LOGIC ─ 受検依頼一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --white:#fff; --soft:#ebedf0; --border:#e6e8ec;
  --border-strong:#d6d9df; --text:#1d1e22; --text2:#6c6e75; --dim:#a7a9b0;
  --accent:#16a34a; --accent-soft:rgba(22,163,74,.12); --btn:#1f2024;
  --red:#dc2626; --blue:#2563eb;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{ font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); }
.app{ max-width:920px; margin:0 auto; padding:0 20px 60px; }
header{
  display:flex; align-items:center; gap:12px; padding:16px 0;
  border-bottom:1px solid var(--border); margin-bottom:24px; flex-wrap:wrap;
}
.logo{ display:flex; align-items:center; gap:8px; }
.prism-icon{ width:28px; height:28px; }
.logo-text{
  font-size:16px; font-weight:700; letter-spacing:.5px;
  background:linear-gradient(135deg,#3b82f6,#22c55e,#ef4444);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.spacer{ flex:1; }
.user{ font-size:12px; color:var(--text2); }
.btn-ghost{
  font-size:12px; font-family:inherit; padding:7px 12px; background:var(--white);
  border:1px solid var(--border-strong); border-radius:8px; color:var(--text2); cursor:pointer;
}
.card{
  background:var(--white); border:none;
  border-radius:8px; padding:20px 22px; margin-bottom:20px;
  box-shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.06);
}
.card h2{ font-size:14px; font-weight:700; margin-bottom:16px; }
.sec-title{ color:var(--accent); font-size:19px; font-weight:700; margin:18px 2px 14px; }
.sec-title:first-child{ margin-top:6px; }
.sec-title + .card{ margin-top:0; }
.bar{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.bar label{ font-size:12px; font-weight:600; color:var(--text2); }
select,input[type=text],input[type=date]{
  font-family:inherit; font-size:13.5px; padding:9px 11px;
  border:1px solid var(--border-strong); border-radius:8px;
  background:var(--white); color:var(--text);
}
select:focus,input:focus{ outline:none; border-color:var(--accent); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-bottom:16px; }
.form-grid .f-full{ grid-column:1/-1; }
.f label{ display:block; font-size:11.5px; font-weight:600; color:var(--text2); margin-bottom:5px; }
.f input{ width:100%; }
.btn{
  font-family:inherit; font-size:13px; font-weight:700; padding:10px 18px; color:#fff;
  background:var(--btn); border:0; border-radius:8px; cursor:pointer;
}
.btn:disabled{ opacity:.55; cursor:default; }
.msg{ font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:14px; }
.msg.err{ background:rgba(220,38,38,.09); color:var(--red); }
.msg.ok{ background:var(--accent-soft); color:var(--accent); }
.issued{
  background:var(--accent-soft); border:1px solid rgba(22,163,74,.25);
  border-radius:9px; padding:13px 14px; margin-top:14px;
}
.issued .lbl{ font-size:11.5px; font-weight:600; color:var(--accent); margin-bottom:7px; }
.issued .url-row{ display:flex; gap:8px; }
.issued input{ flex:1; font-size:12px; background:var(--white); }
.tablewrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th{
  text-align:left; font-size:11px; font-weight:600; color:var(--text2);
  padding:8px 10px; border-bottom:1px solid var(--border-strong); white-space:nowrap;
}
td{ padding:10px; border-bottom:1px solid var(--border); white-space:nowrap; }
tr:last-child td{ border-bottom:0; }
.badge{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; }
.badge.pending{ background:var(--soft); color:var(--text2); }
.badge.opened{ background:rgba(37,99,235,.1); color:var(--blue); }
.badge.completed{ background:var(--accent-soft); color:var(--accent); }
.copy-btn{
  font-family:inherit; font-size:11.5px; padding:5px 10px; background:var(--white);
  border:1px solid var(--border-strong); border-radius:7px; color:var(--text2); cursor:pointer;
}
.empty{ text-align:center; color:var(--dim); font-size:13px; padding:26px 0; }
.center{ text-align:center; color:var(--text2); font-size:13px; padding:40px 0; }
.muted{ font-size:11.5px; color:var(--dim); }
/* [v34-②a] 配布支援 */
.dist-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 12px; }
.dist-bar .dist-count{ font-size:12px; color:var(--text2); margin-right:auto; }
.act-btn{ font-family:inherit; font-size:11.5px; padding:5px 10px; background:var(--white);
  border:1px solid var(--border-strong); border-radius:7px; color:var(--text2); cursor:pointer; }
.act-btn.primary{ background:var(--accent-soft); border-color:rgba(22,163,74,.3); color:var(--accent); font-weight:700; }
.row-acts{ display:flex; gap:6px; flex-wrap:wrap; }
.qr-modal{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
  align-items:center; justify-content:center; z-index:1000; }
.qr-modal.show{ display:flex; }
.qr-card{ background:var(--white); border-radius:14px; padding:20px; width:300px; max-width:88vw;
  text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.25); }
.qr-card .qr-name{ font-weight:700; font-size:14px; margin-bottom:4px; }
.qr-card .qr-sub{ font-size:11px; color:var(--dim); margin-bottom:14px; word-break:break-all; }
.qr-box{ display:flex; justify-content:center; min-height:200px; align-items:center; }
.qr-box img, .qr-box canvas{ width:200px !important; height:200px !important; }
@media (max-width:560px){ .form-grid{ grid-template-columns:1fr; } }

<script>
const SUPABASE_URL = 'https://ntsqmhcyvopnsxdhtwzj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e6kLk_fC9OIiaMhiiqKjXA_pFE1KKc1';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
/* 問診ページ(index.html)はこのページと同じディレクトリにある前提。
   テスト環境(github.io)でも本番(独自ドメイン)でも自動で正しいURLになる。 */
const SURVEY_BASE = new URL('.', location.href).href;

const $ = id => document.getElementById(id);
let companies = [];
let currentCompanyId = null;

const STATUS = {
  pending:   { c:'pending',   t:'未着手' },
  opened:    { c:'opened',    t:'開封済' },
  completed: { c:'completed', t:'回答済' },
};

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())
    +' '+p(d.getHours())+':'+p(d.getMinutes());
}

async function init(){
  if (!sb){ $('loading').textContent = '接続に失敗しました。ページを再読み込みしてください。'; return; }
  let session = null;
  try {
    const r = await sb.auth.getSession();
    session = r.data.session;
  } catch (e) { session = null; }
  if (!session){ location.replace('login.html'); return; }
  $('userEmail').textContent = (session.user && session.user.email) || '';
  $('logoutBtn').onclick = logout;
  $('issueBtn').onclick = issue;
  $('tmplBtn').onclick = downloadTemplate;
  $('csvPickBtn').onclick = () => $('csvFile').click();
  $('csvFile').onchange = (e) => { const f = e.target.files[0]; if (f) onCsvFile(f); e.target.value = ''; };
  $('companySel').onchange = () => { currentCompanyId = $('companySel').value; applyCompany(); };
  await loadCompanies();
  $('loading').hidden = true;
  $('main').hidden = false;
}

async function logout(){
  try { await sb.auth.signOut(); } catch (e) {}
  location.replace('login.html');
}

async function loadCompanies(){
  const { data, error } = await sb.from('companies').select('*').order('name');
  if (error){ $('loading').textContent = '企業データの取得に失敗しました：' + error.message; return; }
  companies = data || [];
  const sel = $('companySel');
  if (!companies.length){
    sel.innerHTML = '<option value="">（企業なし）</option>';
    $('listArea').innerHTML = '<div class="empty">アクセスできる企業がありません。担当者にお問い合わせください。</div>';
    return;
  }
  /* 企業の文脈: ?company= 指定があればそれ。無ければ単一企業なら自動確定、
     複数（スタッフが直接開いた場合）のみセレクタを表示する。 */
  const paramCompany = new URLSearchParams(location.search).get('company');
  let scoped = null;
  if (paramCompany && companies.some(c => c.id === paramCompany)) scoped = paramCompany;
  else if (companies.length === 1) scoped = companies[0].id;
  if (scoped){
    const bar = document.querySelector('.bar');
    /* .bar は display:flex のため hidden 属性では消えない。inline style で確実に隠す。 */
    if (bar) bar.style.display = 'none';   /* 企業が確定 → セレクタは出さない */
    currentCompanyId = scoped;
  } else {
    sel.innerHTML = companies.map(c =>
      '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
    currentCompanyId = companies[0].id;
  }
  applyCompany();
}

function applyCompany(){
  const c = companies.find(x => x.id === currentCompanyId);
  const jobs  = (c && Array.isArray(c.job_types)) ? c.job_types : [];
  const ranks = (c && Array.isArray(c.ranks))     ? c.ranks     : [];
  $('jobList').innerHTML  = jobs.map(j  => '<option value="'+esc(j)+'">').join('');
  $('rankList').innerHTML = ranks.map(r => '<option value="'+esc(r)+'">').join('');
  loadRequests();
}

async function loadRequests(){
  const area = $('listArea');
  if (!currentCompanyId){ area.innerHTML = '<div class="empty">企業を選択してください。</div>'; return; }
  area.innerHTML = '<div class="center">読み込み中…</div>';
  const { data, error } = await sb.from('survey_requests').select('*')
    .eq('company_id', currentCompanyId)
    .order('created_at', { ascending:false });
  if (error){ area.innerHTML = '<div class="msg err">一覧の取得に失敗しました：' + esc(error.message) + '</div>'; return; }
  renderList(data || []);
}

let lastRows = [];
function rowUrl(r){ return SURVEY_BASE + '?t=' + r.token; }

function renderList(rows){
  const area = $('listArea');
  lastRows = rows || [];
  if (!lastRows.length){
    area.innerHTML = '<div class="empty">まだ受検依頼はありません。上のフォームから発行してください。</div>';
    return;
  }
  let h = '<div class="dist-bar">'
    + '<span class="dist-count">全 ' + lastRows.length + ' 件</span>'
    + '<button class="act-btn primary" id="mailAllBtn">メール一括送信</button>'
    + '<button class="act-btn" id="copyAllBtn">全URLを一括コピー</button>'
    + '<button class="act-btn" id="csvBtn">CSV書き出し（氏名＋URL）</button>'
    + '</div>';
  h += '<div class="tablewrap"><table><thead><tr>'
    + '<th>氏名</th><th>職種・役職</th><th>ステータス</th><th>発行日</th><th>配布</th>'
    + '</tr></thead><tbody>';
  lastRows.forEach((r, i) => {
    const st = STATUS[r.status] || STATUS.pending;
    const jr = [r.job_type, r.rank].filter(Boolean).join('・') || '—';
    const url = rowUrl(r);
    var sendBtn = '';
    if (r.email) {
      var sent = !!r.invited_at;
      sendBtn = '<button class="act-btn mail-send-btn" data-send-i="' + i + '" title="'
        + esc(r.email) + (sent ? ('（' + fmtDate(r.invited_at) + ' 送信済）') : '') + '">'
        + (sent ? '✓ 再送' : 'メール送信') + '</button>';
    }
    h += '<tr>'
      + '<td>' + esc(r.respondent_name) + '</td>'
      + '<td>' + esc(jr) + '</td>'
      + '<td><span class="badge ' + st.c + '">' + st.t + '</span></td>'
      + '<td class="muted">' + fmtDate(r.created_at) + '</td>'
      + '<td><div class="row-acts">'
      +   sendBtn
      +   '<button class="copy-btn" data-url="' + esc(url) + '">コピー</button>'
      +   '<button class="act-btn mail-btn" data-i="' + i + '">メール下書き</button>'
      +   '<button class="act-btn qr-btn" data-i="' + i + '">QR</button>'
      + '</div></td>'
      + '</tr>';
  });
  h += '</tbody></table></div>';
  area.innerHTML = h;
  area.querySelectorAll('.copy-btn').forEach(b => { b.onclick = () => copyText(b.dataset.url, b); });
  area.querySelectorAll('.mail-btn').forEach(b => { b.onclick = () => openMail(lastRows[+b.dataset.i]); });
  area.querySelectorAll('.qr-btn').forEach(b => { b.onclick = () => openQr(lastRows[+b.dataset.i]); });
  area.querySelectorAll('.mail-send-btn').forEach(b => { b.onclick = () => sendInvites([lastRows[+b.dataset.sendI].id], b); });
  const ca = $('copyAllBtn'); if (ca) ca.onclick = () => copyAllUrls(ca);
  const cs = $('csvBtn');     if (cs) cs.onclick = () => exportCsv();
  const ma = $('mailAllBtn'); if (ma) ma.onclick = () => sendAllInvites(ma);
}

/* [v34-②a] 全URLを一括コピー（氏名 <TAB> URL を1行ずつ）*/
function allUrlsText(){
  return lastRows.map(r => (r.respondent_name || '') + '\t' + rowUrl(r)).join('\n');
}
function copyAllUrls(btn){
  if (!lastRows.length) return;
  copyText(allUrlsText(), btn);
}

/* CSV書き出し（Excel-JP 用に BOM 付き・RFC4180 風エスケープ）*/
function csvCell(v){
  let s = String(v == null ? '' : v);
  /* CSV フォーミュラ・インジェクション対策：式として解釈される先頭文字を無効化。
     Excel/Sheets は先頭の ' をテキスト指示子として消費するため表示は変わらない。 */
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCsv(){
  const head = ['氏名','職種','役職','ステータス','発行日','受検URL'];
  const lines = [head.map(csvCell).join(',')];
  lastRows.forEach(r => {
    const st = (STATUS[r.status] || STATUS.pending).t;
    lines.push([
      r.respondent_name, r.job_type || '', r.rank || '', st, fmtDate(r.created_at), rowUrl(r)
    ].map(csvCell).join(','));
  });
  return '\uFEFF' + lines.join('\r\n');
}
function exportCsv(){
  if (!lastRows.length) return;
  const blob = new Blob([buildCsv()], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  const cn = (companies.find(x => x.id === currentCompanyId) || {}).name || 'company';
  a.href = URL.createObjectURL(blob);
  a.download = '受検依頼_' + cn + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} a.remove(); }, 100);
}

/* メール下書き（本人のメール宛先は未保有のため宛先は空、本文にURLを入れて起動）*/
function buildMailto(r){
  const cn = (companies.find(x => x.id === currentCompanyId) || {}).name || '';
  const subject = '【受検のお願い】適性問診のご案内';
  const body = (r.respondent_name || '') + ' 様\n\n'
    + 'お世話になっております。' + (cn ? (cn + ' の') : '') + '適性問診へのご協力をお願いいたします。\n'
    + '下記URLを開いてご回答ください（所要 約10分）。\n\n'
    + rowUrl(r) + '\n\n'
    + (r.expires_at ? ('回答期限：' + fmtDate(r.expires_at) + '\n\n') : '')
    + 'よろしくお願いいたします。';
  return 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}
function openMail(r){
  if (!r) return;
  window.location.href = buildMailto(r);
}

/* QRコード表示（クライアント側生成＝トークンを外部に送らない。
   ライブラリ未読込時はリンク表示にフォールバック）*/
let qrInstance = null;
function openQr(r){
  if (!r) return;
  const url = rowUrl(r);
  $('qrName').textContent = (r.respondent_name || '') + ' さん';
  $('qrSub').textContent = url;
  const box = $('qrBox');
  box.innerHTML = '';
  if (window.QRCode){
    try {
      qrInstance = new window.QRCode(box, {
        text: url, width: 200, height: 200,
        correctLevel: (window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : undefined)
      });
    } catch (e){
      box.innerHTML = '<div class="muted">QRを生成できませんでした。上のURLをご利用ください。</div>';
    }
  } else {
    box.innerHTML = '<div class="muted">QRライブラリを読み込めませんでした。上のURLをコピーしてご利用ください。</div>';
  }
  $('qrModal').classList.add('show');
}
function closeQr(){
  $('qrModal').classList.remove('show');
  $('qrBox').innerHTML = '';
  qrInstance = null;
}

/* [v36-②b] 受検URLをメール自動送信（Edge Function "send-invite" 経由）*/
const SEND_FN_URL = SUPABASE_URL + '/functions/v1/send-invite';
async function sendInvites(ids, btn){
  if (!ids || !ids.length) return;
  let label = null;
  if (btn){ label = btn.textContent; btn.disabled = true; btn.textContent = '送信中…'; }
  try {
    let session = null;
    try { const r = await sb.auth.getSession(); session = r.data.session; } catch (e) {}
    if (!session){ alert('セッションが切れています。再ログインしてください。'); return; }
    const res = await fetch(SEND_FN_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
        'apikey': SUPABASE_KEY,
      },
      body: JSON.stringify({ request_ids: ids, base: SURVEY_BASE }),
    });
    let j = {};
    try { j = await res.json(); } catch (e) {}
    if (!res.ok){ throw new Error(j.error || ('サーバーエラー (' + res.status + ')')); }
    const results = j.results || [];
    const ok = results.filter(x => x.ok);
    const ng = results.filter(x => !x.ok);
    if (ng.length){
      alert(ok.length + ' 件送信しました。' + ng.length + ' 件失敗：\n'
        + ng.map(f => (f.email || f.id) + ' … ' + (f.error || '不明')).join('\n'));
    } else {
      alert(ok.length + ' 件のメールを送信しました。');
    }
    await loadRequests();
  } catch (e) {
    alert('メール送信に失敗しました：' + e.message
      + '\n（送信機能のサーバー関数 "send-invite" とメール設定が必要です。EMAIL-SETUP.md を参照してください）');
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = label; }
  }
}
function sendAllInvites(btn){
  const targets = lastRows.filter(r => r.email);
  if (!targets.length){
    alert('メールアドレスが登録された受検者がいません。発行時にメールアドレスを入力してください。'); return;
  }
  if (!confirm('メールアドレスが登録された ' + targets.length
    + ' 名に受検案内メールを送信します。よろしいですか？\n（送信済みの方にも再送されます）')) return;
  return sendInvites(targets.map(r => r.id), btn);
}

async function issue(){
  const msg = $('formMsg');
  msg.textContent = ''; msg.className = '';
  const name = $('fName').value.trim();
  if (!currentCompanyId){ msg.textContent = '対象企業を選択してください。'; msg.className = 'msg err'; return; }
  if (!name){ msg.textContent = '氏名を入力してください。'; msg.className = 'msg err'; return; }
  const btn = $('issueBtn');
  btn.disabled = true; btn.textContent = '発行中…';
  const payload = {
    company_id: currentCompanyId,
    respondent_name: name,
    job_type: $('fJob').value.trim() || null,
    rank: $('fRank').value.trim() || null,
    expires_at: $('fExpiry').value ? ($('fExpiry').value + 'T23:59:59') : null,
    email: $('fEmail').value.trim() || null,
  };
  let res = await sb.from('survey_requests').insert(payload).select().single();
  /* email 列が無い環境（prism-survey-email.sql 未実行）では insert が 400 になる。
     その場合は email を外して再発行する（受検依頼自体は成立。メール保存・自動送信は列追加後）。 */
  let emailDropped = false;
  if (res.error && /email/.test(res.error.message || '')
      && /(column|schema cache)/i.test(res.error.message || '')) {
    const { email, ...noEmail } = payload;
    emailDropped = !!payload.email;
    res = await sb.from('survey_requests').insert(noEmail).select().single();
  }
  const { data, error } = res;
  btn.disabled = false; btn.textContent = '発行する';
  if (error){ msg.textContent = '発行に失敗しました：' + error.message; msg.className = 'msg err'; return; }
  msg.textContent = '✓ 受検依頼を発行しました。'
    + (emailDropped ? '（メール列が未追加のため、メールアドレスは未保存。prism-survey-email.sql を実行すると保存・自動送信が有効化されます）' : '');
  msg.className = 'msg ok';
  const url = SURVEY_BASE + '?t=' + data.token;
  $('issuedArea').innerHTML =
    '<div class="issued">'
    + '<div class="lbl">' + esc(data.respondent_name) + ' さんの受検URL（このリンクを本人に送ってください）</div>'
    + '<div class="url-row">'
    + '<input type="text" id="issuedUrl" value="' + esc(url) + '" readonly>'
    + '<button class="copy-btn" id="issuedCopy">コピー</button>'
    + '</div></div>';
  $('issuedCopy').onclick = () => copyText(url, $('issuedCopy'));
  $('fName').value = ''; $('fJob').value = ''; $('fRank').value = ''; $('fExpiry').value = ''; $('fEmail').value = '';
  loadRequests();
}

/* ───────────────────────────────────────────────────────────────
   CSV 一括発行（固定テンプレート・厳格検証）[v37]
   ─────────────────────────────────────────────────────────────── */
const CSV_HEADERS = ['氏名', '職種', '役職', '受検期限', 'メールアドレス'];

/* テンプレート（Excel-JP 用に BOM 付き）をダウンロード */
function downloadTemplate(){
  const sample = [
    ['山田 太郎', '営業', '主任', '2026/06/30', 'taro@example.com'],
    ['佐藤 花子', '', '', '', ''],
  ];
  const lines = [CSV_HEADERS.map(csvCell).join(',')]
    .concat(sample.map(r => r.map(csvCell).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '受検依頼テンプレート.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} a.remove(); }, 100);
}

/* 文字コード判定：UTF-8 で読み、置換文字(U+FFFD)が出たら Shift-JIS で読み直す。
   （顧客が Excel 保存した CSV は CP932 のことが多い） */
function decodeCsv(buf){
  const bytes = new Uint8Array(buf);
  let text = '';
  try { text = new TextDecoder('utf-8', { fatal: false }).decode(bytes); } catch (e) { text = ''; }
  if (text.indexOf('\uFFFD') !== -1){
    try { text = new TextDecoder('shift_jis').decode(bytes); } catch (e) { /* 非対応環境は UTF-8 のまま */ }
  }
  return text.replace(/^\uFEFF/, '');   // BOM 除去
}

/* クオート対応の簡易 CSV パーサ（RFC4180 風）。行 → セル配列の配列。 */
function parseCsv(text){
  const rows = []; let row = []; let cell = ''; let i = 0; let inQ = false;
  const s = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  while (i < s.length){
    const ch = s[i];
    if (inQ){
      if (ch === '"'){
        if (s[i + 1] === '"'){ cell += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      cell += ch; i++; continue;
    }
    if (ch === '"'){ inQ = true; i++; continue; }
    if (ch === ','){ row.push(cell); cell = ''; i++; continue; }
    if (ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += ch; i++;
  }
  row.push(cell); rows.push(row);
  return rows;
}

/* 日付正規化：YYYY/MM/DD または YYYY-MM-DD → YYYY-MM-DD。不正なら null。 */
function normDate(s){
  const m = /^\s*(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})\s*$/.exec(s || '');
  if (!m) return null;
  const iso = m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
  const dt = new Date(iso + 'T00:00:00');
  return isNaN(dt.getTime()) ? null : iso;
}
function looksEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s || ''); }

/* 名簿検証（純関数）。rows=parseCsv 結果, jobs/ranks=企業設定の許可値。
   戻り値: { records, hard[], warns[], unknownJobs[], unknownRanks[] } */
function validateRoster(rows, jobs, ranks){
  const hard = [], warns = [], records = [];
  const unkJobs = {}, unkRanks = {}, jobSet = {}, rankSet = {};
  (jobs || []).forEach(j => jobSet[j] = 1);
  (ranks || []).forEach(r => rankSet[r] = 1);
  if (!rows || !rows.length){ hard.push('CSV が空です。'); return { records, hard, warns, unknownJobs: [], unknownRanks: [] }; }

  const head = (rows[0] || []).map(h => (h || '').trim());
  const col = {};
  CSV_HEADERS.forEach(h => { col[h] = head.indexOf(h); });
  if (col['メールアドレス'] < 0) col['メールアドレス'] = head.indexOf('メール');
  if (col['氏名'] < 0){
    hard.push('ヘッダに「氏名」列がありません。配布テンプレートをご利用ください。');
    return { records, hard, warns, unknownJobs: [], unknownRanks: [] };
  }

  for (let i = 1; i < rows.length; i++){
    const r = rows[i] || [];
    const get = (key) => col[key] >= 0 ? (r[col[key]] || '').trim() : '';
    const name = get('氏名'), job = get('職種'), rank = get('役職'),
          exp = get('受検期限'), email = get('メールアドレス');
    if (!name && !job && !rank && !exp && !email) continue;     // 空行スキップ
    const ln = i + 1;                                           // 表示用行番号（ヘッダ=1行目）
    const before = hard.length;
    if (!name) hard.push(ln + '行目: 氏名が空です。');
    if (job && !jobSet[job]){ hard.push(ln + '行目: 職種「' + job + '」は設定にありません。'); unkJobs[job] = 1; }
    if (rank && !rankSet[rank]){ hard.push(ln + '行目: 役職「' + rank + '」は設定にありません。'); unkRanks[rank] = 1; }
    let isoExp = null;
    if (exp){ isoExp = normDate(exp); if (!isoExp) warns.push(ln + '行目: 受検期限「' + exp + '」を解釈できないため期限なしにします。'); }
    let useEmail = null;
    if (email){ if (looksEmail(email)) useEmail = email; else warns.push(ln + '行目: メール「' + email + '」の形式が不正なためメールなしで取り込みます。'); }
    if (hard.length > before) continue;                         // この行はエラー → records に積まない
    records.push({
      respondent_name: name,
      job_type: job || null,
      rank: rank || null,
      expires_at: isoExp ? (isoExp + 'T23:59:59') : null,
      email: useEmail,
    });
  }
  if (!records.length && !hard.length) hard.push('取り込めるデータ行がありません。');
  return { records, hard, warns, unknownJobs: Object.keys(unkJobs), unknownRanks: Object.keys(unkRanks) };
}

/* 受検依頼 payload 配列を作る（純関数） */
function rosterToPayloads(records, companyId){
  return (records || []).map(r => ({
    company_id: companyId,
    respondent_name: r.respondent_name,
    job_type: r.job_type,
    rank: r.rank,
    expires_at: r.expires_at,
    email: r.email,
  }));
}

function onCsvFile(file){
  const msg = $('csvMsg'); msg.textContent = ''; msg.className = '';
  $('csvArea').innerHTML = '';
  const fr = new FileReader();
  fr.onload = () => {
    let res;
    try {
      const rows = parseCsv(decodeCsv(fr.result));
      const c = companies.find(x => x.id === currentCompanyId) || {};
      res = validateRoster(rows, Array.isArray(c.job_types) ? c.job_types : [],
                                 Array.isArray(c.ranks) ? c.ranks : []);
    } catch (e){
      msg.textContent = 'CSV の解析に失敗しました：' + (e.message || e); msg.className = 'msg err'; return;
    }
    renderCsvPreview(res);
  };
  fr.onerror = () => { msg.textContent = 'ファイルの読み込みに失敗しました。'; msg.className = 'msg err'; };
  fr.readAsArrayBuffer(file);
}

function renderCsvPreview(res){
  const msg = $('csvMsg'); const area = $('csvArea');
  if (res.hard.length){
    let h = '<div class="msg err"><strong>取り込みを中止しました（' + res.hard.length + ' 件のエラー）</strong>';
    if (res.unknownJobs.length || res.unknownRanks.length){
      h += '<br>未登録の値: '
        + (res.unknownJobs.length ? '職種[' + res.unknownJobs.map(esc).join('・') + '] ' : '')
        + (res.unknownRanks.length ? '役職[' + res.unknownRanks.map(esc).join('・') + ']' : '')
        + '<br>→「初期設定」で上記を追加してから取り込み直してください。';
    }
    h += '<ul style="margin:8px 0 0;padding-left:20px;">'
      + res.hard.slice(0, 30).map(e => '<li>' + esc(e) + '</li>').join('')
      + (res.hard.length > 30 ? '<li>… ほか ' + (res.hard.length - 30) + ' 件</li>' : '')
      + '</ul></div>';
    area.innerHTML = h;
    return;
  }
  let h = '';
  if (res.warns.length){
    h += '<div class="msg" style="background:#fff7ed;color:#9a3412;">注意（取り込みは可能）：'
      + '<ul style="margin:6px 0 0;padding-left:20px;">'
      + res.warns.slice(0, 20).map(w => '<li>' + esc(w) + '</li>').join('')
      + (res.warns.length > 20 ? '<li>… ほか ' + (res.warns.length - 20) + ' 件</li>' : '')
      + '</ul></div>';
  }
  h += '<div class="dist-bar"><span class="dist-count">取り込み対象 ' + res.records.length + ' 件</span>'
    + '<button class="act-btn primary" id="csvIssueBtn">この ' + res.records.length + ' 件を一括発行</button>'
    + '<button class="act-btn" id="csvCancelBtn">取り消し</button></div>';
  h += '<div class="tablewrap"><table><thead><tr><th>氏名</th><th>職種</th><th>役職</th><th>受検期限</th><th>メール</th></tr></thead><tbody>';
  res.records.slice(0, 100).forEach(r => {
    h += '<tr><td>' + esc(r.respondent_name) + '</td><td>' + esc(r.job_type || '—')
      + '</td><td>' + esc(r.rank || '—') + '</td><td class="muted">'
      + (r.expires_at ? esc(r.expires_at.slice(0, 10)) : '—') + '</td><td class="muted">'
      + esc(r.email || '—') + '</td></tr>';
  });
  h += '</tbody></table></div>';
  if (res.records.length > 100) h += '<div class="muted" style="margin-top:6px;">（プレビューは先頭100件。発行は全' + res.records.length + '件）</div>';
  area.innerHTML = h;
  $('csvIssueBtn').onclick = (e) => bulkIssue(res.records, e.target);
  $('csvCancelBtn').onclick = () => { area.innerHTML = ''; msg.textContent = ''; msg.className = ''; };
}

async function bulkIssue(records, btn){
  const msg = $('csvMsg');
  if (!currentCompanyId){ msg.textContent = '対象企業が未選択です。'; msg.className = 'msg err'; return; }
  if (!records || !records.length) return;
  if (btn){ btn.disabled = true; btn.textContent = '発行中…'; }
  const payloads = rosterToPayloads(records, currentCompanyId);
  let res = await sb.from('survey_requests').insert(payloads).select();
  let emailDropped = false;
  if (res.error && /email/.test(res.error.message || '')
      && /(column|schema cache)/i.test(res.error.message || '')){
    emailDropped = payloads.some(p => p.email);
    res = await sb.from('survey_requests')
      .insert(payloads.map(p => { const { email, ...rest } = p; return rest; })).select();
  }
  if (res.error){
    if (btn){ btn.disabled = false; btn.textContent = 'もう一度発行'; }
    msg.textContent = '一括発行に失敗しました：' + res.error.message; msg.className = 'msg err'; return;
  }
  msg.textContent = '✓ ' + ((res.data && res.data.length) || records.length) + ' 件の受検依頼を発行しました。'
    + (emailDropped ? '（メール列が未追加のため、メールアドレスは未保存。prism-survey-email.sql を実行すると有効化）' : '');
  msg.className = 'msg ok';
  $('csvArea').innerHTML = '';
  loadRequests();
}

function copyText(text, btn){
  const done = () => {
    const o = btn.textContent;
    btn.textContent = 'コピー済み';
    setTimeout(() => { btn.textContent = o; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}
